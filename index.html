<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/png" sizes="192x192" href="/khejur-bag-school/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/khejur-bag-school/icon-512.png" />
<link rel="manifest" href="/khejur-bag-school/manifest.json" />
<meta name="theme-color" content="#1e3a8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="স্কুল অ্যাপ" />
<link rel="apple-touch-icon" href="/khejur-bag-school/icon-192.png" />
<title>স্কুল অ্যাপ — একটাই লাইভ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5908514937426090"
     crossorigin="anonymous"></script>
<style>
/* ===== Khejur Bag Digital School 2 — unique theme =====
   Deep blue + sky blue + warm orange. NOT the madrasa green/gold look.
   Only the look changed here — every feature, text and class stays. */
:root{
  color-scheme: light dark;
  --bg:#eef4ff; --surface:#ffffff; --surface-alt:#e8f1fe; --text:#0f2040; --dim:#5b6b8c;
  --border:#d5e2f5; --accent:#1d4ed8; --accent-strong:#1e3a8a; --sky:#0ea5e9; --on-accent:#ffffff;
  --gold:#f97316; --gold-strong:#ea580c; --urgent:#dc2626; --urgent-bg:#fef2f2;
  --danger:#dc2626; --ok:#0284c7; --radius:20px;
  --shadow:0 8px 24px rgba(30,58,138,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1226; --surface:#141d38; --surface-alt:#1c2a4d; --text:#e8eefc; --dim:#9db0d6;
    --border:#2a3a63; --accent:#60a5fa; --accent-strong:#1e3a8a; --sky:#38bdf8; --on-accent:#ffffff;
    --gold:#fb923c; --gold-strong:#fb923c; --urgent:#f87171; --urgent-bg:#2a1512;
    --danger:#f87171; --ok:#38bdf8; --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--text)}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}
.ic.sm{width:16px;height:16px}
.ic.lg{width:26px;height:26px}

/* ---------- masthead: deep-blue gradient, rounded bottom, orange badge ---------- */
header.mast{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 55%,#0ea5e9 100%);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 10px 28px rgba(30,58,138,.35);padding-bottom:6px}
.mast-in{display:flex;align-items:center;gap:14px;padding:22px 18px 18px}
.logo-btn{border:0;background:none;padding:0;border-radius:24px}
.logo-btn img{width:72px;height:72px;border-radius:24px;object-fit:cover;background:#fff;padding:3px;box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(0,0,0,.25)}
.mast-name{font-size:21px;font-weight:800;line-height:1.3;margin:0;letter-spacing:.01em}
.mast-en{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8);margin:2px 0 6px}
.school-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;margin-top:2px}
.mast-sub{font-size:13px;color:rgba(255,255,255,.85);margin:1px 0 0}
.mast-addr{font-size:13px;color:rgba(255,255,255,.7);margin:0}
.mast-actions{margin-left:auto;display:flex;gap:8px;align-items:flex-start}
.icon-btn{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:10px;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.32)}
.icon-btn.gold{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.45)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-anchor{position:relative}
.menu-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:288px;max-width:86vw;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:left}
.menu-panel .menu-head{padding:10px 16px;background:var(--surface-alt);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.menu-grid button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-radius:14px;font-weight:600;font-size:14px;color:var(--text)}
.menu-grid button:active,.menu-grid button:hover{background:var(--surface-alt)}
.menu-grid button .ic{color:var(--accent)}
.menu-rows{border-top:1px solid var(--border);padding:8px}
.menu-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:14px;text-align:left;color:var(--text)}
.menu-row:active,.menu-row:hover{background:var(--surface-alt)}
.menu-row .ic{color:var(--gold-strong)}
.menu-row b{display:block;font-size:14px}
.menu-row small{display:block;color:var(--dim);font-size:12px;line-height:1.35}
.menu-scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.3);border:0;padding:0}

/* ---------- tab bar: modern horizontal pill tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:0;padding:6px 0}
.tabs-in{display:flex;padding:4px 10px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab-btn{flex:none;border:0;background:var(--surface);display:flex;flex-direction:row;align-items:center;gap:6px;padding:9px 15px;margin:3px;font-size:13px;font-weight:600;color:var(--dim);border-radius:999px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(30,58,138,.06)}
.tab-btn .bar{display:none}
.tab-btn.active{color:#fff;font-weight:700;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);border-color:transparent;box-shadow:0 4px 14px rgba(29,78,216,.4)}
.tab-btn.active .ic{color:#fff}

main{padding:18px 16px 28px}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2.sec-title{font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:9px;font-weight:800}
h2.sec-title::before{content:"";width:6px;height:22px;border-radius:99px;background:linear-gradient(#f97316,#0ea5e9);flex:none}
h2.sec-title .ic{color:var(--accent)}
p.dim,.dim{color:var(--dim)}
.small{font-size:13px}
.empty{padding:26px 10px;text-align:center;color:var(--dim)}

/* founder + photo strip */
.founder-card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-top:5px solid var(--gold);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.founder-card img{width:92px;height:92px;border-radius:20px;object-fit:cover;flex:none}
.avatar-fallback{width:92px;height:92px;border-radius:20px;background:var(--surface-alt);display:grid;place-items:center;color:var(--dim);flex:none}
.founder-card h3{margin:0 0 2px;font-size:18px}
.chip{display:inline-block;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:2px 11px;font-size:12px;color:var(--dim)}
.strip-outer{overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);margin-bottom:16px;padding:10px 0;box-shadow:var(--shadow)}
.strip-track{display:inline-flex;gap:18px;padding:0 12px;white-space:nowrap;animation:strip-scroll 36s linear infinite;will-change:transform}
@keyframes strip-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.strip-item{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:84px;white-space:normal;text-align:center}
.strip-item img{width:64px;height:64px;border-radius:999px;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
.strip-item span{font-size:12px;line-height:1.3}
.strip-item small{font-size:11px;color:var(--dim);line-height:1.3}

.notice{border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:18px;background:var(--surface);padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.notice h3{margin:0 0 4px;font-size:16px}
.notice .meta{font-size:12px;color:var(--dim);margin-bottom:6px}
.notice p{margin:0;white-space:pre-wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:11px;font-weight:700;background:var(--surface-alt);color:var(--dim);border:1px solid var(--border)}
.pill.urgent{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.pill.gold{background:#fff7ed;color:var(--gold-strong);border-color:var(--gold)}
@media (prefers-color-scheme: dark){.pill.gold{background:#2c1a0e}}

/* students / teachers */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-row select,.filter-row input[type=search]{flex:1;min-width:140px}
.person{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;color:var(--text);box-shadow:var(--shadow)}
.person img{width:56px;height:56px;border-radius:18px;object-fit:cover;flex:none}
.person .avatar-fallback{width:56px;height:56px;border-radius:18px}
.person b{display:block}
.person small{display:block;color:var(--dim)}
.person .chev{margin-left:auto;color:var(--dim)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-box{background:var(--surface-alt);border-radius:16px;padding:12px}
.detail-box h4{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
.detail-box h4 .ic{width:17px;height:17px;color:var(--accent)}
.detail-box p{margin:3px 0;font-size:14px}
@media (max-width:560px){.detail-grid{grid-template-columns:1fr}}

/* forms */
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:600}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:14px;background:var(--surface);font-size:15px}
textarea{resize:vertical;min-height:74px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:1px;border-color:var(--sky)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:var(--on-accent);box-shadow:0 4px 14px rgba(29,78,216,.35)}
.btn:active{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 4px 14px rgba(234,88,12,.35)}
.btn.white{background:#fff;color:var(--accent-strong)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
.btn.small{padding:8px 13px;font-size:13px;border-radius:999px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0;background:var(--urgent-bg);color:var(--urgent)}
.msg.ok{background:#e0f2fe;color:var(--ok)}
@media (prefers-color-scheme: dark){.msg.ok{background:#0c2a44}}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* admin */
.admin-subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.admin-subnav button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--dim)}
.admin-subnav button.active{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(29,78,216,.35)}
.list-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:16px;padding:11px 13px;margin-bottom:8px;background:var(--surface);box-shadow:var(--shadow)}
.list-row img{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none}
.list-row .grow{flex:1;min-width:0}
.list-row b{display:block}
.list-row small{display:block;color:var(--dim)}
.mini-btn{border:1px solid var(--border);background:var(--surface-alt);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.mini-btn.danger{color:var(--danger)}
.att-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:9px 2px;flex-wrap:wrap}
.att-row:last-child{border-bottom:0}
.att-row .grow{flex:1;min-width:120px}
.att-tick{width:30px;height:30px;flex:none;accent-color:var(--accent);cursor:pointer;margin:0}
.att-total{background:var(--surface-alt);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.att-total .big{font-size:22px;font-weight:700;color:var(--accent);line-height:1.25}
.att-total-line{font-size:16px;margin:14px 0 0;text-align:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on-present{background:var(--accent);color:#fff}
.seg button.on-absent{background:var(--danger);color:#fff}
.seg button.on-late{background:var(--gold);color:#fff}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img{width:64px;height:64px;border-radius:16px;object-fit:cover}

/* share / install card + sheets */
.share-card{background:linear-gradient(135deg,#1e3a8a,#0284c7);color:#fff;border-radius:var(--radius);padding:18px;margin-top:20px;box-shadow:0 10px 28px rgba(30,58,138,.35)}
.share-card h2{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center}
.share-card h2 .ic{color:#fdba74}
.share-card p{margin:0 0 12px;font-size:14px;color:rgba(255,255,255,.88)}
.share-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-card .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:0}
.sheet-scrim{position:fixed;inset:0;z-index:70;background:rgba(15,32,64,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}
@media (min-width:640px){.sheet-scrim{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;gap:8px;align-items:center}
.sheet h2 .ic{color:var(--accent)}
.sheet .close-x{margin-left:auto;border:0;background:var(--surface-alt);border-radius:999px;padding:7px;display:grid;place-items:center;color:var(--dim)}
.link-box{display:flex;gap:8px;align-items:stretch;margin:10px 0}
.link-box input{flex:1;font-size:13px}
.qr-box{display:grid;place-items:center;padding:14px;background:#fff;border:1px solid var(--border);border-radius:18px;margin:12px 0}
.qr-box svg{max-width:220px;height:auto}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin-bottom:6px}
footer.login-entry{margin-top:34px;border-top:1px solid var(--border);padding-top:16px;text-align:center}
.status-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);justify-content:center;margin-top:10px}
.dot{width:9px;height:9px;border-radius:99px;background:var(--gold);flex:none}
.dot.on{background:#22c55e}
.dot.off{background:var(--danger)}

/* ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(90deg,#dc2626,#ea580c);color:#fff;overflow:hidden;padding:9px 0;font-weight:600;font-size:14px}
.ticker-track{display:inline-flex;white-space:nowrap;animation:ticker-scroll 22s linear infinite;will-change:transform}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-track span{padding-right:56px}
@media (prefers-reduced-motion: reduce){.ticker-track,.strip-track{animation:none}}
body.has-ticker main{padding-bottom:64px}

/* empty ad slot (placeholder only — no ad code, no external script) */
.ad-slot-banner{margin:18px 0 4px;padding:18px 12px;text-align:center;border:1px dashed #94a3b8;border-radius:14px;background:#f8fafc;color:#64748b;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:95;background:#1e3a8a;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:92vw;text-align:center}

/* notification permission popup */
.notify-scrim{position:fixed;inset:0;z-index:85;background:rgba(15,32,64,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.notify-card{background:var(--surface);color:var(--text);width:100%;max-width:420px;border-radius:24px;padding:26px 22px 22px;box-shadow:var(--shadow);text-align:center}
.notify-badge{width:64px;height:64px;border-radius:999px;background:#fff7ed;color:var(--gold-strong);display:grid;place-items:center;margin:0 auto 14px}
.notify-badge .ic{width:30px;height:30px}
.notify-card h2{margin:0 0 8px;font-size:19px;line-height:1.4}
.notify-card p{margin:0 0 18px;color:var(--dim);font-size:14px}
.notify-card .btn{width:100%}
.notify-card .btn.ghost{margin-top:8px}
.azan-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-alt);border-radius:10px;padding:7px 12px}
.azan-row span{font-size:14px}
.azan-row b{font-size:15px}
.azan-times{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:4px 0}
.call-ring{animation:callring 1.2s ease-in-out infinite}
@keyframes callring{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.chat-thread{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ticker" class="ticker" hidden><div class="ticker-track" id="tickerTrack"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
<script>
"use strict";
/* ================================================================
   স্কুল অ্যাপ — একটাই লাইভ
   একই পেজ, একই লিংক: শিক্ষার্থী ভিউ + অ্যাডমিন প্যানেল।
   ডেটা থাকে Firebase Realtime Database-এ (ফ্রি) — অ্যাডমিন আপডেট
   দিলে সব শিক্ষার্থীর ফোনে সাথে সাথে দেখা যায়।

/* ---------------- notifications ----------------
   On entry, guardians are asked (popup) to turn notifications on.
   "নোটিফিকেশন অন করুন" asks the browser for permission and then
   registers this device for Firebase Cloud Messaging (FCM): the FCM
   token is saved to the database (schoolApp/v1/fcmTokens), and the
   bundled service worker (the bundled FCM service worker — see FCM_SW_DATA) receives
   pushes even while the app is closed or the phone is locked, shows
   them on the lock screen, and opens the app on the notice board when
   tapped. "পরে করবো" hides the popup only for this visit, so it comes
   back next time.
   While the app is open, a NEW urgent notice arriving through the
   live sync also pops a phone notification. Ids of urgent notices
   already seen on this device are kept (same local storage the app
   already uses) so old notices never re-notify. */
var NOTIFY_SEEN_KEY = "school-one-live-notify-seen";

}

}

function loadKnownUrgent(){
  if(knownUrgentIds) return;
  try{
    var raw = localStorage.getItem(NOTIFY_SEEN_KEY);
    if(raw){ var parsed = JSON.parse(raw); if(Array.isArray(parsed)){ knownUrgentIds = parsed; return; } }
  }catch(e){}
  knownUrgentIds = D ? D.notices.filter(function(n){ return n.urgent && canSeeNotice(n); }).map(function(n){ return n.id; }) : [];
  saveKnownUrgent();
}
function saveKnownUrgent(){
  try{ localStorage.setItem(NOTIFY_SEEN_KEY, JSON.stringify((knownUrgentIds||[]).slice(0,60))); }catch(e){}
}
function fireNoticeNotification(n){
  if(!notifySupported() || Notification.permission!=="granted") return;
  try{
    var notif = new Notification((D && D.settings && D.settings.nameBn) || SCHOOL_NAME, {
      body: "জরুরি নোটিশ: " + n.title,
      icon: SCHOOL_LOGO,
      tag: "school-urgent-" + n.id
    });
    notif.onclick = function(){
      try{ window.focus(); }catch(e){}
      ui.tab = "home"; ui.studentDetailId = null;
      /* A system-notification tap can land while a photo pick is open
         (the gallery is a separate activity) — hold instead of
         rebuilding, or the pick's change event is swallowed. */
      holdOrRender();
      try{ notif.close(); }catch(e){}
    };
  }catch(e){}
}

function maybeNotifyNewUrgent(notices){
  loadKnownUrgent();

function requestNotifyPermission(){
  if(!notifySupported()){ toast("এই ব্রাউজারে নোটিফিকেশন সুবিধা নেই"); render(); return; }
  var done = function(perm){
    if(perm==="granted"){
      // Everything already on the board counts as seen — only notices
      // published from now on should pop a notification.
      knownUrgentIds = D ? D.notices.filter(function(n){ return n.urgent && canSeeNotice(n); }).map(function(n){ return n.id; }) : [];
      saveKnownUrgent();
      // Register this phone for FCM push, so later urgent notices reach
      // the lock screen even with the app closed (see the FCM section).
      // The message shown reflects what ACTUALLY happened: only when a
      // token was really collected and saved is lock-screen delivery
      // promised; otherwise the guardian is told notifications work
      // while the app is open (registration completes once the admin
      // has entered the FCM VAPID key in Settings).
      registerFcmToken().then(function(registered){
        // OneSignal counts too: permission was just granted through
        // OneSignal on the app's real address, so this phone's push
        // subscription exists and lock-screen pushes will reach it.
        var osReadyForPush = false;
        try{ osReadyForPush = !!OneSignalRef && oneSignalSiteOk(); }catch(e){}
        toast(registered || osReadyForPush
          ? "নোটিফিকেশন চালু হয়েছে — অ্যাপ বন্ধ বা ফোন লক থাকলেও জরুরি নোটিশের নোটিফিকেশন আসবে"
          : "নোটিফিকেশন চালু হয়েছে — অ্যাপ খোলা থাকলে জরুরি নোটিশ জানানো হবে");
        /* Async network resolution: the user may have opened a photo
           pick while this was in flight — hold instead of rebuilding. */
        holdOrRender();
      });
      try{
        var hello = new Notification((D && D.settings && D.settings.nameBn) || SCHOOL_NAME, {
          body: "নোটিফিকেশন চালু হয়েছে। জরুরি নোটিশ এলেই এভাবে জানানো হবে।",
          icon: SCHOOL_LOGO,
          tag: "school-notify-on"
        });
        hello.onclick = function(){ try{ window.focus(); }catch(e){} try{ hello.close(); }catch(e){} };
      }catch(e){}
    } else if(perm==="denied"){
      toast("নোটিফিকেশন বন্ধ করা আছে — চালু করতে ব্রাউজারের সাইট সেটিংস থেকে Notification Allow করুন");
    } else {
      toast("নোটিফিকেশন চালু হয়নি — আবার চেষ্টা করুন");
    }
    render();
  };
  var nativeAsk = function(){
    try{
      var p = Notification.requestPermission();
      if(p && typeof p.then==="function") p.then(done).catch(function(){ render(); });
      else Notification.requestPermission(done);
    }catch(e){ render(); }
  };
  // When OneSignal is live on this address, ask through OneSignal:
  // its prompt IS the browser's own permission prompt, and allowing
  // it also creates this phone's OneSignal subscription — the thing
  // the admin's dashboard pushes are addressed to. On any other
  // address (or if the SDK did not load), use the plain prompt.
  if(OneSignalRef && OneSignalRef.Notifications && typeof OneSignalRef.Notifications.requestPermission==="function"){
    var osSettled = false;
    var osFallback = setTimeout(function(){
      if(!osSettled && Notification.permission==="default"){ osSettled = true; nativeAsk(); }

        if(osSettled) return; osSettled = true; clearTimeout(osFallback);
        done(Notification.permission);
      }).catch(function(){
        if(osSettled) return; osSettled = true; clearTimeout(osFallback); nativeAsk();
      });
    }catch(e){ clearTimeout(osFallback); nativeAsk(); }
  } else nativeAsk();
}

   Only the OneSignal App ID lives in the app: an App ID is public
   by design (it merely names the OneSignal app this page belongs
   to). The REST API key is deliberately NOT in the app and never
   will be: it can send pushes to everyone, so it stays server-side
   in the admin's OneSignal account, and pushes are sent from the
   OneSignal dashboard (Messages → New Push).

   Flow:
   1. On the app's real address (the GitHub Pages site below),
      initOneSignal() starts the OneSignal Web SDK with the bundled
       worker (/khejur-bag-school/OneSignalSDKWorker.js at the repo root), so its scope is the whole app.

   2. A guardian tapping "নোটিফিকেশন অন করুন" in the entry popup is
      asked through OneSignal (see requestNotifyPermission): allowing
      the browser prompt creates this phone's OneSignal subscription.
      A phone that already allowed notifications is opted in quietly.
   3. The admin publishes the urgent notice here as usual, then sends
      the same text as a push from the OneSignal dashboard; subscribed
      phones show it on the lock screen even with the app closed, and
      tapping it opens the app.

   started at all, so nothing here can disturb the rest of the app. */

/* ---------------- Firebase Cloud Messaging (FCM) push ----------------
   The lock-screen half of notifications. Flow:
   1. Guardian taps "নোটিফিকেশন অন করুন" in the popup → browser
      permission → registerFcmToken() below registers the bundled
      service worker (the bundled FCM service worker — see FCM_SW_DATA), asks FCM for
      this phone's token, and saves it in the database under
      schoolApp/v1/fcmTokens so the admin side can reach it.
   2. When an admin publishes an URGENT notice, sendFcmPush() reads
      those tokens and posts the push to FCM for each of them; phones
      receive it through their service worker even with the app closed
      or the phone locked, and tapping it opens the notice board.
   2. When an admin publishes an URGENT notice, sendFcmPush() calls
      the push-server endpoint (a Firebase Cloud Function whose URL
      the admin enters in Settings). That function — running
      server-side, where the service account belongs — reads the
      tokens and sends the FCM HTTP v1 push; phones receive it
      through their service worker even with the app closed or the
      phone locked, and tapping it opens the notice board.
   What the admin enters in Settings → পুশ নোটিফিকেশন (FCM):
   - Web Push certificate (VAPID) public key (Project settings →
     Cloud Messaging) — public by design, so it is kept in the synced
     settings and every guardian phone uses it to register its token.
   - The push-server (Cloud Function) URL — just a link, not a
     secret; the function's service account never touches any phone.
   No sending credential is ever stored in this app: a service
   account's private key in browser storage would hand anyone who
   touches the admin phone the whole Firebase project.
   Until the VAPID key is entered, permission + the in-app urgent
   notification above still work; token registration simply waits,
   the popup does not promise lock-screen delivery, and the message
   after granting reflects exactly what actually happened. */

function registerFcmToken(){
  if(fcmState === "registered") return Promise.resolve(true);
  if(!notifySupported() || Notification.permission!=="granted"){ return Promise.resolve(false); }
  if(!fcmSupported()){ fcmState = "unsupported"; return Promise.resolve(false); }
  var vapid = fcmVapidKey();
  if(!vapid){ fcmState = "nokey"; return Promise.resolve(false); }
  var msg = fcmMessaging();
  if(!msg){ fcmState = "error"; return Promise.resolve(false); }
  var swUrl;
  try{ swUrl = new URL(FCM_SW_DATA, document.baseURI).href; }
  catch(e){ swUrl = FCM_SW_DATA; }
  return navigator.serviceWorker.register(swUrl).then(function(reg){
    var opts = { vapidKey: vapid, serviceWorkerRegistration: reg };
    return Promise.resolve().then(function(){ return msg.getToken(opts); }).catch(function(){
      // Older compat builds take the worker via useServiceWorker().
      if(msg.useServiceWorker){ msg.useServiceWorker(reg); return msg.getToken({ vapidKey: vapid }); }
      throw new Error("getToken failed");
    });
  }).then(function(token){
    if(!token){ fcmState = "error"; return false; }
    try{ localStorage.setItem(FCM_TOKEN_KEY, token); }catch(e){}
    fcmState = "registered";
    bindFcmForeground();
    return sha256(token).then(function(h){
      var base = fcmDbBase();
      if(!base) return true;
      return fetch(base + "/schoolApp/v1/fcmTokens/" + h + ".json" + authQuery(), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, updatedAt: new Date().toISOString(), ua: String(navigator.userAgent || "").slice(0, 120) })
      }).then(function(){ return true; }).catch(function(){ return true; });
    });
  }).catch(function(){ fcmState = "error"; return false; });
}
/* A push that arrives while the app is open: show it as a notification
   too, and mark the notice seen so the live-sync path does not repeat it. */
function bindFcmForeground(){
  if(fcmForegroundBound) return;
  var msg = fcmMessaging();
  if(!msg || !msg.onMessage) return;
  fcmForegroundBound = true;
  try{
    msg.onMessage(function(payload){
      var data = (payload && payload.data) || {};
      var n = (payload && payload.notification) || {};
      var notice = { id: data.noticeId || ("fcm" + Date.now()), title: String(n.body || data.body || n.title || data.title || "জরুরি নোটিশ").replace(/^জরুরি নোটিশ:\s*/, "") };
      loadKnownUrgent();
      if(knownUrgentIds.indexOf(notice.id) < 0){ knownUrgentIds.unshift(notice.id); saveKnownUrgent(); }
      var foundNotice = (D && D.notices || []).filter(function(x){ return x.id===notice.id; })[0];
      if(foundNotice && !canSeeNotice(foundNotice)) return;
      fireNoticeNotification(notice);
    });
  }catch(e){}
}
/* Admin side: hand a freshly published urgent notice to the
   push server. The actual FCM send happens server-side (a Firebase
   Cloud Function holding the service account): it reads the tokens
   from schoolApp/v1/fcmTokens, posts each push to the FCM HTTP v1
   API, and prunes dead tokens. This app only sends the notice's
   title/body/id to the function's URL — no credential of any kind
   is stored in or sent from the browser. */
function sendFcmPush(notice){
  var url = fcmSendUrl();
  if(!url){
    toast("নোটিশ প্রকাশ হয়েছে — লক-স্ক্রিন পুশ পাঠাতে সেটিংসে পুশ-সার্ভারের লিংক বসান");
    return;
  }
  var title = (D && D.settings && D.settings.nameBn) || SCHOOL_NAME;
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      noticeId: String(notice.id || ""),
      title: title,
      body: "জরুরি নোটিশ: " + notice.title
    })
  }).then(function(r){
    if(!r.ok) throw new Error("push server " + r.status);
    return r.json().catch(function(){ return {}; });
  }).then(function(res){
    if(res && typeof res.sent === "number"){
      toast("পুশ পাঠানো হয়েছে " + bnNum(res.sent) + "টি ফোনে" + (res.pruned ? " — পুরনো " + bnNum(res.pruned) + "টি টোকেন মুছে দেওয়া হয়েছে" : ""));
    } else {
      toast("পুশ পাঠানোর অনুরোধ সার্ভারে পৌঁছেছে");
    }
  }).catch(function(){ toast("নোটিশ প্রকাশ হয়েছে — পুশ পাঠাতে সমস্যা হয়েছে, নেট ও পুশ-সার্ভারের লিংক চেক করুন"); });
}

/* Order-independent fingerprint of a dataset. Used to recognise when a
   sync snapshot carries nothing new — or is just the echo of this
   device's own save — so the UI is not rebuilt for no reason. */
function stableSig(o){
  if(o===null || typeof o!=="object") return JSON.stringify(o)||"";
  if(Array.isArray(o)) return "["+o.map(stableSig).join(",")+"]";
  return "{"+Object.keys(o).sort().map(function(k){ return JSON.stringify(k)+":"+stableSig(o[k]); }).join(",")+"}";
}
/* Renders triggered by background sync. If the user is mid-tap, the
   render is held until the tap finishes: rebuilding the DOM between
   touchstart and click destroys the tapped element and swallows the
   tap — the "tap several times to change tab" bug. User-initiated
   renders never come through here and always run immediately. */
function renderFromSync(){
  if(pointerDown || typingActive || photoPickOpen || ui.meetingView){ syncRenderPending = true; return; }
  /* Throttle: at most one sync rebuild per 500 ms. A rebuild that arrives
     too soon is queued once (never stacked) and runs when the window opens.
     The fingerprint check itself lives in applyPublicSnapshot() (sig vs
     lastPubSig) and in restFetchPublic() (restLastJson) — unchanged
     snapshots never reach here, so this throttle only ever delays real
     changes, and only by <500 ms. */
  var now = Date.now();
  if(now - lastSyncRenderAt < 500){
    if(!syncRenderTimer){
      syncRenderTimer = setTimeout(function(){
        syncRenderTimer = null;
        /* Re-check the hold inside the deferred callback: a tap, a text
           field, a photo pick or a live meeting may have started after
           the timer was set — rendering now would destroy the element
           the user is interacting with (e.g. the file input the native
           gallery is bound to). Stay pending; the flush runs it once
           the hold clears. */
        if(pointerDown || typingActive || photoPickOpen || ui.meetingView){ syncRenderPending = true; return; }
        lastSyncRenderAt = Date.now(); render();
      }, 500 - (now - lastSyncRenderAt));
    }
    return;
  }
  lastSyncRenderAt = now;
  render();
}
function flushSyncRender(){
  if(!syncRenderPending) return;
  /* Still mid-tap or mid-typing (e.g. the tap landed in a text field):
     stay pending — the focusout flush below runs it once typing ends.
     Same for a live meeting view: flushing here would rebuild the DOM
     and drop the Jitsi iframe mid-meeting. */
  if(pointerDown || typingActive || photoPickOpen || ui.meetingView) return;
  syncRenderPending = false;
  lastSyncRenderAt = Date.now();
  if(window.requestAnimationFrame) requestAnimationFrame(function(){
    /* Same re-check as the timer callback above: a hold may have
       started between flushSyncRender() and this frame. */
    if(pointerDown || typingActive || photoPickOpen || ui.meetingView){ syncRenderPending = true; return; }
    render();
  });
  else render();
}
/* Direct render() from a path that can fire WITHOUT a user tap while a

   state changes). Use this instead of a bare render() in those paths:
   while a hold is up (mid-tap, typing, photo pick, live meeting) the
   render is held exactly like renderFromSync() holds it — the pending
   flag is set and the flush runs it once the hold clears. A plain
   render() here would rebuild #app and destroy the overlay input the
   native gallery is bound to, swallowing the pick's change event.
   User-action renders (button taps, form submits, logins) never come
   through here — they run immediately, as before. */
function holdOrRender(){

  render();
}
/* ---- Refresh button: spinner + timeout (see the "refresh" click
   handler) ---- */
function startRefreshSpin(){
  refreshing = true;
  /* Never spin forever: even if Firebase never answers, the spinner
     stops after 5 seconds and the button becomes tappable again. */
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){ finishRefresh(false); }, 5000);
  /* Spin immediately, in the live DOM — do NOT wait for a full render(),
     which would rebuild the header and could swallow the tap. */
  try{
    var btns = document.querySelectorAll('[data-act="refresh"]');
    for(var i=0;i<btns.length;i++){
      btns[i].setAttribute("disabled","disabled");
      var svg = btns[i].querySelector("svg");
      if(svg){
        var c = svg.getAttribute("class")||"";
        if(c.indexOf("spin")<0) svg.setAttribute("class", (c+" spin").replace(/^\s+|\s+$/g,""));
      }
    }
  }catch(e){}
  renderStatus();
}
/* finishRefresh(ok) is the single exit point for a refresh: it stops the
   spinner (even on timeout/error), re-enables the button, shows the
   result, and rebuilds once — so the header comes back without "spin". */
function finishRefresh(ok){
  if(!refreshing && !refreshTimer) return;
  refreshing = false;
  clearTimeout(refreshTimer); refreshTimer = null;
  try{
    var btns = document.querySelectorAll('[data-act="refresh"]');
    for(var i=0;i<btns.length;i++){
      btns[i].removeAttribute("disabled");
      var svg = btns[i].querySelector("svg");
      if(svg){
        var c = svg.getAttribute("class")||"";
        svg.setAttribute("class", c.replace(/\bspin\b/g,"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,""));
      }
    }
  }catch(e){}
  renderStatus();
  if(ok) toast("সর্বশেষ তথ্য আনা হয়েছে");
  else toast("নেটওয়ার্ক ধীর — আবার চেষ্টা করুন");
  /* The 5s refresh-timeout can fire while a photo pick is open — hold
     instead of rebuilding, or the pick's change event is swallowed. */
  holdOrRender();
}
function publicData(src){
  var pub = JSON.parse(JSON.stringify(src));
  pub.admins = [];
  // Guardian accounts (phone + password hash) NEVER ride the public node.
  pub.guardians = [];
  // Teacher accounts (phone + password hash) NEVER ride the public node.
  pub.teacherAccounts = [];
  // Quiz attempts (player name/phone/age/roll) are admin-only.
  pub.quizAttempts = [];
  // Complaints are admin-only: they must NEVER ride the public node
  // that every guardian phone reads. They live in the private node.
  pub.complaints = [];
  // Data-deletion requests are admin-only (private node).
  pub.deletionRequests = [];
  // Teacher messages are teachers-only: they must NEVER ride the public
  // node that every guardian phone reads. They live in the private node.
  pub.teacherMessages = [];
  // Student<->admin chat + call signalling are private-node data.
  pub.guardianMessages = {};
  pub.calls = {};
  // Teacher attendance + leave applications are teachers/admin-only.
  pub.teacherAttendance = {};
  pub.teacherLeaves = [];
  // CCTV link is admin-only (the CCTV section lives in the admin area).
  pub.cctvLink = "";
  // Results & fees are personal too: the full collections NEVER ride
  // the public node. They live in the private node (admins) and, per
  // child, in childData/<studentId> (fetched on demand by guardians).
  pub.results = [];
  pub.fees = [];
  pub.students.forEach(function(s){ delete s.guardianPhone; delete s.guardianPhones; });
  pub.teachers.forEach(function(t){ delete t.phone; });
  return pub;
}
function privateData(src){
  var phones = {};
  src.students.forEach(function(s){ var phs = studentGuardianPhones(s); if(phs.length) phones["s_"+s.id] = phs; });
  src.teachers.forEach(function(t){ if(t.phone) phones["t_"+t.id] = t.phone; });
  return { admins: src.admins, guardians: src.guardians || [], adminUids: src.adminUids || {}, phones: phones, complaints: src.complaints || [], deletionRequests: src.deletionRequests || [], results: src.results || [], fees: src.fees || [], teacherMessages: src.teacherMessages || [], guardianMessages: src.guardianMessages || {}, calls: src.calls || {}, teacherAttendance: src.teacherAttendance || {}, teacherLeaves: src.teacherLeaves || [], cctvLink: src.cctvLink || "", quizAttempts: src.quizAttempts || [] };
}
/* Complaints come back from Firebase either as an array or as an
   object (guardian phones write single children by id) — normalize. */
function quizAttemptsToArray(v){
  var arr = [];
  if(Array.isArray(v)) arr = v.filter(Boolean);
  else if(v && typeof v === "object") Object.keys(v).forEach(function(k){ if(v[k]) arr.push(v[k]); });
  arr.sort(function(a,b){ return String(b.createdAt||"").localeCompare(String(a.createdAt||"")); });
  return arr;
}
function complaintsToArray(c){
  var arr = [];
  if(Array.isArray(c)) arr = c.filter(Boolean);
  else if(c && typeof c === "object") Object.keys(c).forEach(function(k){ if(c[k]) arr.push(c[k]); });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
function mergePrivate(priv){
  if(!priv) { privLoaded = true; return; }
  if(priv.admins) D.admins = priv.admins;
  if(priv.adminUids!==undefined && priv.adminUids!==null) D.adminUids = priv.adminUids;
  if(priv.guardians!==undefined && priv.guardians!==null) D.guardians = guardiansToArray(priv.guardians);
  if(priv.complaints) D.complaints = complaintsToArray(priv.complaints);
  if(priv.deletionRequests!==undefined && priv.deletionRequests!==null) D.deletionRequests = complaintsToArray(priv.deletionRequests);
  if(priv.teacherMessages!==undefined && priv.teacherMessages!==null) D.teacherMessages = teacherMessagesToArray(priv.teacherMessages);
  if(priv.guardianMessages!==undefined && priv.guardianMessages!==null) D.guardianMessages = priv.guardianMessages;
  if(priv.calls!==undefined && priv.calls!==null) D.calls = priv.calls;
  if(priv.teacherAttendance!==undefined && priv.teacherAttendance!==null) D.teacherAttendance = priv.teacherAttendance;
  if(priv.teacherLeaves!==undefined && priv.teacherLeaves!==null) D.teacherLeaves = teacherLeavesToArray(priv.teacherLeaves);
  if(priv.quizAttempts!==undefined && priv.quizAttempts!==null) D.quizAttempts = quizAttemptsToArray(priv.quizAttempts);
  if(priv.cctvLink!==undefined && priv.cctvLink!==null) D.cctvLink = priv.cctvLink;
  // Results & fees live in the private node now. Older private nodes
  // have no such keys yet — then keep whatever this device already
  // holds (e.g. records migrated from a legacy public payload).
  if(priv.results!==undefined && priv.results!==null) D.results = priv.results;
  if(priv.fees!==undefined && priv.fees!==null) D.fees = priv.fees;
  var phones = priv.phones || {};
  D.students.forEach(function(s){ if(phones["s_"+s.id]!==undefined && phones["s_"+s.id]!==null) restoreStudentPhones(s, phones["s_"+s.id]); });
  D.teachers.forEach(function(t){ if(phones["t_"+t.id]) t.phone = phones["t_"+t.id]; });
  privLoaded = true;
  persistLocalSoon();
  // An admin device keeps the per-child guardian nodes in step, so a
  // guardian picking a child always finds that child's records.
  syncChildData();
}
function save(){
  persistLocal();
  // Remember the fingerprint of what we are about to push, so the sync
  // listener recognises its echo and does not rebuild the UI for it.
  try{ lastPubSig = stableSig(publicData(D)); }catch(e){}
  if(restMode && fbDbUrl){
    // The SDK connection is stuck — write over REST instead, so an
    // admin's updates still reach every guardian.
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      restPut("public", publicData(D)).catch(function(){});
      if(privLoaded && isAdmin()){ restPut("private", privateData(D)).catch(function(){}); syncChildData(); syncGuardians(); syncGuardianChildren(); syncGuardianChildrenByUid(); syncTeacherProfiles(); }
    }, 350);
    return;
  }
  if(fbPub){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      fbPub.set(publicData(D)).catch(function(){ syncStatus="error"; renderStatus(); });
      // Private data is only written by a device that has loaded it as an
      // admin — a guardian device never touches the private node.
      if(fbPriv && privLoaded && isAdmin()){
        fbPriv.set(privateData(D)).catch(function(){});
        syncChildData(); syncGuardians(); syncGuardianChildren(); syncGuardianChildrenByUid(); syncTeacherProfiles();
      }
    }, 350);
  }
}

/* ---------------- per-child results & fees (guardian access) -------
   Admin saves mirror each child's own results & fees into a small
   node, childData/<studentId>. A guardian device fetches ONLY the
   node of the child picked in the "রেজাল্ট ও ফি" tab — the full
   collections stay in the private node and never reach it. */
var childSigs = {};
function childPayload(stId){
  return {
    results: D.results.filter(function(r){ return r.studentId===stId; }),
    fees: D.fees.filter(function(f){ return f.studentId===stId; })
  };
}
function syncChildData(){
  if(!D || !isAdmin() || !privLoaded) return;
  D.students.forEach(function(st){
    var payload = childPayload(st.id);
    var sig = "";
    try{ sig = stableSig(payload); }catch(e){}
    if(childSigs[st.id]===sig) return;
    childSigs[st.id] = sig;
    if(restMode && fbDbUrl){ restPut("childData/"+st.id, payload).catch(function(){}); }
    else if(fbRoot){ fbRoot.child("childData").child(st.id).set(payload).catch(function(){}); }
  });
}
/* Guardian side: fetch just the picked child's node (SDK first, REST
   as the fallback when the SDK stalls — same pattern as the private
   node), then re-render the detail with only that child's records. */
function loadChildData(studentId){
  if(ui.childDataId===studentId && (ui.childData || ui.childDataLoading)) return;
  ui.childDataId = studentId; ui.childData = null; ui.childDataLoading = true;
  var apply = function(val){
    if(ui.childDataId!==studentId) return;
    ui.childDataLoading = false;
    ui.childData = { results: (val && val.results) || [], fees: (val && val.fees) || [] };
    if(ui.tab==="mychild") render();
  };
  if(restMode && fbDbUrl){ restGet("childData/"+studentId).then(apply).catch(function(err){ if(err && String(err.message||"").indexOf("403")>=0) flagAuthRelogin(); apply(null); }); return; }
  if(fbRoot){
    fbRoot.child("childData").child(studentId).once("value").then(function(snap){ apply(snap.val()); }).catch(function(err){ if(err && err.code==="PERMISSION_DENIED") flagAuthRelogin(); });
    setTimeout(function(){
      if(ui.childDataId===studentId && ui.childDataLoading && fbDbUrl){
        restGet("childData/"+studentId).then(apply).catch(function(){ apply(null); });
      }
    }, 4000);
    return;
  }
  apply(null);
}

/* ---------------- Firebase live sync ---------------- */
function getFbConfig(){
  try{
    if(localStorage.getItem(FB_OFF_KEY)==="1") return null;
    var raw = localStorage.getItem(FB_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_FB_CONFIG));
}
function connectFirebase(cfg, silent){
  if(!cfg || !cfg.apiKey || !cfg.databaseURL){
    syncStatus = "local"; renderStatus(); return;
  }
  if(!window.firebase){
    // Config exists but the Firebase SDK could not load (offline / network
    // problem) — that is a connection failure, not a deliberate disconnect.
    syncStatus = "error"; renderStatus(); return;
  }
  try{
    restMode = false; stopRestPolling(); restLastJson = ""; clearTimeout(connectTimer);
    syncStatus = "connecting"; renderStatus();
    var appName = "school-one-live";
    var app = null;
    for(var i=0;i<firebase.apps.length;i++){ if(firebase.apps[i].name===appName) app=firebase.apps[i]; }
    if(!app) app = firebase.initializeApp(cfg, appName);
    fbAppObj = app;
    /* Firebase Auth restores its session on its own (persisted login).
       Track it here so the app knows when a returning admin/guardian is
       already signed in — and re-attach the private listener if it was
       attached before Auth had restored (its reads would have been
       denied and silently dropped). */
    try{
      if(firebase.auth){
        firebase.auth(app).onAuthStateChanged(function(u){
          fbAuthUser = u || null;
          if(u){ authMode = "auth"; refreshAuthToken(); if(sessionPhone && !privLoaded){ privListening = false; startPrivateListening(); } if(sessionPhone) ensureAdminUidRecorded(); }
          else { authMode = "fallback"; fbIdToken = ""; }
        });
      }
    }catch(e){}
    var root = app.database().ref("schoolApp/v1");
    fbRoot = root;
    fbPub = root.child("public");
    fbPriv = root.child("private");
    fbDbUrl = (cfg.databaseURL||"").replace(/\/+$/,"");
    fbPub.on("value", function(snap){
      // A real SDK snapshot arrived — the REST fallback stands down.
      clearTimeout(connectTimer); stopRestPolling(); restMode = false;
      applyPublicSnapshot(snap.val(), false);
    }, function(){
      if(!fbReady) startRestFallback();
      else { syncStatus = "error"; renderStatus(); }
    });
    /* The SDK connection can stall silently: it loads, but the first
       on("value") snapshot never arrives, and the status would sit on
       "connecting" forever. Guard it with a 5-second timeout — if no
       snapshot has come by then, load the same data over the REST API
       and run the app from that instead. */
    clearTimeout(connectTimer);
    connectTimer = setTimeout(function(){ if(!fbReady) startRestFallback(); }, 5000);
    // A returning admin session on this device re-attaches the private node.
    if(sessionPhone) startPrivateListening();
    if(!silent) toast("Firebase-এর সাথে যুক্ত হওয়ার চেষ্টা চলছে…");
  }catch(e){
    syncStatus = "error"; renderStatus();
  }
}

/* Applies a public-node payload — from the SDK listener or from the REST
   fallback — to this device's view. Collections Firebase dropped because
   they were empty are refilled from the defaults, and this device's
   private data (phones/admins) is kept, since the public node never
   carries it. */
function applyPublicSnapshot(val, fromRest){
  fbReady = true; syncStatus = "live";
  if(val && val.settings){
    // Nothing new in this snapshot — leave the UI exactly as it is.
    // Rebuilding on every sync event (including the echo of this
    // device's own saves) is what made the app feel hung.
    var sig = "";
    try{ sig = stableSig(val); }catch(e){}
    if(sig && sig===lastPubSig){ renderStatus(); return; }
    if(sig) lastPubSig = sig;
    var base = defaultData();
    Object.keys(base).forEach(function(k){ if(val[k]===undefined || val[k]===null) val[k]=base[k]; });
    Object.keys(base.settings).forEach(function(k){ if(val.settings[k]===undefined) val.settings[k]=base.settings[k]; });
    if(!String(val.settings.shareLink||"").trim()) val.settings.shareLink = DEFAULT_SHARE_LINK;
    // Keep this device's private data (phones/admins) across public
    // refreshes — the public node never carries them.
    var keepAdmins = D.admins, keepGuardians = D.guardians || [], keepAdminUids = D.adminUids || {}, keepPhones = privateData(D).phones, keepComplaints = D.complaints || [], keepTeacherMessages = D.teacherMessages || [], keepGuardianMessages = D.guardianMessages || {}, keepCalls = D.calls || {}, keepTeacherAttendance = D.teacherAttendance || {}, keepTeacherLeaves = D.teacherLeaves || [], keepCctvLink = D.cctvLink || "",
    keepTeacherAccounts = D.teacherAccounts || [], keepQuizzes = D.quizzes || [],
    keepQuizAttempts = privLoaded ? (D.quizAttempts || []) : [];
    // Results & fees no longer travel on the public node. Keep this
    // device's own copies when it has loaded the private node (admin);
    // a returning admin session adopts a legacy public payload's
    // records once, so they migrate into the private node on the next
    // save; a plain guardian device drops them entirely.
    var keepResults = [], keepFees = [];
    if(privLoaded){ keepResults = D.results || []; keepFees = D.fees || []; }
    else if(sessionPhone){ keepResults = val.results || []; keepFees = val.fees || []; }
    D = val;
    D.results = keepResults;
    D.fees = keepFees;
    D.admins = keepAdmins;
    D.adminUids = keepAdminUids;
    D.guardians = keepGuardians;
    // Complaints are private-node data — a public refresh must never
    // wipe this device's view of them (guardian: own submissions;
    // admin: the full private list).
    D.complaints = keepComplaints;
    // Teacher messages are private-node data too — a public refresh must
    // never wipe this device's view of them.
    D.teacherMessages = keepTeacherMessages;
    D.guardianMessages = keepGuardianMessages;
    D.calls = keepCalls;
    D.teacherAttendance = keepTeacherAttendance;
    D.teacherLeaves = keepTeacherLeaves;
    D.cctvLink = keepCctvLink;
    D.teacherAccounts = keepTeacherAccounts; D.quizzes = keepQuizzes; D.quizAttempts = keepQuizAttempts;
    // Defense in depth: the public node must never carry phone numbers.
    // Strip any that ever appear in a public payload, then restore only
    // this device's own privately loaded ones (admin devices only).
    D.students.forEach(function(s){ delete s.guardianPhone; delete s.guardianPhones; if(keepPhones["s_"+s.id]!==undefined && keepPhones["s_"+s.id]!==null) restoreStudentPhones(s, keepPhones["s_"+s.id]); });
    D.teachers.forEach(function(t){ delete t.phone; if(keepPhones["t_"+t.id]) t.phone = keepPhones["t_"+t.id]; });
    maybeNotifyNewUrgent(D.notices);
    registerFcmToken();
    persistLocalSoon(); renderFromSync();
  } else {
    // Empty database: seed the public node with local public data.
    if(fromRest) restPut("public", publicData(D)).catch(function(){});
    else if(fbPub) fbPub.set(publicData(D)).catch(function(){});
    renderFromSync();
  }
  renderStatus();
}

/* ---------------- REST fallback ----------------
   The same database over plain HTTPS: GET/PUT on
   <databaseURL>/schoolApp/v1/<node>.json. Engages when the SDK's live
   snapshot never arrives, and stands down if it ever does. */
function restUrl(path){
  return fbDbUrl + "/schoolApp/v1/" + path + ".json" + authQuery();
}
function restGet(path){
  return fetch(restUrl(path), { cache:"no-store" }).then(function(r){
    if(!r.ok) throw new Error("REST " + r.status);
    return r.json();
  });
}
function restPut(path, data){
  return fetch(restUrl(path), {
    method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data)
  });
}
function startRestFallback(){
  if(restMode || fbReady || !fbDbUrl) return;
  restMode = true;
  restFetchPublic(true);
  // Keep the guardian view fresh while the SDK stays stuck.
  stopRestPolling();
  restPollTimer = setInterval(function(){ restFetchPublic(false); }, 30000);
  if(sessionPhone) loadPrivateViaRest();
}
function stopRestPolling(){
  if(restPollTimer){ clearInterval(restPollTimer); restPollTimer = null; }
}
function restFetchPublic(first){
  return restGet("public").then(function(val){
    var js = JSON.stringify(val||null);
    if(!first && js===restLastJson){
      if(syncStatus!=="live"){ syncStatus = "live"; renderStatus(); }
      return;
    }
    restLastJson = js;
    applyPublicSnapshot(val, true);
  }).catch(function(){
    if(first && !fbReady){ syncStatus = "error"; renderStatus(); }
  });
}
function loadPrivateViaRest(){
  if(privLoaded || !fbDbUrl) return;
  restGet("private").then(function(val){
    mergePrivate(val); renderFromSync();
  }).catch(function(){
    // Never leave the admin login waiting on a stuck connection.
    privLoaded = true; renderFromSync();
  });
}

/* Fetches the private node once (admin login needs the admin accounts).
   Guardian browsing never calls this — it runs only when someone opens
   the admin login, or when an admin session already exists here. */
function ensurePrivateLoaded(){
  if(privLoaded) return;
  if(restMode){ loadPrivateViaRest(); return; }
  if(!fbPriv) return;
  fbPriv.once("value").then(function(snap){
    mergePrivate(snap.val());
    renderFromSync();
  }).catch(function(){});
  // If the SDK stays stuck, pull the private node over REST instead, so
  // the admin login never waits on a connection that never completes.
  setTimeout(function(){ if(!privLoaded) loadPrivateViaRest(); }, 4000); armAdminLoadTimeout();
}
/* Hard timeout for the admin login: if the private node has still not
   loaded after 5 seconds (SDK stuck, REST fetch hung), stop waiting
   and show the login form with whatever is known locally. A later
   snapshot still merges in and re-renders. */
var adminLoadTimer = null;
function armAdminLoadTimeout(){
  if(privLoaded || adminLoadTimer) return;
  adminLoadTimer = setTimeout(function(){
    adminLoadTimer = null;
    if(!privLoaded){ privLoaded = true; renderFromSync(); }
  }, 5000);
}
function startPrivateListening(){
  if(restMode){ loadPrivateViaRest(); return; }
  if(!fbPriv || privListening) return;
  privListening = true;
  fbPriv.on("value", function(snap){
    mergePrivate(snap.val());
    if(ui.tab==="admin" || ui.tab==="complaints" || ui.tab==="teachermsg") renderFromSync();
  });
}

/* ---------------- password hashing (SHA-256) ---------------- */
function sha256(str){
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }
  // Fallback (non-secure contexts): simple FNV hash — login still works.
  return Promise.resolve().then(function(){
    var h1=0x811c9dc5, h2=0x01000193;
    for(var i=0;i<str.length;i++){ h1=Math.imul(h1^str.charCodeAt(i),0x01000193)>>>0; h2=Math.imul(h2+str.charCodeAt(i),31)>>>0; }
    return "fnv"+h1.toString(16)+h2.toString(16);
  });
}
function hashPw(phone, pw){ return sha256("school::"+phone+"::"+pw); }

/* ---------------- Firebase Auth (server-side identity) ----------------
   Guardians and admins still type ONLY phone + password in the UI —
   no email is ever asked for. Behind the scenes the phone becomes the
   Auth email <phone>@khejur-bag-school.local and the Auth password is
   derived from phone + password ("kb2-<phone>-<password>"). The derived
   password is never stored anywhere; it is recomputed on every login.
   Why a derived password? Firebase Auth needs at least 6 characters,
   while guardians may choose a 4-character app password — the derived
   form is always long enough, and changing the app password changes
   the derived one too.
   Flow: Auth sign-in is tried FIRST (it is the verification the
   security rules trust). If Auth is not enabled in the console, or the
   account predates Auth, the code falls back to the SHA-256 hash login
   exactly as before — the app never locks anyone out.
   Known limit: after an ADMIN password reset, the Auth password is
   stale (an admin cannot change another user's Auth password from the
   app). The guardian then logs in on hash-fallback; to re-link Auth
   they must either remember the old password once, or the admin
   deletes that phone's Auth user in the Firebase console (Authentication
   → Users) and the guardian signs up again. */
var AUTH_EMAIL_DOMAIN = "@khejur-bag-school.local";
function authEmailFor(phone){ return normPhone(phone) + AUTH_EMAIL_DOMAIN; }
function guardianAuthEmail(phone, email){
  /* Firebase Auth address for a guardian: their real email when they signed up
     with one (so a password-reset email can reach them), otherwise the
     phone-based placeholder address used before email was collected. */
  var em = String(email||"").trim().toLowerCase();
  if(em && em.indexOf("@")>0 && em.indexOf(".")>em.indexOf("@")) return em;
  return authEmailFor(phone);
}
function authDerivedPw(phone, pw){ return "kb2-" + normPhone(phone) + "-" + String(pw || ""); }
function getFbAuth(){
  try{
    if(!window.firebase || !firebase.auth) return null;
    var app = fbAppObj || null;
    if(!app && typeof fcmApp === "function") app = fcmApp();
    if(!app) return null;
    return firebase.auth(app);
  }catch(e){ return null; }
}
function authUid(){ return fbAuthUser ? (fbAuthUser.uid || "") : ""; }
function authQuery(){ return fbIdToken ? ("?auth=" + encodeURIComponent(fbIdToken)) : ""; }
function refreshAuthToken(cb){
  if(!fbAuthUser){ fbIdToken = ""; if(cb) cb(); return; }
  try{
    fbAuthUser.getIdToken(true).then(function(tok){ fbIdToken = tok || ""; if(cb) cb(); }).catch(function(){ fbIdToken = ""; if(cb) cb(); });

/* ---------------- শিক্ষার্থী লগইন + শুধু নিজের তথ্য ----------------
   A guardian must sign up / log in with their own phone number and a
   password they choose. Passwords are stored only as SHA-256 hashes
   (hashPw, above) — never plain text — and only in the private node.
    Binding: when an admin adds a student they enter that student's
    guardian phone. The admin syncs a per-phone index
    (guardianChildren/<phone> = {studentId: true}) and a UID-keyed index
    (guardianChildrenByUid/<authUid> = {studentId: true}), plus the
    guardian accounts (guardians/<phone> = {phone, pwHash, authUid}).
    A guardian device NEVER fetches the whole guardians list or the
    private node — login/signup fetch ONLY the single
    guardians/<own-phone> child, and the child list ONLY the single
    guardianChildrenByUid/<own-uid> child, exactly like childData.
    So a guardian can only ever see the children linked to their own
    phone. Public notices / routine / homework / exam routine need no
    login. Results, fees and individual attendance need guardian login

function normPhone(p){
  var s = String(p||"");
  var bn = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
  s = s.split("").map(function(c){ return bn[c]!==undefined?bn[c]:c; }).join("");
  s = s.replace(/[^0-9]/g,"");
  if(s.length===13 && s.indexOf("880")===0) s = "0"+s.slice(3);
  else if(s.length===12 && s.indexOf("88")===0) s = "0"+s.slice(2);
  else if(s.length===10 && s.charAt(0)==="1") s = "0"+s;
  return s;
}

  if(isAdmin()) return D.students.slice();

   targetStudentId (+ a name+roll snapshot for the label).
   Older notices only have `audience` ("সবার জন্য" or a class
   name) — those are read as all / class, so nothing already
   published changes meaning. Admins always see every notice;
   a guardian sees a notice only for everyone, for a class one

   a logged-out visitor sees only "সবাই" notices. The notice

function idsFromGuardianChildren(v){
  if(Array.isArray(v)) return v.slice();
  if(v && typeof v === "object") return Object.keys(v).filter(function(k){ return !!v[k]; });
  return [];
}
function fetchMyChildIds(cb){
  if(!guardianPhone) return;
  if(ui.myChildIds!==null && ui.myChildIds!==undefined){ if(cb) cb(); return; }
  if(ui.guardianIdsLoading) return;
  ui.guardianIdsLoading = true;
  /* When signed in via Firebase Auth, the UID-keyed mapping is the one
     the security rules enforce — prefer it over the phone-keyed map. */
  if(fbAuthUser && fbAuthUser.uid){
    var uidDone = function(ids){
      ui.myChildIds = Array.isArray(ids) ? ids : [];
      ui.guardianIdsFetchedAt = Date.now();
      ui.guardianIdsLoading = false;
      try{ localStorage.setItem(GUARDIAN_CHILDREN_KEY, JSON.stringify(ui.myChildIds)); }catch(e){}
      if(cb) cb();
      /* Fetch callback — can resolve mid-pick (incl. the 10-min staleness
         re-fetch). Hold instead of rebuilding. */
      holdOrRender();
    };
    if(restMode && fbDbUrl){ restGet("guardianChildrenByUid/" + fbAuthUser.uid).then(function(v){ uidDone(idsFromGuardianChildren(v)); }).catch(function(){ uidDone([]); }); return; }
    if(fbRoot){
      fbRoot.child("guardianChildrenByUid").child(fbAuthUser.uid).once("value").then(function(snap){ uidDone(idsFromGuardianChildren(snap.val())); }).catch(function(){ uidDone([]); });
      return;
    }
  }
  var stored = [];
  try{ stored = JSON.parse(localStorage.getItem(GUARDIAN_CHILDREN_KEY)||"[]") || []; }catch(e){ stored = []; }
  var done = function(ids){
    ui.myChildIds = Array.isArray(ids) ? ids : [];
    ui.guardianIdsFetchedAt = Date.now();
    ui.guardianIdsLoading = false;
    try{ localStorage.setItem(GUARDIAN_CHILDREN_KEY, JSON.stringify(ui.myChildIds)); }catch(e){}
    if(cb) cb();
    /* Fetch callback — can resolve mid-pick (incl. the 10-min staleness
       re-fetch). Hold instead of rebuilding. */
    holdOrRender();
  };
  if(!fbRoot && !restMode && !fbDbUrl){
    done(D.students.filter(function(s){ return studentHasGuardianPhone(s, guardianPhone); }).map(function(s){ return s.id; }));
    return;
  }
  if(restMode && fbDbUrl){ restGet("guardianChildren/"+guardianPhone).then(function(v){ done(idsFromGuardianChildren(v)); }).catch(function(){ done(stored); }); return; }
  if(fbRoot){
    fbRoot.child("guardianChildren").child(guardianPhone).once("value").then(function(snap){ done(idsFromGuardianChildren(snap.val())); }).catch(function(){ done(stored); });
    setTimeout(function(){ if(ui.guardianIdsLoading && fbDbUrl){ restGet("guardianChildren/"+guardianPhone).then(function(v){ if(v) done(idsFromGuardianChildren(v)); }).catch(function(){}); } }, 4000);
    return;
  }
  done(stored);
}

/* An admin unlink only bites on the student's phone once the child
   list is re-fetched. Next app open always re-fetches (ui resets at
   boot/login); while the app stays open, re-fetch when the last fetch
   is older than 10 minutes, so an unlinked number stops seeing the
   child within ~10 minutes instead of lingering for the whole session.
   A device that is OFFLINE keeps its cached list (fetch failure falls
   back to localStorage) — unlink cannot reach a phone with no data. */
function refreshMyChildIdsIfStale(){
  if(!isGuardian() || ui.guardianIdsLoading) return;
  if(ui.myChildIds===null || ui.myChildIds===undefined){ fetchMyChildIds(); return; }
  if(!ui.guardianIdsFetchedAt) return;
  if(Date.now() - ui.guardianIdsFetchedAt > 10*60*1000){ ui.myChildIds = null; fetchMyChildIds(); }
}

/* New-APK notice (2026-11-10, bridge-based since v1.0.15): when a new
   APK is uploaded, guardians must see a big "আপডেট করুন" prompt the
   next time they open the app — and the notice must DISAPPEAR once
   their phone really has the new APK, even if they installed it from
   a direct link without tapping the in-app download.
   The v1.0.15 APK reports its own versionCode through the Android
   bridge (getAppVersionCode), so the notice is comparison-based:
   installed < LATEST_APK.versionCode → show; installed >= latest →
   never show. Phones on an older APK (no bridge) fall back to the
   seen-stamp rule: the notice shows until that phone taps the APK
   download link once. Whenever a new APK is uploaded, change
   versionCode/versionName here and the notice appears for everyone
   automatically on the next web deploy. */
var APK_UPDATE_SEEN_KEY = "school-apk-update-seen";
var LATEST_APK = {versionCode: 14, versionName: "1.0.13", url: DEFAULT_APK_LINK};
function apkUpdateUnseen(){
  try{ return localStorage.getItem(APK_UPDATE_SEEN_KEY) !== LATEST_APK.versionName; }catch(e){ return true; }
}
/* Installed APK version via the native bridge (v1.0.15+). Returns the
   versionCode (e.g. 16) or null when there is no bridge (older APK, or
   a plain browser) — the caller then falls back to the seen-stamp. */
function installedApkVersionCode(){
  try{
    if(window.Android && typeof window.Android.getAppVersionCode === "function"){
      var v = window.Android.getAppVersionCode();
      if(typeof v === "number" && isFinite(v) && v > 0) return Math.floor(v);
      if(typeof v === "string" && /^\d+$/.test(v)) return parseInt(v, 10);
    }
  }catch(e){}
  return null;
}
/* Should the update notice show on THIS phone? Bridge first (it knows
   the installed version for real), seen-stamp only as the fallback. */
function apkUpdateAvailable(){
  var installed = installedApkVersionCode();
  if(installed !== null) return installed < LATEST_APK.versionCode;
  return apkUpdateUnseen();
}
/* ?entry=1 (query or hash) — share-link flag: force the first render
   onto the entry screen. Read at boot only (ui.forceEntry =
   readEntryParam()); render() clears the flag after the first forced
   entry render. */
function readEntryParam(){
  try{
    if(new URLSearchParams(window.location.search).get("entry") === "1") return true;
    var h = (window.location.hash || "").replace(/^#\/?/, "");
    if(h && new URLSearchParams(h).get("entry") === "1") return true;
  }catch(e){}
  return false;
}
/* App-vs-browser diagnostic line (one small dim footer at the very
   bottom of the logged-in home): tells the admin at a glance whether
   THIS phone is the installed APK or a plain browser. A browser has
   no native bridge, so its closed-app alarms never ring — the usual
   reason a guardian's phone stays silent even though messages arrive
   in the app. Reuses installedApkVersionCode(); never touches

function appPlatformLine(){

var AZAN_LAT = 23.69, AZAN_LNG = 90.37, AZAN_TZ = 6;
var AZAN_FAJR_ANGLE = 18, AZAN_ISHA_ANGLE = 17;
var AZAN_AUDIO_URL = "azan.mp3"; /* NOTE: azan.mp3 is NOT in the school repo yet — web azan needs it copied in; the native APK azan (setAzanTimes bridge) does not need this file. */
var AZAN_ON_KEY = "school-azan-on";
var AZAN_PLAYED_KEY = "school-azan-played";
var AZAN_PRAYERS = [["fajr","ফজর"],["dhuhr","যোহর"],["asr","আসর"],["maghrib","মাগরিব"],["isha","ইশা"]];
var AZAN_BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
var azanAudio = null, azanAudioFailed = false, azanTimerStarted = false;

function azanOn(){
  try{ return localStorage.getItem(AZAN_ON_KEY)!=="0"; }catch(e){ return true; }
}
function setAzanOn(on){
  try{ localStorage.setItem(AZAN_ON_KEY, on?"1":"0"); }catch(e){}
  pushAzanToAndroid();
}
function azanBn(s){
  return String(s).replace(/[0-9]/g, function(d){ return AZAN_BN_DIGITS[Number(d)]; });
}
function azanFmtHours(h){
  var hh = Math.floor(h), mm = Math.floor((h-hh)*60+0.5);
  if(mm===60){ hh+=1; mm=0; }
  return azanBn(hh+":"+(mm<10?"0":"")+mm);
}
function azanFixAngle(a){ return a - 360*Math.floor(a/360); }
function azanFixHour(a){ return a - 24*Math.floor(a/24); }
function azanDsin(d){ return Math.sin(d*Math.PI/180); }
function azanDcos(d){ return Math.cos(d*Math.PI/180); }
function azanDarcsin(x){ return Math.asin(Math.min(1, Math.max(-1, x)))*180/Math.PI; }
function azanDarccos(x){ return Math.acos(Math.min(1, Math.max(-1, x)))*180/Math.PI; }
function azanDarctan2(y, x){ return Math.atan2(y, x)*180/Math.PI; }
function azanDarccot(x){ return Math.atan(1/x)*180/Math.PI; }
function azanJulian(year, month, day){
  if(month<=2){ year-=1; month+=12; }
  var A = Math.floor(year/100);
  var B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(year+4716)) + Math.floor(30.6001*(month+1)) + day + B - 1524.5;
}
function azanSunPos(jd){
  var D = jd - 2451545;
  var g = azanFixAngle(357.529 + 0.98560028*D);
  var q = azanFixAngle(280.459 + 0.98564736*D);
  var L = azanFixAngle(q + 1.915*azanDsin(g) + 0.020*azanDsin(2*g));
  var e = 23.439 - 0.00000036*D;
  var d = azanDarcsin(azanDsin(e)*azanDsin(L));
  var RA = azanFixHour(azanDarctan2(azanDcos(e)*azanDsin(L), azanDcos(L))/15);
  return { dec: d, eqt: q/15 - RA };
}
function azanMidDay(jd){ return azanFixHour(12 - azanSunPos(jd).eqt); }
function azanSunAngleTime(angle, jd, dir){
  var decl = azanSunPos(jd).dec;
  var noon = azanMidDay(jd);
  var t = (1/15)*azanDarccos((-azanDsin(angle) - azanDsin(decl)*azanDsin(AZAN_LAT))/(azanDcos(decl)*azanDcos(AZAN_LAT)));
  return noon + (dir<0 ? -t : t);
}
function azanAsrTime(jd){
  var decl = azanSunPos(jd).dec;
  /* Hanafi Asr: shadow factor 2 (local mosques), not Shafi'i factor 1. */
  var angle = -azanDarccot(2 + Math.tan(Math.abs(AZAN_LAT-decl)*Math.PI/180));
  return azanSunAngleTime(angle, jd, 1);
}
/* Returns {fajr, dhuhr, asr, maghrib, isha} as decimal hours of the
   local (Asia/Dhaka) clock for the given date. */
function azanComputeDay(y, m, d){
  var jd = azanJulian(y, m, d) - AZAN_LNG/(15*24);
  var out = {};
  out.fajr = azanFixHour(azanSunAngleTime(AZAN_FAJR_ANGLE, jd, -1) + AZAN_TZ - AZAN_LNG/15);
  out.dhuhr = azanFixHour(azanMidDay(jd) + AZAN_TZ - AZAN_LNG/15);
  out.asr = azanFixHour(azanAsrTime(jd) + AZAN_TZ - AZAN_LNG/15);
  out.maghrib = azanFixHour(azanSunAngleTime(0.833, jd, 1) + AZAN_TZ - AZAN_LNG/15);
  out.isha = azanFixHour(azanSunAngleTime(AZAN_ISHA_ANGLE, jd, 1) + AZAN_TZ - AZAN_LNG/15);
  return out;
}
/* Admin-set per-prayer adjustments in minutes (-30..+30, default 0),
   synced on the public node (D.azanOffsets) so every guardian's
   phone gets them. Only the admin ever changes them. */
function azanOffsets(){
  var o = (typeof D !== "undefined" && D && D.azanOffsets) || {};
  var out = {};
  AZAN_PRAYERS.forEach(function(p){
    var v = parseInt(o[p[0]], 10);
    if(isNaN(v)) v = 0;
    out[p[0]] = Math.max(-30, Math.min(30, v));
  });
  return out;
}
/* Computed times with the admin's offsets applied. Every use of the
   times — card, in-app timer, native alarms — goes through this. */
function azanAdjustedDay(y, m, d){
  var t = azanComputeDay(y, m, d);
  var o = azanOffsets();
  AZAN_PRAYERS.forEach(function(p){ t[p[0]] = azanFixHour(t[p[0]] + o[p[0]]/60); });
  return t;
}
/* Human-readable list of the non-zero offsets, e.g. "আসর +৫ মিনিট". */
function azanOffsetNote(){
  var o = azanOffsets(), parts = [];
  AZAN_PRAYERS.forEach(function(p){
    if(o[p[0]]!==0) parts.push(p[1]+" "+(o[p[0]]>0?"+":"")+o[p[0]]+" মিনিট");
  });
  return parts.join(" • ");
}
function azanDayKey(dt){

/* Tell the installed APK (v1.0.12+) which kind of phone this is, so
   its background poller knows what to notify: an admin phone gets
   opinion/complaint alarms, a guardian phone gets its own personal-
   message alarms and (v1.0.13+) notice alarms. Called on every
   admin/guardian login, logout, once at boot, and again when the
   guardian's child list finishes loading — it reads the live session
   state, so coexisting sessions (admin + guardian on one phone) stay
   correct. Guarded: plain browsers have no window.Android, and older
   APKs have no such bridge methods. */
/* The logged-in guardian's own children, for the APK's notice poller
   (v1.0.13+): it buzzes for a notice only if it is for everyone, for
   a class one of these children is in, or for one of these children.
   Admin-only phones get "" for both — myChildren() returns EVERY
   student for an admin, which must never reach the native filter.
   When the child list has not loaded yet (fetched async after
   login/boot), both are "" — the safe fallback: only সবাই notices
   buzz until fetchMyChildIds() completes and re-syncs the flags. */
function guardianChildList(){
  var ids = [];
  if(guardianPhone){
    if(ui.myChildIds && ui.myChildIds.length) ids = ui.myChildIds.slice();
    else if(!fbRoot && !restMode && !fbDbUrl) ids = D.students.filter(isMyChild).map(function(s){ return s.id; });

    if(st && st.className && classes.indexOf(st.className)<0) classes.push(st.className);

}
function syncNativeDeviceFlags(){

/* Stop the azan that is playing right now — the web audio and, on
   the installed APK, the native player too (and its lock-screen
   notification). This never changes the on/off switch and never
