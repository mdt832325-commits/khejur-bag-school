/* Stop ONLY the web audio (in-app azan
   autoplay) the instant the user leaves the app. The native azan
   alarm is deliberately NOT touched here — AzanReceiver must keep
   ringing on a locked/closed phone. Called from the listeners
   below and from the APK's MainActivity.onPause() via
   evaluateJavascript("stopWebAudioOnExit()"). */
function stopWebAudioOnExit(){
  try{ stopAzanAudio(); }catch(e){}
  try{ callRingStop(); }catch(e){}
}
document.addEventListener("visibilitychange", function(){
  try{ if(document.hidden) stopWebAudioOnExit(); }catch(e){}
});
window.addEventListener("pagehide", function(){
  try{ stopWebAudioOnExit(); }catch(e){}
});
var lastAzanPlayingState = false;
/* Show/hide the stop button as the azan starts or ends. Re-renders
   only when the playing state actually changed, so typing in a form
   is never wiped by the timer. */
function azanRefreshStopBtn(){
  var playing = false;
  try{ playing = azanAnyPlaying(); }catch(e){ playing = false; }
  if(playing !== lastAzanPlayingState){
    lastAzanPlayingState = playing;
    /* The 25s azan timer can fire while a photo pick is open (a prayer
       time landing mid-pick) — hold instead of rebuilding, or the pick's
       change event is swallowed. The playing state above is already
       updated, so nothing is lost by holding. */
    try{ holdOrRender(); }catch(e){}
  }
}
/* Play the real azan recording. No speech-synthesis fallback: an
   azan must be a real recitation, never a robot voice. */
function playAzanNow(showError){
  if(!azanOn()) return false;
  var a = getAzanAudio();
  if(!a || azanAudioFailed){
    if(showError) toast("আজানের অডিও পাওয়া যাচ্ছে না — ইন্টারনেট চেক করুন");
    return false;
  }
  try{
    stopAzanAudio();
    var p = a.play();
    if(p && p.then){
      p.then(function(){}).catch(function(){
        if(showError) toast("আজান চালানো যাচ্ছে না — প্রথমে অ্যাপে একবার ট্যাপ করুন");
      });
    }
    return true;
  }catch(e){
    if(showError) toast("আজান চালানো যাচ্ছে না");
    return false;
  }
}
/* In-app timer: every 25 s, check whether a prayer time just
   arrived (within the last 2 minutes) and has not rung yet today. */
function azanTick(){
  if(!azanOn()) return;
  var now = new Date();
  var t = azanAdjustedDay(now.getFullYear(), now.getMonth()+1, now.getDate());
  var dayKey = azanDayKey(now);
  var played = azanPlayedMap()[dayKey] || {};
  var nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  for(var i=0;i<AZAN_PRAYERS.length;i++){
    var key = AZAN_PRAYERS[i][0];
    var tm = t[key]*60;
    if(!played[key] && nowMin>=tm && nowMin<tm+2){
      azanMarkPlayed(dayKey, key);
      playAzanNow(false);
      azanRefreshStopBtn();
      break;
    }
  }
}
/* Epoch-millisecond list of today's + tomorrow's prayer times, for
   the APK's native alarm. Built from the device's local clock, which
   for guardians in Bangladesh is Asia/Dhaka — the times themselves
   are Keraniganj wall-clock times. */
function azanEpochList(){
  var out = [];
  var days = [new Date(), new Date(Date.now()+86400000)];
  for(var di=0; di<days.length; di++){
    var dt = days[di];
    var t = azanAdjustedDay(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
    for(var i=0;i<AZAN_PRAYERS.length;i++){
      var key = AZAN_PRAYERS[i][0];
      var h = t[key];
      var hh = Math.floor(h), mm = Math.floor((h-hh)*60+0.5);
      if(mm===60){ hh+=1; mm=0; }
      out.push({ name: key, at: new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), hh, mm, 0).getTime() });
    }
  }
  return out;
}
var lastAzanPushSig = "";
function azanPushSig(){
  var o = azanOffsets();
  return azanDayKey(new Date()) + "|" + o.fajr + "," + o.dhuhr + "," + o.asr + "," + o.maghrib + "," + o.isha + "|" + (azanOn()?"1":"0");
}
/* Hand today's + tomorrow's times, the admin's offsets and the
   on/off state to the installed APK (JavascriptInterface "Android").
   Guarded: in a plain browser window.Android does not exist and
   nothing happens. */
function pushAzanToAndroid(){
  try{
    if(window.Android){
      if(typeof window.Android.setAzanTimes === "function"){
        window.Android.setAzanTimes(JSON.stringify({ times: azanEpochList() }));
      }
      if(typeof window.Android.setAzanOffsets === "function"){
        window.Android.setAzanOffsets(JSON.stringify(azanOffsets()));
      }
      if(typeof window.Android.setAzanEnabled === "function"){
        window.Android.setAzanEnabled(azanOn());
      }
    }
  }catch(e){}
  try{ lastAzanPushSig = azanPushSig(); }catch(e){}
}
/* Re-push to the APK when the times or offsets changed since the
   last push — e.g. the admin just saved new offsets and this phone
   received them by sync while the app was open. */
function azanPushIfChanged(){
  try{ if(azanPushSig() !== lastAzanPushSig) pushAzanToAndroid(); }catch(e){}
}
function initAzan(){
  if(azanTimerStarted) return;
  azanTimerStarted = true;
  /* Prime the audio element on the first tap (browsers block audio
     before a user gesture), so the azan can start on time later. */
  var primed = false;
  document.addEventListener("pointerdown", function(){
    if(primed) return; primed = true;
    try{ var a = getAzanAudio(); if(a) a.load(); }catch(e){}
  }, { passive:true });
  pushAzanToAndroid();
  setInterval(function(){ try{ azanTick(); azanPushIfChanged(); azanRefreshStopBtn(); }catch(e){} }, 25000);
  setTimeout(function(){ try{ azanTick(); }catch(e){} }, 2000);
}

/* ---------------- notifications ----------------
   On entry, guardians are asked (popup) to turn notifications on.
   "নোটিফিকেশন অন করুন" asks the browser for permission and then
   registers this device for Firebase Cloud Messaging (FCM): the FCM
   token is saved to the database (schoolApp/v1/fcmTokens), and the
   bundled service worker (the bundled FCM service worker — see FCM_SW_DATA) receives
   pushes even while the app is closed or the phone is locked, shows
   them on the lock screen, and opens the app on the notice board when
   tapped. "পরে করবো" hides the popup only for this visit, so it comes
   back next time.
   While the app is open, a NEW urgent notice arriving through the
   live sync also pops a phone notification. Ids of urgent notices
   already seen on this device are kept (same local storage the app
   already uses) so old notices never re-notify. */

/* ---- ported: ostag.js (madrasa v1.0.18, adapted) ---- */
var osTagsApplied = "";
function tagGuardianForPush(){
  try{
    if(!isGuardian() || !guardianPhone) return;
    if(!OneSignalRef || !OneSignalRef.User || typeof OneSignalRef.User.addTag!=="function") return;
    var ph = normPhone(guardianPhone);
    if(!ph) return;
    var kids = [];
    try{ kids = myChildren().map(function(s){ return s.id; }); }catch(e){ kids = []; }
    var tagStr = ph + "|" + kids.join(",");
    if(osTagsApplied === tagStr) return;
    osTagsApplied = tagStr;
    var tags = { guardian_phone: ph };
    if(kids.length) tags.guardian_child = kids.join(",");
    if(typeof OneSignalRef.User.addTags==="function") OneSignalRef.User.addTags(tags);
    else OneSignalRef.User.addTag("guardian_phone", ph);
  }catch(e){}
}
function untagGuardianForPush(){
  try{
    osTagsApplied = "";
    if(!OneSignalRef || !OneSignalRef.User || typeof OneSignalRef.User.removeTag!=="function") return;
    OneSignalRef.User.removeTag("guardian_phone");
    OneSignalRef.User.removeTag("guardian_child");
  }catch(e){}
}

/* ---- ported: phones.js (madrasa v1.0.18, adapted) ---- */
var GUARDIAN_PHONE_MAX = 4;
function studentGuardianPhones(st){
  var out = [];
  if(!st) return out;
  if(Array.isArray(st.guardianPhones)){
    st.guardianPhones.forEach(function(p){ var n = normPhone(p||""); if(n && out.indexOf(n)<0) out.push(n); });
  }
  var main = normPhone(st.guardianPhone||"");
  if(main && out.indexOf(main)<0) out.unshift(main);
  return out.slice(0, GUARDIAN_PHONE_MAX);
}
function studentHasGuardianPhone(st, ph){
  return studentGuardianPhones(st).indexOf(normPhone(ph||""))>=0;
}
/* Restore a student's numbers from the private phones map: new nodes
   store an ARRAY, old nodes a single STRING — both must keep working. */
function restoreStudentPhones(s, val){
  if(Array.isArray(val)){
    var phs = [];
    val.forEach(function(p){ var n = normPhone(p||""); if(n && phs.indexOf(n)<0) phs.push(n); });
    if(phs.length){ s.guardianPhones = phs; s.guardianPhone = phs[0]; }
  } else if(val){
    var n2 = normPhone(val||"");
    if(n2){ s.guardianPhone = n2; s.guardianPhones = [n2]; }
  }
}
function bnToEnDigits(s){
  var bn = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
  return String(s||"").split("").map(function(c){ return bn[c]!==undefined?bn[c]:c; }).join("");
}
/* Student search, shared by the public শিক্ষার্থী tab and the admin list.
   Name matches as a plain substring; roll matches after Bengali-digit
   normalisation, so "১২" and "12" both find roll 12. */
function studentMatchesSearch(x, q){
  var qn = bnToEnDigits(q);
  if(x.name && x.name.indexOf(q)>=0) return true;
  if(String(x.roll).indexOf(qn)>=0) return true;
  return false;
}
/* Admin-only extension: also matches the guardian's phone number, after
   normPhone(), so a full number, a partial digit run, dashes/spaces,
   +880/880 prefixes and Bengali digits all work. Never used on the public
   tab — matching by phone there would let one guardian confirm which
   student another guardian's number is linked to. */
function studentMatchesAdminSearch(x, q){
  if(studentMatchesSearch(x, q)) return true;
  var digits = normPhone(q);
  if(digits && studentGuardianPhones(x).some(function(p){ return p.indexOf(digits)>=0; })) return true;
  return false;
}

/* ---- ported: pwchange.js (madrasa v1.0.18, adapted) ---- */
/* Guardian in-app password change: keep Firebase Auth in step.
   THE TRAP: student login tries Auth FIRST (authSignInAttempt) and on
   success OVERWRITES the stored hash with the entered password's
   hash. So changing ONLY the stored hash is NOT enough while Auth is
   functional — the old password would still sign in via Auth and
   re-sync the hash back. This helper updates the Auth password too:
   updatePassword on the signed-in user, signing in with the CURRENT
   password first when there is no matching session (a fresh sign-in
   also makes the session recent enough for updatePassword).
   Resolves to one of:
     "updated"    — the Auth password now matches the new password.
     "no-auth"    — no Auth user exists for this phone, or Auth is not
                    enabled / not reachable on this device, so the
                    stored hash is the ONLY credential and the
                    hash-only change is complete.
     "stale-auth" — an Auth user exists but with an OLDER password
                    (happens after an admin reset: the reset rewrites
                    only the stored hash — see guardian-reset). The
                    guardian does not know that older password, so
                    Auth cannot be fixed from here; the caller must
                    still update the hash and WARN the user that the
                    old password may still work until the admin fixes
                    Auth (Firebase console) or the guardian signs in
                    with the old password once.
     "failed"     — network/unknown Auth error; the caller must NOT
                    change the hash, or the two systems would split
                    (old password via Auth, new via hash). */
function updateAuthPasswordForGuardian(phone, currentPw, newPw, email){
  var a = getFbAuth();
  var aemail = guardianAuthEmail(phone, email);
  var newAuthPw = authDerivedPw(phone, newPw);
  var oldAuthPw = authDerivedPw(phone, currentPw);
  if(!a || !a.signInWithEmailAndPassword) return Promise.resolve("no-auth");
  /* Try the update on the current session; a stale session answers
     auth/requires-recent-login, which a fresh sign-in with the
     CURRENT password fixes (the current password was just verified
     against the stored hash by the caller). */
  var tryUpdate = function(){
    var u = null;
    try{ u = a.currentUser; }catch(e){ u = null; }
    if(!u || !u.updatePassword) return Promise.resolve("no-auth");
    return u.updatePassword(newAuthPw).then(function(){ return "updated"; }).catch(function(err){
      var code = String(err && err.code || "");
      if(code !== "auth/requires-recent-login") return "failed";
      return a.signInWithEmailAndPassword(aemail, oldAuthPw).then(function(){
        var u2 = null;
        try{ u2 = a.currentUser; }catch(e){ u2 = null; }
        if(!u2 || !u2.updatePassword) return "failed";
        return u2.updatePassword(newAuthPw).then(function(){ return "updated"; }).catch(function(){ return "failed"; });
      }).catch(function(err2){
        var c2 = String(err2 && err2.code || "");
        if(c2 === "auth/user-not-found" || c2 === "auth/operation-not-allowed") return "no-auth";
        return "stale-auth";
      });
    });
  };
  var cuEmail = "";
  try{ cuEmail = (a.currentUser && a.currentUser.email) || ""; }catch(e){ cuEmail = ""; }
  if(cuEmail === aemail) return tryUpdate();
  /* No matching session on this device (or a different user, e.g. an
     admin, is signed in) — sign in with the CURRENT password first.
     This also switches the session to the guardian; the other user's
     Auth re-links silently on their next login (linkFbAuth). */
  return a.signInWithEmailAndPassword(aemail, oldAuthPw).then(function(){ return tryUpdate(); }).catch(function(err){
    var code = String(err && err.code || "");
    if(code === "auth/user-not-found" || code === "auth/operation-not-allowed") return "no-auth";
    if(code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-email") return "stale-auth";
    return "failed";
  });
}

/* Self-service password change for a logged-in guardian or teacher.
   Verifies the CURRENT password against the stored hash first, then
   (guardians only) keeps Firebase Auth in step, then rewrites the
   stored hash. Teachers have no Auth identity (their login is
   hash-only), so for them the hash rewrite is the whole change.
   done(res): { ok:true, auth:"updated"|"no-auth"|"stale-auth" } or
   { ok:false, error:"current"|"short"|"mismatch"|"no-account"|"auth-failed" }.
   On "auth-failed" the hash is deliberately left UNTOUCHED, so the
   old password keeps working exactly as before instead of splitting
   the two systems. The guardian stays logged in either way. */
function changeMyPasswordFlow(phone, role, currentPw, newPw, confirmPw, done){
  var ph = normPhone(phone||"");
  if(!ph){ done({ ok:false, error:"no-account" }); return; }
  if(!newPw || newPw.length < 4){ done({ ok:false, error:"short" }); return; }
  if(newPw !== confirmPw){ done({ ok:false, error:"mismatch" }); return; }
  var load = role === "teacher" ? loadTeacherAccount : loadGuardianAccount;
  load(ph, function(acc){
    if(!acc){ done({ ok:false, error:"no-account" }); return; }
    hashPw(ph, currentPw||"").then(function(h){
      if(h !== acc.pwHash){ done({ ok:false, error:"current" }); return; }
      var finish = function(authStatus){
        if(authStatus === "failed"){ done({ ok:false, error:"auth-failed" }); return; }
        hashPw(ph, newPw).then(function(h2){
          acc.pwHash = h2;
          var local = role === "teacher" ? teacherAccountByPhone(ph) : guardianByPhone(ph);
          if(local && local !== acc) local.pwHash = h2;
          var saveFn = role === "teacher" ? saveTeacherAccount : saveGuardianAccount;
          saveFn(acc, function(){ done({ ok:true, auth:authStatus }); });
        });
      };
      if(role === "teacher"){ finish("no-auth"); return; }
      updateAuthPasswordForGuardian(ph, currentPw, newPw, acc.email).then(finish).catch(function(){ finish("failed"); });
    });
  });
}

/* ---- ported: entry.js (madrasa v1.0.18, adapted) ---- */
function entryNoticeIsPublic(n){
  if(noticeTarget(n).type!=="all") return false;
  var t = String(n.title||"").trim();
  if(!t) return false;
  /* A phone-like digit run in the title (Bengali digits normalised) —
     a number must never reach the public page. */
  if(/\d{7,}/.test(bnToEnDigits(t))) return false;
  /* A title that names a student — fail closed, drop the notice.
     Checked word by word (a title can carry part of a name, e.g.
     "ইমরান হাসানকে অভিনন্দন" without the "মোঃ" prefix); a dropped
     notice is only a hidden notice, never a leak. */
  var students = D.students || [];
  for(var i=0;i<students.length;i++){
    var parts = String(students[i].name||"").trim().split(/\s+/);
    for(var j=0;j<parts.length;j++){
      var w = parts[j];
      if(w.length>=4 && t.indexOf(w)>=0) return false;
    }
  }
  return true;
}
function entryNoticesHtml(){
  var list = (D.notices||[]).filter(entryNoticeIsPublic);
  if(!list.length) return "";
  list = list.slice().sort(function(a,b){ return String(b.createdAt||"").localeCompare(String(a.createdAt||"")); }).slice(0,3);
  return '<h3 style="margin:14px 0 6px;font-size:15px">📢 নোটিশ</h3>'
    + list.map(function(n){
      return '<div class="att-row"><div class="grow"><b>'+esc(n.title||"")+'</b><div class="dim small">'+fmtDateBn(n.createdAt)+'</div></div></div>';
    }).join("");
}

var guardianChildrenKnown = {};
function syncGuardianChildrenForPhone(ph){

  D.students.forEach(function(s){ if(studentHasGuardianPhone(s, ph)) ids.push(s.id); });

  if(ids.length){

    guardianSigs[ph] = "__deleted__";
    if(restMode && fbDbUrl){ restDelete("guardianChildren/"+ph).catch(function(){}); }
    else if(fbRoot){ fbRoot.child("guardianChildren").child(ph).remove().catch(function(){}); }
  }

function syncGuardianChildren(){

/* ---- student self-link by name + roll ----
   A student who scanned the QR and opened an account with a number
   the admin never added can still find their own record here: they
   enter their name + class + roll, and on an EXACT match (normalised
   name, class and roll) that number is linked to the record.
   The password still protects the account — this only tells the app
   WHICH record belongs to this number. A wrong or ambiguous match
   links NOTHING, and an unlinked number still sees nothing.
   selfLinkStudentByNameRoll() returns one of:
     "linked"    — the phone is now linked to the one matching record.
     "not-found" — 0 matches.
     "ambiguous" — more than 1 match.
     "already"   — the phone is already linked to that record.
     "full"      — the record already has GUARDIAN_PHONE_MAX numbers.
     "no-login"  — no logged-in student phone. */
function normalizeStudentName(s){
  return String(s||"").replace(/\s+/g," ").trim();
}
function studentRollMatches(a, b){
  var x = bnToEnDigits(String(a||"").trim());
  var y = bnToEnDigits(String(b||"").trim());
  if(x===y) return true;
  if(/^\d+$/.test(x) && /^\d+$/.test(y)) return Number(x)===Number(y);
  return false;
}
function findStudentsByNameClassRoll(name, className, roll){
  var n = normalizeStudentName(name);
  var c = String(className||"").trim();
  var r = String(roll||"").trim();
  if(!n || !c || !r) return [];
  return (D.students||[]).filter(function(x){
    return normalizeStudentName(x.name)===n
      && String(x.className||"").trim()===c
      && studentRollMatches(x.roll, r);
  });
}
/* Durable link, written the way a student device writes its own
   private data (see pushGuardianMessageToPrivate): the private
   phones map (the admin merges it on the next private load) and
   the phone-keyed guardianChildren map (what fetchMyChildIds
   reads). When the student is Auth-signed-in, the UID-keyed map
   is merged too — fetchMyChildIds prefers it over the phone map. */
function pushSelfLinkToPrivate(studentId, phones, phone){
  try{
    var ids = [];
    (D.students||[]).forEach(function(s){ if(studentHasGuardianPhone(s, phone)) ids.push(s.id); });
    if(fbPriv && !restMode){
      try{ fbPriv.child("phones").child("s_"+studentId).set(phones).catch(function(){}); }catch(e){}
      try{ fbPriv.child("guardianChildren").child(phone).set(ids).catch(function(){}); }catch(e){}
      if(fbAuthUser && fbAuthUser.uid){
        try{
          fbPriv.child("guardianChildrenByUid").child(fbAuthUser.uid).once("value").then(function(snap){
            var cur = snap.val()||{};
            var next = {};
            if(cur && typeof cur==="object" && !Array.isArray(cur)){ Object.keys(cur).forEach(function(k){ if(cur[k]) next[k]=true; }); }
            else if(Array.isArray(cur)){ cur.forEach(function(id){ if(id) next[id]=true; }); }
            next[studentId]=true;
            try{ fbPriv.child("guardianChildrenByUid").child(fbAuthUser.uid).set(next).catch(function(){}); }catch(e){}
          }).catch(function(){});
        }catch(e){}
      }
      return;
    }
    var base = "";
    try{ base = fcmDbBase(); }catch(e){ base = ""; }
    if(!base) return;
    fetch(base+"/schoolApp/v1/private/phones/s_"+studentId+".json", { method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(phones) }).catch(function(){});
    fetch(base+"/schoolApp/v1/private/guardianChildren/"+phone+".json", { method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(ids) }).catch(function(){});
    if(fbAuthUser && fbAuthUser.uid){
      fetch(base+"/schoolApp/v1/private/guardianChildrenByUid/"+fbAuthUser.uid+".json").then(function(r){ return r.json(); }).then(function(cur){
        var next = {};
        if(cur && typeof cur==="object" && !Array.isArray(cur)){ Object.keys(cur).forEach(function(k){ if(cur[k]) next[k]=true; }); }
        else if(Array.isArray(cur)){ cur.forEach(function(id){ if(id) next[id]=true; }); }
        next[studentId]=true;
        fetch(base+"/schoolApp/v1/private/guardianChildrenByUid/"+fbAuthUser.uid+".json", { method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(next) }).catch(function(){});
      }).catch(function(){});
    }
  }catch(e){}
}
function selfLinkStudentByNameRoll(name, className, roll, phone){
  var ph = normPhone(phone||"");
  if(!ph) return "no-login";
  var matches = findStudentsByNameClassRoll(name, className, roll);
  if(!matches.length) return "not-found";
  if(matches.length>1) return "ambiguous";
  var st = matches[0];
  var phones = studentGuardianPhones(st);
  if(phones.indexOf(ph)>=0) return "already";
  if(phones.length>=GUARDIAN_PHONE_MAX) return "full";
  phones.push(ph);
  st.guardianPhones = phones;
  if(!st.guardianPhone) st.guardianPhone = ph;
  /* Visible immediately on this device: myChildren() reads
     ui.myChildIds, which is also persisted to localStorage. */
  if(!ui.myChildIds || !Array.isArray(ui.myChildIds)) ui.myChildIds = [];
  if(ui.myChildIds.indexOf(st.id)<0) ui.myChildIds.push(st.id);
  ui.guardianIdsFetchedAt = Date.now();
  try{ localStorage.setItem(GUARDIAN_CHILDREN_KEY, JSON.stringify(ui.myChildIds)); }catch(e){}
  try{ persistLocal(); }catch(e){}
  pushSelfLinkToPrivate(st.id, phones, ph);
  return "linked";
}

function guardianMessagesToArray(m){
  var arr = [];
  if(!m) return arr;
  if(Array.isArray(m)) arr = m.filter(Boolean);
  else if(m && typeof m === "object") Object.keys(m).forEach(function(ph){
    var bucket = m[ph];
    if(Array.isArray(bucket)) bucket.forEach(function(x){ if(x) arr.push(x); });
    else if(bucket && typeof bucket === "object") Object.keys(bucket).forEach(function(k){ if(bucket[k]) arr.push(bucket[k]); });
  });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
/* The number a message/call goes to for one student: the admin's

function guardianPhoneForStudent(st, preferred){

  if(pref && list.indexOf(pref)>=0) return pref;

  if(!isGuardian()) return [];

function guardianUnreadCount(){

     for the guardian — the guardian's own ("guardian") messages are
     never unread for them. */

}
/* Live chat directions (v1.0.16): one conversation in
   private/guardianMessages/<phone> holds BOTH sides. direction
   "guardian" = written by the guardian, "admin" = written by the
   admin. Messages WITHOUT a direction field are old admin messages
   (written before v1.0.16) — missing direction ALWAYS means admin,
   so old messages render and count exactly as before. */
function gmDirection(m){ return (m && m.direction === "guardian") ? "guardian" : "admin"; }
/* Admin-side chat unread: guardian-direction messages the admin has
   not read yet — across all conversations (tab badge) or one phone
   (conversation-list row). */
function adminChatUnreadCount(){
  if(!isAdmin()) return 0;
  var n = 0;
  guardianMessagesToArray(D.guardianMessages || {}).forEach(function(x){

function adminChatUnreadForPhone(ph){

  Object.keys(bucket).forEach(function(id){
    var m = bucket[id];
    if(m && gmDirection(m)==="guardian" && !m.read) n++;
  });
  return n;
}
/* Opening an admin thread marks that guardian's guardian-direction
   messages read (their read flag means "the admin has read it"). */
function markGuardianChatRead(ph){
  if(!isAdmin()) return;
  var bucket = (D.guardianMessages||{})[normPhone(ph||"")] || {};
  var changed = false;
  Object.keys(bucket).forEach(function(id){
    var m = bucket[id];
    if(m && gmDirection(m)==="guardian" && !m.read){ m.read = true; changed = true; pushGuardianMessageToPrivate(m); }
  });

}

/* ---------------- admin "new opinion / complaint" badges ----------------
   Guardians write মতামত (public node) and অভিযোগ (private node); the
   admin only finds out by opening the tab — there is NO push for these
   and there cannot be one without a server (no Blaze/card, and the
   OneSignal REST key must never live in the app). So the admin gets an
   in-app unread badge instead: per-device "seen" timestamps in
   localStorage, the newest createdAt the admin has seen on this phone.
   Items WITHOUT a createdAt never count (old/legacy data can never
   badge forever). ADMIN-ONLY: guardians must never see a complaint
   count — they do not load the private complaints node anyway. */
var OPINIONS_SEEN_KEY = "school-opinions-seen";
var COMPLAINTS_SEEN_KEY = "school-complaints-seen";
function newestCreatedAt(items){
  var newest = "";
  (items||[]).forEach(function(x){ var c = x && x.createdAt ? String(x.createdAt) : ""; if(c && (!newest || c > newest)) newest = c; });
  return newest;
}
function getSeenStamp(key){
  try{ var v = localStorage.getItem(key); return v === null ? "" : v; }catch(e){ return ""; }
}
function setSeenStamp(key, v){
  try{ localStorage.setItem(key, v || ""); }catch(e){}
}
function opinionsUnreadCount(){
  if(!isAdmin() || !D) return 0;
  var seen = getSeenStamp(OPINIONS_SEEN_KEY);
  return (D.opinions||[]).filter(function(o){ return o && o.createdAt && String(o.createdAt) > seen; }).length;
}
function complaintsUnreadCount(){
  if(!isAdmin() || !D) return 0;
  var seen = getSeenStamp(COMPLAINTS_SEEN_KEY);
  return (D.complaints||[]).filter(function(c){ return c && c.createdAt && String(c.createdAt) > seen; }).length;
}
/* Opening the মতামত / অভিযোগ tab marks everything there seen — call
   from render() and renderTabSwitch() before the tab bar is built, so
   the badge clears in the same switch. */
function markOpinionsComplaintsSeen(){
  if(!isAdmin() || !D) return;
  if(ui.tab==="opinions"){ var n = newestCreatedAt(D.opinions); if(n) setSeenStamp(OPINIONS_SEEN_KEY, n); }
  else if(ui.tab==="complaints"){ var m = newestCreatedAt(D.complaints); if(m) setSeenStamp(COMPLAINTS_SEEN_KEY, m); }
}
var guardianMsgLoaded = false, guardianMsgLoading = false;
var guardianChatPollTimer = null;
function fetchGuardianMessages(done, force){
  if(!isGuardian() || !guardianPhone){ if(done) done(); return; }
  if(!force && guardianMsgLoaded){ if(done) done(); return; }
  if(guardianMsgLoading){ if(done) done(); return; }
  var base = fcmDbBase();
  if(!base){ if(done) done(); return; }
  guardianMsgLoading = true;
  var ph = normPhone(guardianPhone);
  fetch(base + "/schoolApp/v1/private/guardianMessages/" + ph + ".json", { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(val){

      if(!D.guardianMessages || typeof D.guardianMessages !== "object") D.guardianMessages = {};
      if(val) D.guardianMessages[ph] = val;
      persistLocal();
      if(done) done();
      /* renderFromSync (not render): the typing hold means a poll
         never rebuilds the DOM under the guardian's fingers. */
      renderFromSync();
    })
    .catch(function(){ guardianMsgLoading = false; if(done) done(); });
}
/* Live chat (v1.0.16): while the guardian has the বার্তা tab open,
   re-fetch their own subtree every ~15s so the admin's reply appears
   without reopening the tab. One timer at most; it re-schedules
   itself after each poll and stops when the tab is left (the goto
   handler clears it). */
function scheduleGuardianChatPoll(){
  if(guardianChatPollTimer) return;
  guardianChatPollTimer = setTimeout(function(){
    guardianChatPollTimer = null;
    if(ui.tab==="guardianmsg" && isGuardian()){
      fetchGuardianMessages(function(){ scheduleGuardianChatPoll(); }, true);

  }, 15000);
}
function stopGuardianChatPoll(){

}
function markGuardianMessagesRead(){
  if(!isGuardian()) return;

  /* Live chat: only ADMIN-direction messages are "unread" for the
     guardian — the guardian's own messages are marked read by the
     admin's thread view instead (their read flag means the admin
     has read them). */
  var list = myGuardianMessages().filter(function(x){ return gmDirection(x)==="admin" && !x.read; });
  if(!list.length) return;
  var base = fcmDbBase();
  list.forEach(function(m){

        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(m)

}
function pushGuardianMessageToPrivate(m){

     Old messages have none — leave them direction-less on re-PUT

}

/* In-memory only: bot-answered questions live here, never in D and
   never in Firebase — a reload clears them, which is fine: the
   guardian can ask again and the bot answers again. */
var helpBotLocal = [];
var helpBotSeq = 0;
function helpBotNormalize(text){
  return String(text||"").replace(/[^\u0980-\u09FFa-zA-Z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function helpBotKeyMatches(q, words, k){
  var kk = helpBotNormalize(k);
  if(!kk) return false;
  if(kk.indexOf(" ") >= 0) return q.indexOf(kk) >= 0;
  var i;
  if(kk.length <= 2){
    for(i=0;i<words.length;i++){ if(words[i] === kk) return true; }
    return false;
  }
  for(i=0;i<words.length;i++){ if(words[i].indexOf(kk) === 0) return true; }
  return false;
}
function helpBotFindAnswer(text){
  var q = helpBotNormalize(text);
  if(!q) return "";
  var words = q.split(" ");
  var best = "", bestScore = 0;
  HELP_FAQS.forEach(function(f){
    var score = 0;
    f.keys.forEach(function(k){ if(helpBotKeyMatches(q, words, k)) score++; });
    if(score > bestScore){ bestScore = score; best = f.answer; }
  });
  return best;
}
function helpBotAddLocal(question, answer){
  var now = new Date().toISOString();
  helpBotLocal.push({ id:"botq-" + (++helpBotSeq), text:question, bot:"q", createdAt:now });
  helpBotLocal.push({ id:"bota-" + (++helpBotSeq), text:answer, bot:"a", createdAt:now });
}

/* ---- ported: call.js (madrasa v1.0.18, adapted) ---- */
/* ---------------- ইন্টারনেট কল (v1.0.17) ----------------
   Admin calls ONE guardian from inside the app, over the internet
   (WebRTC voice, audio-only) — free, no SIM balance, no phone
   number sharing: the guardian's number never leaves the admin's
   view (it is already on the student record).
   Signalling rides the SAME private Firebase node as guardian
   messages: private/calls/<guardianPhoneDigits>/<callId>. The
   caller (admin) writes the offer + ICE candidates; the callee
   (guardian) writes the answer + ICE candidates. Status moves
   ringing -> answered | declined | missed, then ended. Calls are
   written with targeted PUTs (putCallRecord) and preserved by
   privateData(D) / mergePrivate, exactly like guardianMessages —
   whole-node save() never drops them.
   CLOSED APP (v1.0.17, PIGGYBACK — no money, no extra battery,
   no server): a call can also ring when the guardian's app is
   CLOSED / the screen is locked — but NOT instantly. The APK
   already wakes the phone about every 5 minutes for the
   opinion / message / notice checks (GuardianMessageReceiver);
   that same wake now also does ONE extra GET of the calls node
   for the stored guardian phone (CallCheck.check, same
   goAsync + wake lock, same re-arm, no new alarm cadence, no
   foreground service, no polling loop — essentially zero extra
   battery). A ringing call inside its 10-minute window posts
   the same full-screen incoming-call screen with ringtone.
   That is why the ring window is 10 minutes: the next ~5-min
   check must have time to catch the call, plus time for the
   guardian to answer. HONEST LIMIT (told to the user, do NOT
   fake it): typical latency is one poll cycle (~5 min) when
   the phone is awake, longer in Doze — the same profile as
   the opinion / message alarm. Instant ringing would need a
   paid push server, SMS, or battery-hungry polling, and the
   user rejected all three. The OneSignal nudge stays on the
   calling screen as a manual extra push, not as the ring
   itself.
   ICE: Google's free public STUN only — no TURN server exists, so
   on some strict networks (symmetric NAT) the audio may fail to
   connect even though the ringing worked. That is a network limit,
   not an app bug; it will be found by testing on two real phones.
   Ringtone: Web Audio two-tone chime + vibration. If the browser
   blocks audio (no user gesture yet on this phone), the chime
   stays silent and the flashing incoming screen + vibration are
   the ring. No audio file is added — the page stays
   self-contained. */
var CALL_ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "stun:stun2.l.google.com:19302" },
  { urls: "stun:stun3.l.google.com:19302" }
];
var CALL_RING_SECONDS = 600;
var CALL_POLL_MS = 3000;
var CALL_STATUSES = ["ringing","answered","declined","ended","missed"];
/* --- pure helpers (unit-tested in test-internet-call.js) --- */
function callIsValidStatus(s){ return CALL_STATUSES.indexOf(s) >= 0; }
function callNewId(){ return "call-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function callIsRinging(c){ return !!c && c.status === "ringing"; }
function callIsLive(c){ return !!c && (c.status === "ringing" || c.status === "answered"); }
function callIsExpired(c, nowMs){
  if(!callIsRinging(c)) return false;
  var t = Date.parse(c.createdAt || "");
  if(!isFinite(t)) return false;
  return (nowMs - t) > CALL_RING_SECONDS * 1000;
}
/* Pure state machine: the ONLY legal moves. Terminal states
   (declined/ended/missed) never move again — a late answer to a
   call that already timed out is ignored, not resurrected. */
function callNextStatus(c, event){
  if(!c || !callIsValidStatus(c.status)) return null;
  if(c.status === "ringing"){
    if(event === "answer") return "answered";
    if(event === "decline") return "declined";
    if(event === "miss" || event === "timeout") return "missed";
    if(event === "end") return "ended";
  }
  if(c.status === "answered" && event === "end") return "ended";
  return null;
}
function callsToArray(calls){
  var arr = [];
  if(!calls) return arr;
  if(Array.isArray(calls)) arr = calls.filter(Boolean);
  else if(typeof calls === "object") Object.keys(calls).forEach(function(ph){
    var bucket = calls[ph];
    if(bucket && typeof bucket === "object") Object.keys(bucket).forEach(function(k){ if(bucket[k]) arr.push(bucket[k]); });
  });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
/* Newest live call for one guardian phone, or null. Expired ringing
   calls (older than 10 minutes) do NOT count — the admin's timer has
   already marked them missed. */
function callLiveForPhone(calls, ph, nowMs){
  var list = callsToArray(calls).filter(function(c){ return normPhone(c.guardianPhone || "") === normPhone(ph || ""); });
  var i, c;
  for(i=0;i<list.length;i++){ c = list[i]; if(callIsLive(c) && !callIsExpired(c, nowMs)) return c; }
  return null;
}
/* The one call the guardian should be ringing for right now: the
   newest ringing (not yet answered) call for their phone that is
   still inside its 10-minute window. */
function callIncomingForPhone(calls, ph, nowMs){
  var list = callsToArray(calls).filter(function(c){ return normPhone(c.guardianPhone || "") === normPhone(ph || ""); });
  var i, c;
  for(i=0;i<list.length;i++){
    c = list[i];
    if(c.status === "ringing" && !callIsExpired(c, nowMs)) return c;
  }
  return null;
}
function callRecordFor(student, admin, phone){
  var ph = guardianPhoneForStudent(student, phone);
  var now = new Date().toISOString();
  return {
    id: callNewId(), guardianPhone: ph,
    studentId: student.id || "", studentName: student.name || "",
    className: student.className || "", roll: student.roll || "",
    fromAdminName: (admin && admin.name) || "অ্যাডমিন",
    fromAdminPhone: (admin && admin.phone) || "",
    status: "ringing", offer: null, answer: null,
    callerCandidates: [], calleeCandidates: [],
    createdAt: now, updatedAt: now, endedAt: "", endedBy: ""
  };
}
function callPayload(c){
  return {
    id: c.id, guardianPhone: c.guardianPhone,
    studentId: c.studentId || "", studentName: c.studentName || "",
    className: c.className || "", roll: c.roll || "",
    fromAdminName: c.fromAdminName || "", fromAdminPhone: c.fromAdminPhone || "",
    status: c.status, offer: c.offer || null, answer: c.answer || null,
    callerCandidates: c.callerCandidates || [], calleeCandidates: c.calleeCandidates || [],
    createdAt: c.createdAt || "", updatedAt: c.updatedAt || "",
    endedAt: c.endedAt || "", endedBy: c.endedBy || ""
  };
}
/* The text left in the guardian's বার্তা thread when a call rings
   10 minutes with no answer. It is an admin-direction message (direction
   "admin", callMissed:true), so it badges and reads like any admin
   message — only this guardian sees it. */
function callMissedMessageText(c){
  var who = c.fromAdminName || "অ্যাডমিন";
  var child = c.studentName ? (" (" + c.studentName + ")") : "";
  return "📞 মিসড কল — " + who + " আপনাকে কল করেছিলেন" + child + "। কলটি বাজেনি (অ্যাপ বন্ধ ছিল বা সাড়া পাওয়া যায়নি)। পরেরবার অ্যাপ খোলা রাখলে কল বাজবে।";
}
function callCanStart(student){
  return !!student && studentGuardianPhones(student).length>0;
}
/* ---------------- guardian contact row (v1.0.18, multi-number) --------
   One row of contact options per LINKED guardian number (admin-only).
   The admin picks whichever fits the moment:
     📞 অ্যাপ কল — the in-app internet call (WebRTC, free);
     📱 ডায়াল কল — tel: opens the phone dialer (normal call);
     WhatsApp — wa.me/<880...> opens the WhatsApp CHAT with that
       guardian; the admin taps call inside WhatsApp. There is NO
       official WhatsApp direct-call link — do not invent one.
     imo — best effort ONLY: opens the imo APP (no per-contact
       imo call/chat link exists anywhere, so this cannot open a
       specific chat; the admin finds the contact inside imo).
       Needs the native intent handler (MainActivity, v1.0.18);

     💬 মেসেজ — the existing per-guardian chat thread;

   The row renders ONLY for the admin and ONLY when the student

var IMO_INTENT_URL = "intent://#Intent;package=com.imo.android.imoim;end";

      + '<a class="mini-btn" style="text-decoration:none;color:inherit" href="sms:'+esc(ph)+'">✉️ SMS</a>'

/* ---------------- group meetings (Jitsi Meet, free, v1.0.18) --------
   A live group conference — ALL guardians together, or ALL teachers
   together, audio + video — with NO server, NO account, NO key and
   NO money: the meeting runs on Jitsi's free public instance
   (meet.jit.si), embedded in the app through the Jitsi External API.
   Honest limits (do not promise more):
   - The PUBLIC Jitsi instance carries the meeting: traffic passes
     through Jitsi's free servers, rooms are NOT end-to-end encrypted
     by default, and anyone who learns the room name can try to join
     — the per-meeting password (below) is the barrier, not a wall.
   - Quality depends on each phone's internet; a big group on weak
     data will be choppy. There is no recording and no moderation
     beyond Jitsi's own controls.
   - The meeting needs this phone's camera + mic: they come through
     the existing WebView permission prompt (v1.0.6/v1.0.17) — one tap
     to allow, at join time. If the Jitsi script cannot load (no
     internet when joining), the in-app frame falls back to a plain
     Jitsi iframe, and a "ব্রাউজারে খুলুন" link opens the meeting in
     the system browser instead (native intent, v1.0.18).
   Data: one record per meeting in D.meetings (PUBLIC node — the
   participants need the room id; the record holds NO phone numbers):
     {roomId, kind:"students"|"teachers", startedBy, startedAt,
      status:"live"|"ended", password}

      else if(fresh.status === "missed"){ callCleanup(); return; }
      if(callState.pc && callState.answerApplied){ callState.appliedCallee = callApplyCandidates(callState.pc, fresh.calleeCandidates, callState.appliedCallee); }

/* --- guardian incoming-call poll: every 3s while a guardian

function scheduleCallGuardianPoll(){

function idcardEditDist(a,b){

    var liM=lines[i];
    if(/মাতার নাম|mother'?s? name/i.test(liM)){
      var valM=liM.replace(/মাতার নাম|mother'?s? name/i,"").replace(/^[\s:ঃ\-–—;|+]+/,"").trim();
      valM=valM.replace(/^ছবি\s*[:ঃ]?\s*/,"");
      if(!valM && i+1<lines.length){
        var nxM=lines[i+1];
        if(!/রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|পিতা|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|roll|class|phone|mobile|section/i.test(nxM)) valM=nxM;
      }
      valM=idcardFixMoPrefix(idcardCleanName(valM));
      if(valM) out.motherName=valM;
    }
  }
  /* --- class: word near the শ্রেণী / ক্লাস label --- */
  for(i=0;i<lines.length && !out.className;i++){
    var li2=lines[i];
    if(/শ্রেণী|শ্রেনী|শ্রেণি|ক্লাস|জামাত|class/i.test(li2)){
      var after=li2.replace(/^.*?(শ্রেণী|শ্রেনী|শ্রেণি|ক্লাস|জামাত|class)\s*[:ঃ\-]?\s*/i,"");
      var cw=idcardClassFromWord(after);
      if(cw) out.className=cw;
    }
  }
  /* --- class fallback: a class word anywhere in the text --- */
  for(i=0;i<lines.length && !out.className;i++){
    var cw2=idcardClassFromWord(lines[i]);
    if(cw2) out.className=cw2;
  }
  /* --- section (বিভাগ/শাখা): text after the বিভাগ / শাখা label ---
     A শ্রেণী/ক্লাস line is never a section (e.g. "শ্রেণী: হেফজ বিভাগ"
     is the class, not the section), and a value equal to the detected
     class is skipped too. */
  for(i=0;i<lines.length && !out.section;i++){
    var liS=lines[i];
    if(/বিভাগ|শাখা|section/i.test(liS) && !/শ্রেণী|শ্রেনী|ক্লাস|class/i.test(liS)){
      var afterS=liS.replace(/^.*?(বিভাগ|শাখা|section)\s*[:ঃ\-]?\s*/i,"");
      var sv=idcardCleanName((afterS.split(/[,।]/)[0]||"").trim());
      sv=sv.replace(/^([কখগঘ])শাখা$/,"$1 শাখা");
      sv=idcardFixSection(sv); /* লুরানি/নুরানী are one-letter OCR slips of নূরানী */
      if(sv && sv!==out.className && sv.length<=30) out.section=sv;
    }
  }
  /* --- address: after the ঠিকানা label (kept as written, digits included) --- */
  for(i=0;i<lines.length && !out.address;i++){
    var liA=lines[i];
    if(/ঠিকানা|ঠিকান|address/i.test(liA)){
      var valA=liA.replace(/^.*?(ঠিকানা|ঠিকান|address)\s*[:ঃ\-;|+]?\s*/i,"").trim();
      valA=valA.replace(/^[.,\-–—:ঃ\s]+/,"").replace(/[.,\-–—:ঃ\s]+$/,"");
      if(valA && valA.replace(/[0-9০-৯]/g,"").replace(/[^̀-῿A-Za-z]/g,"").length<2) valA=""; /* unreadable symbols / a lone fragment: leave blank, don't store garbage */
      if(valA && valA.length>=2 && valA.length<=60) out.address=valA;
    }
  }
  /* --- name: after the student's name label (never father's/mother's) --- */
  for(i=0;i<lines.length && !out.name;i++){
    var li3=lines[i];
    if(/পিতার নাম|মাতার নাম|শিক্ষার্থীর নাম|father'?s? name|mother'?s? name/i.test(li3)) continue;
    var lab=null;
    if(/শিক্ষার্থীর নাম|শিক্ষার্থীর নাম|শিক্ষার্থীীর নাম/.test(li3)) lab=/শিক্ষার্থীর নাম|শিক্ষার্থীর নাম|শিক্ষার্থীীর নাম/;
    else if(/নাম\s*[:ঃ]/.test(li3)) lab=/নাম\s*[:ঃ]/;
    else if(/নাম\s*$/.test(li3)) lab=/নাম\s*$/;
    else if(/^name\s*[:\-]/i.test(li3)) lab=/^name\s*[:\-]/i;
    if(lab){
      var val=li3.replace(lab,"").replace(/^[\s:ঃ\-–—]+/,"").trim();
      val=val.replace(/^ছবি\s*[:ঃ]?\s*/,"");
      if(!val && i+1<lines.length){
        var nx2=lines[i+1];
        if(!/রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|পিতা|মাতা|ঠিকানা|জন্ম|roll|class|phone|mobile/i.test(nx2)) val=nx2;
      }
      val=idcardFixMoPrefix(idcardCleanName(val));
      if(val) out.name=val;
    }
  }
  /* A name that IS the father's/mother's name, or starts with it,
     is a misread, not the student's name — drop it and let the
     green-name / big-name fallback find the real student name. */
  if(out.name && out.fatherName && idcardSameName(out.name, out.fatherName)) out.name="";
  if(out.name && out.motherName && idcardSameName(out.name, out.motherName)) out.name="";
  if(out.name && out.fatherName && idcardStartsWithName(out.name, out.fatherName)) out.name="";
  if(out.name && out.motherName && idcardStartsWithName(out.name, out.motherName)) out.name="";
  /* --- name WITHOUT a label: the big center name on cards like this
     madrasa's (no "নাম:" anywhere) can never be found by labels.
     Use Tesseract's word boxes: the tallest bare Bengali name line
     is the student's name. Without word data, the longest bare
     name-like text line is used. The parent's names are excluded,
     so the fallback can never return the father's name. */
  /* --- name in big green letters below the photo: the green-crop
     OCR reads just that line, so it beats the text-based big-name
     fallback — but never a label name, and never the father's or
     mother's name. */
  if(!out.name && greenName){
    var gn=idcardFixMoPrefix(idcardCleanName(greenName));
    if(gn){
      var isParent=(out.fatherName && (idcardSameName(gn, out.fatherName) || idcardStartsWithName(gn, out.fatherName)))
        || (out.motherName && (idcardSameName(gn, out.motherName) || idcardStartsWithName(gn, out.motherName)));
      if(!isParent) out.name=gn;
    }
  }
  if(!out.name){
    out.name=idcardBigName(words, lines, [out.fatherName, out.motherName]);
  }
  /* --- father's name WITHOUT a readable label: on a noisy card the
     "পিতার নাম" label itself can be misread as Latin ("Pema"), so
     the label search finds nothing. Fall back to a line that is a
     bare মোঃ name (3-4 Bengali words, no label/madrasa words) and
     is not the student's own name. */
  if(!out.fatherName){
    for(i=0;i<lines.length && !out.fatherName;i++){
      var liFx=lines[i];
      if(!/মোঃ/.test(liFx)) continue; /* the line must really carry মোঃ — fixMoPrefix must never invent it for a garbage line */
      if(/পিতার|মাতার|নাম|রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|স্কুল|মাদরাসা|ইন্টারন্যাশনাল|পরিচয়পত্র|মোহতামিম|ছবি/i.test(liFx)) continue;
      /* the label itself may be misread as Latin ("Pema: মোঃ ...") —
         drop everything up to the first colon, the name follows it */
      var liFx2=liFx.replace(/^[^:]*:\s*/,"");
      var cand=idcardFixMoPrefix(idcardCleanName(liFx2));
      if(cand && /^মোঃ\s/.test(cand) && !idcardSameName(cand, out.name)){
        var cwFx=cand.split(/\s+/);
        if(cwFx.length>=3 && cwFx.length<=4) out.fatherName=cand;
      }
    }
  }
  return out;
}
function fillStudentFormFromScan(p, rawText){

  if(p.fatherName && setField("fatherName", p.fatherName)) found.push("পিতার নাম");
  if(p.motherName && setField("motherName", p.motherName)) found.push("মাতার নাম");
  if(p.roll && setField("roll", p.roll)) found.push("রোল");

      }
    }
  }
  if(p.section && setField("section", p.section)) found.push("বিভাগ");
  if(p.address && setField("address", p.address)) found.push("ঠিকানা");

  if(found.length){
    idcardSetStatus("✅ পাওয়া গেছে: "+found.join(", ")+" — মিলিয়ে নিয়ে নিচে সংরক্ষণ করুন।");
    toast("আইডি কার্ড থেকে "+found.join(", ")+" বসানো হয়েছে — মিলিয়ে নিন");
  } else {
    idcardSetStatus("⚠️ কার্ড পড়া গেছে, কিন্তু নাম/রোল/শ্রেণী/ফোন চেনা যায়নি — আলো ভালো করে কার্ডটা সোজা করে আবার তুলুন, বা হাতে লিখুন।");
    toast("কার্ড থেকে তথ্য চেনা যায়নি — আবার চেষ্টা করুন");
  }
  var det=document.getElementById("idcardScanRaw"), pre=document.getElementById("idcardScanText");
  if(det && pre && rawText){ det.style.display=""; pre.textContent=rawText; }
}
function downscaleImage(dataUrl, maxW){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        if(!img.width || img.width<=maxW){ resolve(dataUrl); return; }
        var scale=maxW/img.width;
        var cv=document.createElement("canvas");
        cv.width=maxW; cv.height=Math.max(1, Math.round(img.height*scale));
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL("image/jpeg",0.85));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}
/* Grayscale + contrast boost before OCR: phone photos of cards are
   often low-contrast, and Tesseract reads black-on-white text far
   better than a colour photo. Any failure falls back to the
   original image, so this can never break a scan. */
function preprocessForOcr(dataUrl){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");
        cv.width=img.width; cv.height=img.height;
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.drawImage(img,0,0);
        var d=cx.getImageData(0,0,cv.width,cv.height), px=d.data;
        for(var i=0;i<px.length;i+=4){
          var g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
          var v=(g-128)*1.5+128;
          if(v<0) v=0; if(v>255) v=255;
          px[i]=v; px[i+1]=v; px[i+2]=v;
        }
        cx.putImageData(d,0,0);
        resolve(cv.toDataURL("image/jpeg",0.9));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}
/* A green-crop OCR line is the student's name when it is 2-4
   Bengali words, no digits, no labels. Each line of the crop text
   is tried; the first name-like line wins. */
function idcardGreenNameClean(t){
  var lines=String(t||"").split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var s=idcardFixMoPrefix(idcardCleanName(lines[i]));
    if(!s) continue;
    if(!/[̀-῿]/.test(s)) continue;
    if(/[0-9০-৯]/.test(lines[i])) continue;
    if(/নাম|পিতা|মাতা|রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|স্কুল|মোহতামিম|ছবি/i.test(s)) continue;
    var w=s.split(/\s+/);
    if(w.length>=2 && w.length<=4) return s;
  }
  return "";
}
/* Find the green student name: locate the biggest green-text band
   (the big name below the photo), crop it, grayscale+contrast it,
   and OCR just that line. Returns the cleaned name or "". It never
   throws — any failure returns "" so the normal scan path is
   unaffected. The header is also green, but it is a solid panel
   (filtered by fill) and its text is yellow, so the band finder
   picks the name, not the header. */
function idcardGreenName(dataUrl){
  return new Promise(function(resolve){
    try{
      if(typeof Tesseract==="undefined"){ resolve(""); return; }
      var img=new Image();
      img.onload=function(){
        try{
          var cv=document.createElement("canvas");
          cv.width=img.width; cv.height=img.height;
          var cx=cv.getContext("2d");
          if(!cx){ resolve(""); return; }
          cx.drawImage(img,0,0);
          var d=cx.getImageData(0,0,cv.width,cv.height);
          var band=idcardGreenBand(d.data, cv.width, cv.height);
          if(!band){ resolve(""); return; }
          var bw=band.x1-band.x0+1, bh=band.y1-band.y0+1;
          var x0=Math.max(0, band.x0-Math.round(bw*0.25));
          var x1=Math.min(cv.width-1, band.x1+Math.round(bw*0.25));
          var y0=Math.max(0, band.y0-Math.round(bh*0.5));
          var y1=Math.min(cv.height-1, band.y1+Math.round(bh*0.5));
          var cw2=document.createElement("canvas");
          cw2.width=x1-x0+1; cw2.height=y1-y0+1;
          var cx2=cw2.getContext("2d");
          if(!cx2){ resolve(""); return; }
          cx2.drawImage(cv, x0, y0, cw2.width, cw2.height, 0, 0, cw2.width, cw2.height);
          var d2=cx2.getImageData(0,0,cw2.width,cw2.height), p2=d2.data;
          for(var i=0;i<p2.length;i+=4){
            var g2=0.299*p2[i]+0.587*p2[i+1]+0.114*p2[i+2];
            var v=(g2-128)*1.5+128; if(v<0)v=0; if(v>255)v=255;
            p2[i]=v; p2[i+1]=v; p2[i+2]=v;
          }
          cx2.putImageData(d2,0,0);
          var url=cw2.toDataURL("image/jpeg",0.9);
          Tesseract.recognize(url, "ben+eng", { tessedit_pageseg_mode:"7" }).then(function(res){
            var nm=idcardGreenNameClean((res && res.data && res.data.text)||"");
            if(nm) return nm;
            return Tesseract.recognize(url, "ben+eng", { tessedit_pageseg_mode:"6" }).then(function(res2){
              return idcardGreenNameClean((res2 && res2.data && res2.data.text)||"");
            });
          }).then(function(nm){ resolve(nm||""); }).catch(function(){ resolve(""); });
        }catch(e){ resolve(""); }
      };
      img.onerror=function(){ resolve(""); };
      img.src=dataUrl;
    }catch(e){ resolve(""); }
  });
}
/* Tesseract (ID-card OCR) is admin-only and used rarely, so it is NOT
   loaded at boot — the old static <script> tag cost every guardian a
   large library download and parse on every app open. It is fetched on
   demand the first time a scan actually runs, then cached for the
   session. A failed load rejects so the next scan can retry. */
var TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
var tesseractPromise = null;
function ensureTesseract(){
  if(typeof Tesseract !== "undefined") return Promise.resolve();
  if(tesseractPromise) return tesseractPromise;
  tesseractPromise = new Promise(function(resolve, reject){
    var done = false;
    function ok(){
      if(done) return; done = true;
      if(typeof Tesseract !== "undefined") resolve();
      else { tesseractPromise = null; reject(new Error("tesseract missing")); }
    }
    function bad(){
      if(done) return; done = true;
      tesseractPromise = null; reject(new Error("tesseract load failed"));
    }
    var s = document.createElement("script");
    s.src = TESSERACT_URL;
    s.onload = ok;
    s.onerror = bad;
    try{ document.head.appendChild(s); }catch(e){ bad(); return; }
    /* Hard timeout: a stalled CDN must not hang the scan forever. */
    setTimeout(function(){ if(!done) bad(); }, 30000);
  });
  return tesseractPromise;
}
function runIdCardOcr(dataUrl){
  if(typeof Tesseract==="undefined"){
    idcardSetStatus("📥 পড়ার সফটওয়্যার লোড হচ্ছে… প্রথমবার একটু সময় লাগবে, অপেক্ষা করুন");
    ensureTesseract().then(function(){ runIdCardOcr(dataUrl); }).catch(function(){
      idcardSetStatus("❌ পড়ার সফটওয়্যার লোড হয়নি — ইন্টারনেট চেক করে আবার চেষ্টা করুন");
      toast("OCR লোড হয়নি — ইন্টারনেট চেক করুন");
    });
    return;
  }
  idcardSetStatus("🔍 আইডি কার্ড পড়া হচ্ছে… প্রথমবার একটু সময় লাগবে, অপেক্ষা করুন");
  var greenName="";
  downscaleImage(dataUrl, 2000).then(function(url){
    /* First read just the big green name below the photo (colour
       image — the greyscale step below would erase the colour),
       then read the whole card as usual. */
    return idcardGreenName(url).then(function(gn){
      greenName=gn||"";
      if(greenName) idcardSetStatus("✅ ছবির নিচের সবুজ নামটা পাওয়া গেছে — বাকিটা পড়া হচ্ছে…");
      return url;
    });
  }).then(function(url){
    return preprocessForOcr(url);
  }).then(function(url){
    return Tesseract.recognize(url, "ben+eng", { tessedit_pageseg_mode:"6", logger:function(m){
      if(m && m.status==="recognizing text" && typeof m.progress==="number"){
        idcardSetStatus("🔍 আইডি কার্ড পড়া হচ্ছে… "+Math.round(m.progress*100)+"%");
      } else if(m && m.status){
        idcardSetStatus("🔍 আইডি কার্ড পড়া হচ্ছে… ("+m.status+")");
      }
    }});
  }).then(function(res){
    var text=(res && res.data && res.data.text)||"";
    var words=(res && res.data && res.data.words)||null;
    var p=parseIdCardText(text, words, greenName);
    fillStudentFormFromScan(p, text);
  }).catch(function(){
    idcardSetStatus("❌ কার্ড পড়া যায়নি — আলো ভালো করে কার্ডটা সোজা করে আবার তুলুন");
    toast("আইডি কার্ড পড়া যায়নি — আবার চেষ্টা করুন");
  });
}
/* ---------------- ID-card rotate preview ----------------
   The card is often photographed sideways (text running
   vertically), and Tesseract reads sideways text as garbage —
   that was the main reason real scans failed. So after the photo
   is taken/picked, a preview sheet lets the admin rotate the
   image 90° per tap until the text reads straight, then tap
   "পড়ুন" to run OCR on the shown orientation. OCR is NOT run
   four times automatically (too slow on a phone). */
var idcardScanDataUrl="", idcardRotDeg=0;
function openIdCardRotateSheet(dataUrl){
  idcardScanDataUrl=dataUrl; idcardRotDeg=0;
  ui.sheet="idcard-rotate"; render();
}

/* Rotate the image data itself (not just the preview) so OCR sees
   the upright card. */
function rotateImageDataUrl(dataUrl, deg){
  return new Promise(function(resolve){
    if(!deg){ resolve(dataUrl); return; }
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");
        var rad=deg*Math.PI/180;
        if(deg===90 || deg===270){ cv.width=img.height; cv.height=img.width; }
        else { cv.width=img.width; cv.height=img.height; }
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.translate(cv.width/2, cv.height/2);
        cx.rotate(rad);
        cx.drawImage(img, -img.width/2, -img.height/2);
        resolve(cv.toDataURL("image/jpeg",0.9));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}
/* Dedicated gallery picker for ID cards: its own hidden input with
   its own change listener, so cancelling the gallery leaves no
   stale flag behind — a later normal photo pick is never mistaken
   for a scan. */
var idcardInput=null;
function ensureIdCardInput(){
  if(idcardInput) return idcardInput;
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;";
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0];
    if(f) handleIdCardFile(f);
    try{ inp.value=""; }catch(e){}
  });
  document.body.appendChild(inp);
  idcardInput=inp;
  return inp;
}
function handleIdCardFile(file){
  var name=String(file.name||"").toLowerCase();
  if(/\.heic$|\.heif$/.test(name) || file.type==="image/heic" || file.type==="image/heif"){ toast("এই ছবির ফরম্যাট (HEIC) সমর্থিত নয় — JPG বা PNG ছবি বেছে নিন"); return; }
  if(file.type && file.type.indexOf("image/")!==0){ toast("শুধু ছবির ফাইল বেছে নিন"); return; }
  if(file.size>10*1024*1024){ toast("ছবিটি অনেক বড় (১০ MB-এর বেশি) — ছোট ছবি বেছে নিন"); return; }
  fileToDataUrl(file, 2000).then(function(url){ openIdCardRotateSheet(url); }).catch(function(){ idcardSetStatus("❌ ছবি পড়া যায়নি — আবার চেষ্টা করুন"); toast("ছবি পড়া যায়নি — আবার চেষ্টা করুন"); });
}

/* ---- ported: typing.js (madrasa v1.0.18, adapted) ---- */
/* Typing guard (ported): while the user is typing in a text field,
   background sync renders are held; when the field is left, the pending
   render runs. The setTimeout lets a focus move straight to another text
   field re-arm the guard first, so no render ever lands between two fields. */
function isTextFieldEl(el){
  if(!el || !el.tagName) return false;
  var t = el.tagName.toUpperCase();
  if(t==="TEXTAREA" || t==="SELECT") return true;
  if(t==="INPUT"){
    var ty = (el.getAttribute && (el.getAttribute("type")||"text") || "text").toLowerCase();
    return ["text","search","tel","email","password","number","url","date","time"].indexOf(ty)>=0;
  }
  return !!el.isContentEditable;
}
var typingActive = false;
document.addEventListener("focusin", function(e){ if(isTextFieldEl(e.target)) typingActive = true; }, { capture:true, passive:true });
document.addEventListener("focusout", function(e){
  if(!isTextFieldEl(e.target)) return;
  typingActive = false;
  setTimeout(function(){ if(!typingActive && !pointerDown) flushSyncRender(); }, 0);
}, { capture:true, passive:true });

/* Fast path for tab switches: rebuild only the tab bar's active state
   and the main region. The masthead — logo image and all — is left
   untouched, so one tap switches instantly, whatever the Firebase sync
   happens to be doing in the background. */
function renderTabSwitch(){
  if(!D){ render(); return; }
  if(!isGuardian() && !isAdmin() && !isTeacher()){ render(); return; }
  if(ui.tab==="admin" && !ui.adminRevealed && !isAdmin()) ui.tab = "home";
  markOpinionsComplaintsSeen();
  var nav = appEl.querySelector("nav.tabs");
  if(nav){
    var tmp = document.createElement("div");
    tmp.innerHTML = tabbarHtml();
    if(tmp.firstChild) nav.replaceWith(tmp.firstChild);
  }
  var main = document.getElementById("mainRegion");
  if(!main){ render(); return; }
  main.innerHTML = '<div class="wrap">' + mainContentHtml(D.settings) + "</div>";
  afterRender();
}

function renderStatus(){

function statusHtml(){
  if(refreshing) return '<span class="dot"></span> রিফ্রেশ হচ্ছে…';
  if(syncStatus==="live") return '<span class="dot on"></span> লাইভ — সব ফোনে একই তথ্য আপডেট হচ্ছে';
  if(syncStatus==="connecting") return '<span class="dot"></span> Firebase-এর সাথে যুক্ত হচ্ছে…';
  if(syncStatus==="error") return '<span class="dot off"></span> Firebase সংযোগে সমস্যা — নেটওয়ার্ক চেক করে আবার চেষ্টা করুন';

}

/* ---- student-detail lock ----
   A logged-in student may open ONLY their own linked record. Tapping
   any other student's card (student list, public tab, or anywhere a
   detail can open) shows the locked state instead — NO photo, NO
   attendance, NO results, NO fees, NO detail data of any kind.

function studentDetailHtml(st){
  var myAtt = [], myRes = [], myFees = [];
  Object.keys(D.attendance).forEach(function(k){
    var rec = D.attendance[k] && D.attendance[k][st.id];
    if(rec) myAtt.push({ date:k.slice(k.lastIndexOf("|")+1), status:rec });
  });
  myAtt.sort(function(a,b){ return a.date<b.date?1:-1; });
  /* Privacy: results and fees are personal. They render only for a
     logged-in admin (from the private node), or inside the guardian's
     own "রেজাল্ট ও ফি" tab for the one child that guardian picked —
     in live mode those records come from that child's own childData
     node, fetched on demand; the full collections never reach a
     guardian device. Never from the public student list, and never
     as an all-students list. */
  var canSeePrivate = isAdmin() || (ui.tab==="mychild" && isMyChild(st));
  var childLoading = false;
  myRes = []; myFees = [];
  if(isAdmin()){
    myRes = D.results.filter(function(r){ return r.studentId===st.id; });
    myFees = D.fees.filter(function(f){ return f.studentId===st.id; });
  } else if(ui.tab==="mychild"){
    if(fbRoot || restMode){
      if(ui.childData && ui.childDataId===st.id){ myRes = ui.childData.results || []; myFees = ui.childData.fees || []; }
      else childLoading = true;
    } else {
      // Local mode: everything lives on this one device already.
      myRes = D.results.filter(function(r){ return r.studentId===st.id; });
      myFees = D.fees.filter(function(f){ return f.studentId===st.id; });
    }
  }
  var present = myAtt.filter(function(a){ return a.status==="present"||a.status==="late"; }).length;
  var html = '<button type="button" class="btn ghost small" data-act="'+(ui.tab==="mychild"?"mychild-back":"student-back")+'">'+icon("back","sm")+" তালিকায় ফিরুন</button>";
  html += '<div class="founder-card" style="margin-top:12px">'
    + (safeImg(st.photo)?'<img src="'+safeImg(st.photo)+'" alt="শিক্ষার্থীর ছবি" />':'<div class="avatar-fallback">'+icon("grad","lg")+"</div>")
    + '<div><span class="chip">'+esc(st.className)+'</span><h3>'+esc(st.name)+"</h3><p style='margin:2px 0 0'>রোল: "+esc(bnNum(Number(st.roll)||st.roll))+"</p></div></div>";
  html += '<div class="detail-grid">';
  if(canSeePrivate){
    html += '<div class="detail-box"><h4>'+icon("calcheck")+' হাজিরা</h4>'
      + '<p style="margin:0 0 6px"><span class="pill gold">শ্রেণী: '+esc(st.className)+'</span> <span class="dim small">— এই শ্রেণীর হাজিরা</span></p>'
      + (myAtt.length
        ? "<p>মোট দিন: "+bnNum(myAtt.length)+" • উপস্থিত: "+bnNum(present)+"</p>" + myAtt.slice(0,6).map(function(a){ return "<p>"+fmtDateBn(a.date)+" — "+attLabel(a.status)+"</p>"; }).join("")
        : '<p class="dim">এখনো হাজিরা রেকর্ড নেই।</p>') + "</div>";
  } else {
    html += '<div class="detail-box"><h4>'+icon("lock")+' হাজিরা — শুধু নিজের</h4>'
      + '<p class="dim">হাজিরা প্রত্যেক শিক্ষার্থীর ব্যক্তিগত তথ্য, তাই এখানে দেখানো হয় না। শিক্ষার্থী লগইন করে <b>রেজাল্ট ও ফি</b> ট্যাবে গেলে শুধু আপনার হাজিরা, রেজাল্ট ও ফি-ই দেখা যাবে।</p></div>';
  }
  if(canSeePrivate){
    html += '<div class="detail-box"><h4>'+icon("trophy")+' পরীক্ষার রেজাল্ট</h4>'
      + (myRes.length
        ? myRes.map(function(r){ return "<p><b>"+esc(st.name)+"</b>"+classPill(st)+"<br/>শ্রেণী: "+esc(st.className)+" • রোল: "+esc(bnNum(Number(st.roll)||st.roll))+"<br/>পরীক্ষা: <b>"+esc(r.exam)+"</b><br/>প্রাপ্ত নম্বর "+bnNum(r.marks)+"/"+bnNum(r.total)+" • গ্রেড "+esc(r.grade)+(Array.isArray(r.subjects) && r.subjects.length?"<br/>"+subjectBreakdownHtml(r):"")+"</p>"+resultFilesRowHtml(r); }).join("")
        : '<p class="dim">'+(childLoading?"লোড হচ্ছে…":"এখনো রেজাল্ট দেওয়া হয়নি।")+'</p>') + "</div>";
    html += '<div class="detail-box"><h4>'+icon("wallet")+' ফি-এর হিসাব</h4>'
      + (myFees.length
        ? myFees.map(function(f){ return "<p><b>মাস: "+esc(f.month)+"</b>"+classPill(st)+"<br/>শিক্ষার্থী: "+esc(st.name)+" • শ্রেণী: "+esc(st.className)+"<br/>"+fmtMoney(f.amount)+" • "+feeLabel(f.status)+"</p>"; }).join("")
        : '<p class="dim">'+(childLoading?"লোড হচ্ছে…":"এখনো ফি-এর হিসাব দেওয়া হয়নি।")+'</p>') + "</div>";
  } else {
    html += '<div class="detail-box"><h4>'+icon("lock")+' রেজাল্ট ও ফি — শুধু নিজের</h4>'
      + '<p class="dim">রেজাল্ট ও ফি প্রত্যেক শিক্ষার্থীর ব্যক্তিগত তথ্য, তাই এখানে দেখানো হয় না। শিক্ষার্থী লগইন করে <b>রেজাল্ট ও ফি</b> ট্যাবে গেলে শুধু আপনার রেজাল্ট ও ফি-ই দেখা যাবে — অন্য কারো শিক্ষার্থী খুলবে না।</p></div>';
  }
  html += "</div>";
  return html;
}

/* Guardian-only private view: pick the class, then find the child by
   name or roll and tap them — only that one child's results and fees
   are shown. No all-students results/fees list exists in this view. */
function myChildHtml(){
  /* Guardian login gate: no login, no child data at all. Admins keep
     their full view through the Admin panel; here an admin also sees
     the full list, but a guardian sees ONLY their own linked children. */
  if(ui.myChildId){
    var st0 = D.students.filter(function(x){ return x.id===ui.myChildId; })[0];
    if(st0 && (isAdmin() || isMyChild(st0))){
      if(!isAdmin() && (fbRoot || restMode) && ui.childDataId!==st0.id) loadChildData(st0.id);
      return studentDetailHtml(st0);
    }
    /* A stale myChildId pointing at another student's record stays
       LOCKED (never silently falls back to the list as if nothing
       happened). Only a logged-in student is locked here; admins,
       teachers and logged-out visitors keep their current flow. */
    if(st0 && studentDetailLocked(st0)) return studentDetailLockedHtml();
    ui.myChildId = null;

  if(!isGuardian() && !isAdmin()) return guardianLoginHtml();
  if(isGuardian() && typeof refreshMyChildIdsIfStale==="function") refreshMyChildIdsIfStale();
  if(isGuardian() && (ui.myChildIds===null || ui.myChildIds===undefined) && !ui.guardianIdsLoading) fetchMyChildIds();
  var html = '<h2 class="sec-title">'+icon("trophy")+" আমার তথ্য</h2>";
  if(isGuardian()){
    html += '<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>শিক্ষার্থী লগইন করা আছে</b><div class="dim small">ফোন: '+esc(guardianPhone)+' — নিচে শুধু আপনি(দের) দেখা যাচ্ছে।</div></div><button type="button" class="btn ghost small" data-act="guardian-logout">লগআউট</button></div>';
  }
  html += '<p class="dim small" style="margin:0 0 10px">রেজাল্ট, ফি ও হাজিরা ব্যক্তিগত তথ্য — একজন শিক্ষার্থী শুধু নিজেরটাই দেখতে পারবে, অন্য কারো নয়। নিচের তালিকায় শুধু আপনার তথ্য আছে; নাম বা রোল দিয়ে খুঁজতে পারবেন।</p>';
  html += '<div class="filter-row"><select data-change="mychild-class" aria-label="শ্রেণী বেছে নিন">'
    + '<option'+(ui.myChildClass==="সব ক্লাস"?" selected":"")+">সব ক্লাস</option>"
    + D.classes.map(function(c){ return "<option"+(ui.myChildClass===c?" selected":"")+">"+esc(c)+"</option>"; }).join("")
    + '</select><input type="search" placeholder="আপনার নাম বা রোল দিয়ে খুঁজুন" data-input="mychild-search" value="'+esc(ui.myChildSearch)+'" aria-label="শিক্ষার্থী খুঁজুন" /></div>';

    if(ui.myChildSearch){ var q=ui.myChildSearch.trim(); if(x.name.indexOf(q)<0 && String(x.roll).indexOf(q)<0) return false; }
    return true;
  });

/* ---------------- complaint box (private) ----------------
   Complaints are admin-only. They are stored ONLY in the private
   Firebase node: a guardian phone writes its own complaint child
   (private/complaints/<id>) and never reads the node, so no guardian
   can see another guardian's complaint. The submitting phone keeps
   its own complaints locally and re-reads just those ids to pick up
   the admin's reply. Admins get the full list from the private node,
   and can reply or delete. */
function pushComplaintToPrivate(c){
  var payload = { id:c.id, name:c.name, phone:c.phone||"", className:c.className||"", text:c.text, createdAt:c.createdAt, reply:c.reply||"", repliedAt:c.repliedAt||"" };
  if(fbPriv && !restMode){
    try{ fbPriv.child("complaints").child(c.id).set(payload).catch(function(){}); return; }catch(e){}
  }
  var base = fcmDbBase();
  if(base){
    fetch(base + "/schoolApp/v1/private/complaints/" + c.id + ".json" + authQuery(), {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).catch(function(){});
  }
}
function pushDeletionToPrivate(r){
  var payload = { id:r.id, name:r.name, phone:r.phone||"", childName:r.childName||"", className:r.className||"", reason:r.reason||"", createdAt:r.createdAt };
  if(fbPriv && !restMode){
    try{ fbPriv.child("deletionRequests").child(r.id).set(payload).catch(function(){}); return; }catch(e){}
  }
  var base = fcmDbBase();
  if(base){
    fetch(base + "/schoolApp/v1/private/deletionRequests/" + r.id + ".json" + authQuery(), {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).catch(function(){});
  }
}
var ownComplaintsChecked = false;
function fetchOwnComplaintReplies(){
  if(ownComplaintsChecked || isAdmin() || !D.complaints.length) return;
  var base = fcmDbBase();
  if(!base) return;
  ownComplaintsChecked = true;
  var changed = false;
  var chain = Promise.resolve();
  D.complaints.slice(0, 20).forEach(function(c){
    chain = chain.then(function(){
      return fetch(base + "/schoolApp/v1/private/complaints/" + c.id + ".json" + authQuery(), { cache: "no-store" })
        .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
        .then(function(srv){
          if(srv === null){
            // Deleted by the admin — drop it from this phone's list too.
            D.complaints = D.complaints.filter(function(x){ return x.id !== c.id; });
            changed = true;
          } else if(srv && (srv.reply || "") !== (c.reply || "")){
            c.reply = srv.reply || ""; c.repliedAt = srv.repliedAt || "";
            changed = true;
          }
        }).catch(function(){});
    });
  });
  chain.then(function(){ if(changed){ persistLocal(); if(ui.tab === "complaints") render(); } });
}

/* ---------------- শিক্ষক বার্তা (teachers-only) ----------------
   Head/primary admin posts a message for ALL teachers (admins + the
   other ~10 teachers). Guardians NEVER see these messages.
   - Storage: ONLY the private Firebase node ("private/teacherMessages").
     publicData() strips them, so they never ride the public node.
   - Teacher identity: phone-number match only (no password) against the
     phone stored in the teacher profile. On a teacher's own phone the
     numbers are not in the public node, so login also pulls ONLY the
     private phones index + teacherMessages over REST to verify.
   - Every teacher can reply under a message (opinion / question). */
function teacherMessagesToArray(m){
  var arr = [];
  if(Array.isArray(m)) arr = m.filter(Boolean);
  else if(m && typeof m === "object") Object.keys(m).forEach(function(k){ if(m[k]) arr.push(m[k]); });
  arr.forEach(function(x){ if(!Array.isArray(x.replies)) x.replies = []; });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
function normalizePhone(ph){
  var d = String(ph || "").replace(/\D/g, "");
  if(d.indexOf("880") === 0) d = d.slice(3);
  if(d.charAt(0) === "0") d = d.slice(1);
  return d;
}
function findTeacherByPhoneLocal(ph){
  var n = normalizePhone(ph);
  if(!n) return null;
  var found = null;
  (D.teachers || []).forEach(function(x){ if(x.phone && normalizePhone(x.phone) === n) found = x; });
  return found;
}
var teacherPhone = "";
var teacherSession = null;
function isTeacher(){ return !!teacherPhone; }
function setTeacherSession(t, phone){
  teacherPhone = normPhone(phone || (t && t.phone) || "");
  teacherSession = { phone:teacherPhone, teacherId:(t && t.id) || "", name:(t && t.name) || "শিক্ষক", classes:(t && t.classes) || (t && t.classTaken ? [t.classTaken] : []), subjects:(t && t.subjects) || (t && t.subject ? [t.subject] : []) };
  ui.teacherId = teacherSession.teacherId; ui.teacherName = teacherSession.name; ui.teacherPhone = teacherPhone;
  try{ localStorage.setItem("school-teacher-session", JSON.stringify(teacherSession)); }catch(e){}
}
function clearTeacherSession(){
  teacherPhone = ""; teacherSession = null;
  ui.teacherId = null; ui.teacherName = ""; ui.teacherPhone = "";
  try{ localStorage.removeItem("school-teacher-session"); }catch(e){}
}
function restoreTeacherSession(){
  if(teacherPhone || ui.teacherId) return;
  var raw = "";
  try{ raw = localStorage.getItem("school-teacher-session") || ""; }catch(e){}
  if(!raw) return;
  if(raw.charAt(0)==="{"){ try{ teacherSession = JSON.parse(raw); teacherPhone = normPhone(teacherSession.phone||""); }catch(e){ teacherPhone = normPhone(raw); } }
  else teacherPhone = normPhone(raw);
  if(!teacherPhone) return;
  var t = findTeacherByPhoneLocal(teacherPhone);
  if(t){ ui.teacherId = t.id; ui.teacherName = t.name || "শিক্ষক"; ui.teacherPhone = teacherPhone; return; }
  ui.teacherName = (teacherSession && teacherSession.name) || "শিক্ষক"; ui.teacherPhone = teacherPhone;
}

function fetchTeacherMessagesForTeacher(done){
  // Teacher's own phone: pull ONLY the private phones index + the
  // teacher messages over REST (never the whole private node, which
  // also holds the admin accounts).
  var base = fcmDbBase();
  if(!base){ done(null); return; }
  fetch(base + "/schoolApp/v1/private/teacherMessages.json" + authQuery(), { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(val){
      if(val !== undefined && val !== null) D.teacherMessages = teacherMessagesToArray(val);
      return fetch(base + "/schoolApp/v1/private/phones.json" + authQuery(), { cache: "no-store" });
    })
    .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(phones){ done(phones || null); })
    .catch(function(){ done(null); });
}

/* ---------------- নতুন ৫টি সুবিধা: ক্লাস রুটিন, শিক্ষক হাজিরা ও ছুটি, হোমওয়ার্ক, পরীক্ষার রুটিন ও সিলেবাস, CCTV ----------------
   - ক্লাস রুটিন / হোমওয়ার্ক / পরীক্ষা: শিক্ষার্থীদের জন্য — public node-এ যায়, ক্লাস ধরে দেখা যায়।

function toArraySorted(v, key){
