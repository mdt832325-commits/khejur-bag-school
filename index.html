/* ---------------- in-app camera (ported from the madrasa app) ----------------
   The 📷 ক্যামেরা buttons do NOT use a file input: Android WebView
   does not honour the capture attribute, so a capture file input
   falls through to the gallery chooser. This sheet instead shows the
   live camera inside the app via getUserMedia. "ছবি তুলুন" draws the
   video frame to a canvas (max 800px, JPEG 0.8) and feeds it into the
   same handlePhotoFile() as a gallery pick, so the preview/save flow
   is identical. The stream is stopped on capture, on cancel, and
   whenever the sheet closes. If the camera cannot start (no camera /
   permission denied), the sheet STAYS OPEN with a clear Bengali
   message and an "আবার চেষ্টা করুন" retry button. Only after a
   SECOND consecutive failure does the sheet close and the gallery
   picker open instead.
   NOTE: inside the installed school APK this also needs a native
   rebuild — CAMERA permission + onPermissionRequest grant in
   MainActivity (like madrasa APK v1.0.6). HTML alone is not enough. */
var cameraStream=null, cameraStarting=false, cameraFailCount=0;
function cameraSheetHtml(){
  var body = '<div class="sheet-scrim" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-label="ক্যামেরা">'
    + '<h2>📷 ক্যামেরা<button type="button" class="close-x" data-act="camera-cancel" aria-label="বন্ধ করুন">'+icon("x","sm")+"</button></h2>"
    + '<p class="dim small" style="margin:0 0 10px">ছবিটা ক্যামেরায় দেখে "ছবি তুলুন" চাপুন — তোলা ছবিটা সরাসরি এখানে বসে যাবে।</p>'
    + '<video id="cameraVideo" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;min-height:200px"></video>'
    + '<p class="dim small" id="cameraStatus" style="margin:8px 0 0">ক্যামেরা চালু হচ্ছে…</p>'
    + '<div class="row-btns" style="margin-top:10px"><button type="button" class="btn gold" data-act="camera-capture">📸 ছবি তুলুন</button>'
    + '<button type="button" class="btn gold" id="cameraRetryBtn" data-act="camera-retry" style="display:none">আবার চেষ্টা করুন</button>'
    + '<button type="button" class="btn ghost" data-act="camera-cancel">বাতিল</button></div>'
    + "</div></div>";
  return body;
}
function attachCameraVideo(){
  var v=document.getElementById("cameraVideo");
  if(v && cameraStream){ try{ v.srcObject=cameraStream; v.play().catch(function(){}); }catch(e){} }
}
function stopCameraStream(){
  if(cameraStream){ try{ cameraStream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }catch(e){} cameraStream=null; }
  cameraStarting=false;
  var v=document.getElementById("cameraVideo");
  if(v){ try{ v.srcObject=null; }catch(e){} }
}
function closeCameraSheetFallback(){
  ui.sheet=null;
  stopCameraStream();
  render();
  ensurePhotoInput();
  photoInput.click();
}
function startCameraStream(){
  if(cameraStream){ attachCameraVideo(); return; }
  if(cameraStarting) return;
  if(!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia!=="function"){
    toast("ক্যামেরা খোলা যায়নি — গ্যালারি থেকে ছবি বেছে নিন");
    closeCameraSheetFallback();
    return;
  }
  cameraStarting=true;
  function onCamOk(stream){
    cameraStarting=false; cameraStream=stream; attachCameraVideo();
    var st=document.getElementById("cameraStatus"); if(st) st.textContent="ক্যামেরা চালু আছে — ছবি তুলুন";
  }
  function onCamFail(){
    cameraStarting=false;
    cameraFailCount++;
    if(cameraFailCount>=2){
      toast("ক্যামেরা খোলা যায়নি — গ্যালারি থেকে ছবি বেছে নিন");
      closeCameraSheetFallback();
      return;
    }
    var st=document.getElementById("cameraStatus");
    if(st) st.textContent="ক্যামেরার অনুমতি দেওয়া হয়নি — আবার চেষ্টা করুন";
    var rb=document.getElementById("cameraRetryBtn");
    if(rb){ try{ rb.style.display=""; }catch(e){} }
    toast("ক্যামেরার অনুমতি দেওয়া হয়নি — আবার চেষ্টা করুন");
  }
  try{
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false }).then(onCamOk).catch(function(){
      try{ navigator.mediaDevices.getUserMedia({ video:true, audio:false }).then(onCamOk).catch(onCamFail); }catch(e){ onCamFail(); }
    });
  }catch(e){ onCamFail(); }
}
function openCameraSheet(){
  ui.sheet="camera";
  cameraFailCount=0;
  render();
  startCameraStream();
}
function retryCameraStream(){
  var st=document.getElementById("cameraStatus");
  if(st) st.textContent="ক্যামেরা চালু হচ্ছে…";
  var rb=document.getElementById("cameraRetryBtn");
  if(rb){ try{ rb.style.display="none"; }catch(e){} }
  startCameraStream();
}
function captureCameraPhoto(){
  toast("ছবি তোলা হচ্ছে…");
  var v=document.getElementById("cameraVideo");
  if(!cameraStream || !v || !v.videoWidth){
    toast("ক্যামেরা এখনো চালু হচ্ছে — একটু অপেক্ষা করে আবার চাপুন");
    return;
  }
  var maxW=800, scale=v.videoWidth>maxW?maxW/v.videoWidth:1;
  var cv=document.createElement("canvas");
  cv.width=Math.max(1, Math.round(v.videoWidth*scale));
  cv.height=Math.max(1, Math.round(v.videoHeight*scale));
  var cx=cv.getContext("2d");
  if(!cx){ toast("ছবি তোলা যায়নি — আবার চেষ্টা করুন"); return; }
  cx.drawImage(v,0,0,cv.width,cv.height);
  var kind=pendingPhotoKind||"student";
  /* Synchronous: toDataURL returns the JPEG right away. The old async
     blob round-trip never called back on the user's phone
     (WebGL-dead WebView), so a taken photo silently never arrived. */
  var url="";
  try{ url=cv.toDataURL("image/jpeg", 0.8); }catch(e){ url=""; }
  if(!url || url.indexOf("data:image/")!==0){ toast("ছবি তোলা যায়নি — আবার চেষ্টা করুন"); return; }
  stopCameraStream();
  ui.sheet=null;
  render();
  /* A camera capture supersedes any in-flight gallery decode for this
     kind — the late gallery result must never overwrite it. */
  photoPickSeq[kind]=(photoPickSeq[kind]||0)+1;
  applyPickedPhotoUrl(kind, url);
}

/* ---------------- কুইজ প্রতিযোগিতা (student panel) ----------------
   The quiz is played through a STUDENT panel, not the guardian
   login: before playing, the player fills a short registration form
   (institution name, own name, phone, age, roll number, class).
   Students come from MANY institutions in the area, so the
   institution name is completely free text with NO pre-filled value
   (placeholder "আপনার প্রতিষ্ঠানের নাম লিখুন"), and the class is a
   dropdown (প্লে–দশম + অন্যান্য, with a free-text box for অন্যান্য).
   The details are remembered on the device (localStorage) so they are
   not re-typed for the next quiz, and can be edited. Every attempt is
   saved with those fields in the private node (quizAttempts) so the
   admin can see who played; the leaderboard is admin-only and shows
   name + class + institution + score (+ phone, age, roll, date).
   Quizzes themselves (title, class, questions + correct answers)
   live in the public node. No timers, no negative marking. */
var QUIZ_PLAYER_KEY = "school-quiz-player";
/* Classes for the quiz registration form. Students come from many
   institutions in the area, so "অন্যান্য" lets a student type their
   own class name. */
var QUIZ_CLASSES=["প্লে","নার্সারি","শিশু","প্রথম","দ্বিতীয়","তৃতীয়","চতুর্থ","পঞ্চম","ষষ্ঠ","সপ্তম","অষ্টম","নবম","দশম","অন্যান্য"];
function quizPlayer(){
  try{ var p = JSON.parse(localStorage.getItem(QUIZ_PLAYER_KEY)||"null"); return p||null; }catch(e){ return null; }
}
/* Effective class of a registered player: the custom text when
   "অন্যান্য" was chosen, otherwise the chosen class. */
function quizPlayerClass(p){
  p=p||{};
  if(p.className==="অন্যান্য") return p.classOther||"অন্যান্য";
  return p.className||"";
}
function saveQuizPlayer(p){
  try{ localStorage.setItem(QUIZ_PLAYER_KEY, JSON.stringify(p)); }catch(e){}
}
function quizAnswer(idx){
  var qz=(D.quizzes||[]).filter(function(x){ return x.id===ui.quizPlayId; })[0];
  if(!qz) return;
  var qs=qz.questions||[];
  if(ui.quizIdx>=qs.length) return;
  ui.quizAnswers[ui.quizIdx]=idx;
  if(ui.quizIdx+1>=qs.length){ finishQuiz(qz); return; }
  ui.quizIdx++; render();
}
function finishQuiz(qz){
  var qs=qz.questions||[], score=0;
  qs.forEach(function(q,i){ if(ui.quizAnswers[i]===Number(q.correct)) score++; });
  var p=quizPlayer()||{};
  var att={ id:uid(), quizId:qz.id, quizTitle:qz.title, className:qz.className||"সবাই", playerName:p.name||"শিক্ষার্থী", institution:p.institution||"", phone:p.phone||"", age:p.age||"", roll:p.roll||"", playerClass:quizPlayerClass(p), score:score, total:qs.length, createdAt:new Date().toISOString() };
  if(!Array.isArray(D.quizAttempts)) D.quizAttempts=[];
  D.quizAttempts.unshift(att);
  pushQuizAttemptToPrivate(att);
  persistLocal();
  ui.quizDone=att; ui.quizPlayId=null; ui.quizIdx=0; ui.quizAnswers=[];
  render(); window.scrollTo(0,0);
}

  } else {

function loginHtml(){
  // BUG FIX 2026-11-06: the admin login form must NEVER wait on the
  // private node. It used to return a "loading…" card while
  // fbPriv && !privLoaded, and nothing ever set privLoaded for a
  // logged-out visitor — the entry gate's Admin button never called
  // ensurePrivateLoaded() (only the old open-login path did) — so the
  // form never appeared. Now the private fetch runs in the
  // background and the LOGIN form shows immediately, using whatever
  // is known locally. Setup is offered only once the private node
  // has actually loaded and proved there are no admins — showing
  // setup before that could create a second primary admin on a
  // device where admins exist in Firebase but have not loaded yet.
  var privStillLoading = !!(fbPriv && !privLoaded);
  if(privStillLoading) ensurePrivateLoaded();
  var needsSetup = !privStillLoading && D.admins.length===0;
  var html = "";
  if(needsSetup){
    html += '<section class="card"><h2 class="sec-title">'+icon("lock")+' প্রধান অ্যাডমিন অ্যাকাউন্ট তৈরি করুন</h2>'
      + '<p class="dim small">প্রথমবার: প্রধান অ্যাডমিনের নাম, ফোন নম্বর, পাসওয়ার্ড আর একটি গোপন শব্দ (রিকভারি শব্দ) দিন। গোপন শব্দটা মনে রাখবেন — পাসওয়ার্ড ভুলে গেলে এটা দিয়েই রিসেট করা যাবে।</p>'
      + '<form data-form="setup">'

/* Photo pick — MADRASA mechanism (proven on this phone, 2026-11-12):
   two plain buttons, NO file input in the form markup at all. The tap
   on "ছবি বেছে নিন" is caught by the delegated [data-photo-pick]
   click handler, which records the kind and calls photoInput.click()
   on ONE shared hidden input (ensurePhotoInput, appended to
   document.body, outside the re-rendered form). The picked file
   arrives through that input's change event -> handlePhotoFile.
   The school's old overlay input (inside the re-rendered form) and
   the v1.0.12 pull/bridge chain both failed on this phone at the
   same invisible step; the madrasa's simple path works. */
function photoPickHtml(kind, current){
  /* An in-flight instant preview (blob URL) wins over the stored
     photo while the decode runs, so a re-render mid-decode never
     wipes the photo the user just saw appear. The blob URL comes
     from our own state (never from stored data), so it is escaped
     directly; safeImg still guards the stored `current` value. */
  var blobSrc=(typeof photoBlobUrl!=="undefined" ? (photoBlobUrl[kind]||"") : "");
  var imgSrc=blobSrc ? esc(blobSrc) : safeImg(current);
  return '<div class="photo-pick" data-photo-kind="'+kind+'">'
    + (imgSrc ? '<img src="'+imgSrc+'" alt="" />' : '<span class="avatar-fallback" style="width:64px;height:64px;border-radius:12px">'+icon("users")+'</span>')
    + '<button type="button" class="btn ghost small" style="margin:0" data-photo-pick="'+kind+'">ছবি বেছে নিন</button>'
    + '<button type="button" class="btn ghost small" style="margin:0" data-photo-camera="'+kind+'">📷 ক্যামেরা</button></div>';
}

/* ---- Teacher profile: PER-CLASS subjects + MULTI-class CHECKBOX editors ----
   Admin → শিক্ষক form. The source of truth while editing is the MAP
   ui.teacherClassSubjectsEdit = { className: [subjects] }, seeded from
   the edited teacher (migration: an old record with no map yet is
   seeded as {every class: all subjects}, so old records re-open with
   the right boxes ticked). ui.teacherClassesEdit is the ticked-class
   list (the map keys); ui.teacherSubjectsEdit is only the DERIVED
   union of all mapped subjects, kept in step for the submit branch.
   For EACH ticked class the editor shows its own subject row: the 8
   standard subjects as checkboxes (RESULT_SUBJECTS + any custom
   subjects already saved for that class) + a free-text subject box
   scoped to that class. Ticking a class reveals its subject row;
   unticking a class removes its subjects. Updates are IN PLACE:
   ticking a checkbox only updates ui state + the summary line (or
   rebuilds just the subject container), never the whole form, so
   typed name/phone is never lost. Only the free-text "যোগ করুন"
   button re-renders the two checkbox containers
   (refreshTeacherEditChips), rebuilding them from ui state, so
   ticked boxes stay ticked. */
function teacherClassSubjectsEditMap(){
  if(!ui.teacherClassSubjectsEdit || typeof ui.teacherClassSubjectsEdit !== "object") ui.teacherClassSubjectsEdit = {};
  return ui.teacherClassSubjectsEdit;
}
function teacherEditSubjectsUnion(){
  var map = ui.teacherClassSubjectsEdit || {}, out = [];
  Object.keys(map).forEach(function(c){
    (map[c]||[]).forEach(function(s){ s=String(s||"").trim(); if(s && out.indexOf(s)<0) out.push(s); });
  });
  return out;
}
function teacherEditInit(ed){
  if(!Array.isArray(ui.teacherClassesEdit)) ui.teacherClassesEdit = ed ? teacherClassesOf(ed) : [];
  if(!ui.teacherClassSubjectsEdit || typeof ui.teacherClassSubjectsEdit !== "object"){
    ui.teacherClassSubjectsEdit = ed ? teacherClassSubjectsOf(ed) : {};
  }
  if(!Array.isArray(ui.teacherSubjectsEdit)) ui.teacherSubjectsEdit = ed ? teacherSubjectsOf(ed) : [];
  /* The flat union is only a derived summary — recompute it from the
     map so it can never drift from the per-class rows. */
  ui.teacherSubjectsEdit = teacherEditSubjectsUnion();
}
function teacherSubjectsPickedText(){
  var cls = ui.teacherClassesEdit || [];
  var map = ui.teacherClassSubjectsEdit || {};
  if(!cls.length) return "এখনো কোনো ক্লাস বাছা হয়নি — নিচে ক্লাসে টিক দিলে প্রতিটি ক্লাসের জন্য বিষয় বাছার ঘর খুলবে।";
  return cls.map(function(c){
    var subs = map[c] || [];
    return esc(c) + ": " + (subs.length ? "<b>"+esc(subs.join(", "))+"</b>" : "বিষয় বাছা হয়নি");
  }).join(" • ");
}
function teacherClassesPickedText(){
  var list = ui.teacherClassesEdit || [];
  return list.length ? "বাছা ক্লাস: <b>"+esc(list.join(", "))+"</b>" : "এখনো কোনো ক্লাস বাছা হয়নি — উপরের ক্লাসগুলোতে টিক দিন। শিক্ষক এই ক্লাসগুলোর হাজিরা, হোমওয়ার্ক, রুটিন আর রেজাল্ট দিতে পারবেন।";
}
function updateTeacherEditPicked(){
  var a = document.getElementById("teacherSubjectPicked"); if(a) a.innerHTML = teacherSubjectsPickedText();
  var b = document.getElementById("teacherClassPicked"); if(b) b.innerHTML = teacherClassesPickedText();

function teacherSubjectsEditorHtml(ed){
  teacherEditInit(ed);
  var map = teacherClassSubjectsEditMap();
  var cls = ui.teacherClassesEdit || [];
  var h = '<div class="f" id="teacherSubjectChips"><span>প্রতিটি ক্লাসের বিষয় (ক্লাসে টিক দিলে তার বিষয়ের ঘর খুলবে)</span>';
  if(!cls.length){
    h += '<p class="dim small" style="margin:6px 0 0">এখনো কোনো ক্লাস বাছা হয়নি — নিচে "কোন কোন ক্লাস নেন" থেকে ক্লাসে টিক দিন, তারপর প্রতিটি ক্লাসের বিষয় বাছুন।</p>';
  }
  cls.forEach(function(c){
    /* One subject row per ticked class: the 8 standard subjects as
       checkboxes, then any custom subjects already saved for THIS
       class (also as ticked checkboxes, so a free-text subject stays
       visible and can be unticked on re-open), + a free-text box
       scoped to this class only. */
    var list = map[c] || [];
    var all = RESULT_SUBJECTS.slice();
    list.forEach(function(s){ if(all.indexOf(s)<0) all.push(s); });
    h += '<div style="margin:8px 0 4px"><b>'+esc(c)+'</b> — বিষয়</div>';

      + all.map(function(s){

        }).join("") + '</div>';

      + '<button type="button" class="mini-btn" data-act="teacher-subject-add-free" data-class="'+esc(c)+'">＋ যোগ করুন</button></div>';
  });
  h += '<p class="dim small" id="teacherSubjectPicked" style="margin:4px 0 0">'+teacherSubjectsPickedText()+'</p></div>';
  return h;
}

/* Teacher list line: subjects GROUPED BY CLASS, e.g.
   "প্রথম: বাংলা • দ্বিতীয়: গণিত". A class with no subjects mapped
   yet shows bare; a teacher with classes but no subjects at all
   falls back to the old "ক্লাস: প্রথম, দ্বিতীয়" form.
   The "ক্লাস: দেওয়া হয়নি" note shows ONLY when the class list is
   empty — never alongside real classes. Returns RAW text; callers
   esc() it (the home gallery escapes .sub itself). */
function teacherListSubHtml(t){
  var cls = teacherClassesOf(t);
  /* Orphan subjects: a teacher with subjects but no classes yet still
     shows the subjects — otherwise they are invisible in the list AND
     look wiped. The "ক্লাস: দেওয়া হয়নি" line below still applies
     when there are no subjects either. */
  if(!cls.length && teacherSubjectsOfRaw(t).length) return "বিষয়: " + teacherSubjectsOfRaw(t).join(", ");
  if(!cls.length) return "ক্লাস: দেওয়া হয়নি";
  var map = teacherClassSubjectsOf(t);
  var hasAny = cls.some(function(c){ return (map[c]||[]).length; });
  if(!hasAny) return "ক্লাস: " + cls.join(", ");
  return cls.map(function(c){
    var subs = map[c] || [];
    return subs.length ? c + ": " + subs.join(", ") : c;
  }).join(" • ");
}

function studentOptions(selId){

/* Result form's student picker: students grouped under their class
   (শিশু, ওয়ান, টু, থ্রি, নাজেরা, হেফজ বিভাগ — whatever classes exist
   in D.classes, in that order), and every option also carries the
   class name next to the student's name, so the class is visible both
   in the group heading and on each student's own line. */
function studentOptionsGrouped(selId){
  var used = {}, groups = [];
  D.classes.forEach(function(c){ groups.push(c); });
  D.students.forEach(function(x){ if(x.className && groups.indexOf(x.className)<0) groups.push(x.className); });
  var html = "";
  groups.forEach(function(c){
    var members = D.students.filter(function(x){ return (x.className||"")===c; });
    if(!members.length) return;
    used[c] = true;
    html += '<optgroup label="'+esc(c)+'">'
      + members.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+">"+esc(x.name)+" — শ্রেণী: "+esc(x.className||"")+" (রোল "+esc(bnNum(Number(x.roll)||x.roll))+")</option>"; }).join("")
      + "</optgroup>";
  });
  var rest = D.students.filter(function(x){ return !x.className; });
  if(rest.length){
    html += rest.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+">"+esc(x.name)+"</option>"; }).join("");
  }
  return html;
}
/* Fee form's month picker: every month from জানুয়ারি to ডিসেম্বর,
   built from the current date — the current year plus the two years
   after it — so when a year ends, the next year's months (যেমন ২০২৭)
   are already in the list with nothing for the admin to add. The
   stored value is the label itself ("নভেম্বর ২০২৬"), exactly what the
   fee lists already print. The current month starts selected. */
var FEE_MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function feeMonthOptions(){
  var now = new Date(), curY = now.getFullYear(), curM = now.getMonth();
  var html = "";
  for(var y = curY; y <= curY + 2; y++){
    html += '<optgroup label="'+esc(bnNum(y))+' সাল">'
      + FEE_MONTHS_BN.map(function(m, i){
          var label = m + " " + bnNum(y);
          return '<option value="'+esc(label)+'"'+(y===curY && i===curM ? " selected" : "")+">"+esc(label)+"</option>";
        }).join("")
      + "</optgroup>";
  }
  return html;
}
function classPill(st){
  if(!st || !st.className) return "";
  return ' <span class="pill gold">শ্রেণী: '+esc(st.className)+"</span>";
}
function findStudent(id){
  return D.students.filter(function(x){ return x.id===id; })[0] || null;

/* Result/fee forms: class-first picker + grade dropdown.
   The admin picks the class FIRST; the student dropdown then lists ONLY
   that class's students (name + roll, sorted by roll). Picking a class
   updates just the student dropdown in place (refreshResult/FeeStudentOptions)
   so anything already typed in the form is not lost to a full re-render. */
var GRADE_OPTIONS = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "D", "F"];
function classOptions(sel){
  var html = '<option value="">— শ্রেণী বাছুন —</option>';
  html += D.classes.map(function(c){ return '<option value="'+esc(c)+'"'+(sel===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("");
  return html;
}
function studentsOfClassOptions(cls, selId){
  if(!cls) return '<option value="">আগে শ্রেণী বাছুন</option>';
  var list = D.students.filter(function(x){ return (x.className||"")===cls; }).slice()
    .sort(function(a,b){ return (Number(a.roll)||0)-(Number(b.roll)||0); });
  if(!list.length) return '<option value="">এই শ্রেণীতে কোনো শিক্ষার্থী নেই — নিচে নাম ও রোল লিখুন</option>';
  return '<option value="">— শিক্ষার্থী বাছুন —</option>' + list.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+'>'+esc(x.name)+' — রোল '+esc(bnNum(Number(x.roll)||x.roll))+'</option>'; }).join("");
}

function gradeOptions(sel){
  var html = '<option value="">— গ্রেড বাছুন —</option>';
  html += GRADE_OPTIONS.map(function(g){ return '<option value="'+g+'"'+(sel===g?" selected":"")+'>'+g+'</option>'; }).join("");
  return html;

/* Fee/result forms: the picked student's name + roll, unmissable.
   studentInfoHtml(st) renders the line shown under the student dropdown
   ("শিক্ষার্থী: <name> • রোল: <roll> • শ্রেণী: <class>"); the update
   helpers refresh it in place on every student/class change so typed
   exam/marks/amount are never lost to a full re-render. */
function studentInfoHtml(st){
  if(!st) return '<div class="student-info dim small" style="margin:2px 0 8px">শিক্ষার্থী বাছলে এখানে নাম ও রোল নম্বর দেখাবে।</div>';
  return '<div class="student-info" style="margin:2px 0 8px;padding:8px 10px;border-radius:10px;background:var(--card2,#eef6ff);font-weight:600">শিক্ষার্থী: '+esc(st.name)+' • রোল: '+esc(bnNum(Number(st.roll)||st.roll))+' • শ্রেণী: '+esc(st.className||"")+'</div>';
}
function normRoll(s){ return String(s||"").replace(/[\u09E6-\u09EF]/g, function(d){ return "\u09E6\u09E7\u09E8\u09E9\u09EA\u09EB\u09EC\u09ED\u09EE\u09EF".indexOf(d); }).replace(/\s+/g,"").trim(); }
function fillStudentFields(form, st){
  var f = document.querySelector('form[data-form="'+form+'"]'); if(!f) return;
  var nm = f.querySelector('input[name="studentName"]'), rl = f.querySelector('input[name="roll"]');
  if(nm) nm.value = st ? st.name : "";
  if(rl) rl.value = st ? String(st.roll||"") : "";
}
function updateStudentInfo(form, id){
  var st = findStudent(id);
  fillStudentFields(form, st);
  var box = document.querySelector('form[data-form="'+form+'"] .student-info');
  if(box) box.outerHTML = studentInfoHtml(st);
}
function fillStudentByRoll(form){
  var f = document.querySelector('form[data-form="'+form+'"]'); if(!f) return;
  var rl = f.querySelector('input[name="roll"]'); if(!rl) return;
  var r = normRoll(rl.value); if(!r) return;
  var cls = form==="fee" ? ui.feeClass : ui.resultClass;
  var st = D.students.filter(function(x){ return (x.className||"")===cls && normRoll(x.roll)===r; })[0] || null;
  if(st){
    var nm = f.querySelector('input[name="studentName"]'); if(nm) nm.value = st.name;
    var sel = f.querySelector('select[name="studentId"]'); if(sel) sel.value = st.id;
    var box = f.querySelector('.student-info'); if(box) box.outerHTML = studentInfoHtml(st);
  }
}
function refreshResultStudentOptions(){
  var sel = document.querySelector('form[data-form="result"] select[name="studentId"]');
  if(sel) sel.innerHTML = studentsOfClassOptions(ui.resultClass, "");
  updateStudentInfo("result", "");
}

/* ---- Teacher result publishing + result file attachments + subject-wise marks ----
   Mirrors the madrasa notice-attachment pattern (pending file list, one
   persistent file input outside #app, images compressed via the shared
   fileToDataUrl() — max 800px JPEG 0.8 — PDFs read raw as data URLs,
   max 3 MB) and the homework-photo pattern (camera through the shared
   camera sheet + handlePhotoFile, draft stash before the sheet opens).
   Files (max 3) and subjects live ON the result record itself
   (r.files / r.subjects) — same node, same shape as admin results —
   so the student view, the admin list and childData sync show them
   with no separate store. Teachers publish ONLY for their own
   assigned classes (teacherClassesTaken); the submit branch re-checks
   them. A teacher's profile holds PER-CLASS subjects
   (t.classSubjects = { className: [subjects] }); the flat lists
   (t.subjects / t.classes) are derived from the map and the old
   single fields (t.subject / t.classTaken) are kept as the first
   value / joined values so old records keep working — migration is
   read-time, nothing is lost. */
var RESULT_FILES_MAX=3;
var RESULT_SUBJECTS=["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","সমাজ","ধর্ম ও নৈতিক শিক্ষা","তথ্য ও যোগাযোগ প্রযুক্তি","শারীরিক শিক্ষা"];
/* Teacher profile lists (migration-safe): an old single subject /
   class becomes a one-element list; an old "ষষ্ঠ / দশম" classTaken
   string is split on "/" or ","; values are trimmed and deduped.
   The RAW readers below see only the flat / legacy fields — the
   public teacherSubjectsOf / teacherClassesOf derive from the
   per-class map (teacherClassSubjectsOf) and fall back to these. */
function teacherSubjectsOfRaw(t){
  if(!t) return [];
  var raw=[];
  if(Array.isArray(t.subjects)) raw=t.subjects.slice();
  else if(typeof t.subjects==="string" && t.subjects.trim()) raw=[t.subjects.trim()];
  else if(t.subject) raw=[String(t.subject)];
  var out=[];
  raw.forEach(function(s){ s=String(s||"").trim(); if(s && out.indexOf(s)<0) out.push(s); });
  return out;
}
function teacherClassesOfRaw(t){
  if(!t) return [];
  var raw=[];
  if(Array.isArray(t.classes)) raw=t.classes.slice();
  else if(typeof t.classes==="string" && t.classes.trim()) raw=[t.classes.trim()];
  else if(t.classTaken) raw=String(t.classTaken).split(/[\/,]/);
  var out=[];
  raw.forEach(function(c){ c=String(c||"").trim(); if(c && out.indexOf(c)<0) out.push(c); });
  return out;
}
/* Per-class subjects map: t.classSubjects = { className: [subjects] },
   e.g. { "প্রথম": ["বাংলা"], "দ্বিতীয়": ["গণিত"] }.
   MIGRATION (read-time, no data rewrite): an old record with no map
   yet is read as {every listed class: ALL flat subjects} — so an old
   profile keeps working exactly as before, with every subject
   showing under every class until the admin re-saves it per class.
   A stored map with an empty array for a class keeps that class key
   (class ticked, no subject picked yet). */
function teacherClassSubjectsOf(t){
  if(!t) return {};
  var map = {};
  function put(c, s){
    c=String(c||"").trim(); s=String(s||"").trim();
    if(!c || !s) return;
    if(!map[c]) map[c]=[];
    if(map[c].indexOf(s)<0) map[c].push(s);
  }
  if(t.classSubjects && typeof t.classSubjects === "object" && !Array.isArray(t.classSubjects)){
    Object.keys(t.classSubjects).forEach(function(c){
      var v = t.classSubjects[c];
      if(Array.isArray(v)) v.forEach(function(s){ put(c, s); });
      else if(typeof v === "string") put(c, v);
    });
    Object.keys(t.classSubjects).forEach(function(c){
      c=String(c||"").trim();
      if(c && !map[c]) map[c]=[];
    });
    if(Object.keys(map).length) return map;
  }
  var cls = teacherClassesOfRaw(t), subs = teacherSubjectsOfRaw(t);
  cls.forEach(function(c){ map[c]=subs.slice(); });
  return map;
}
/* Flat lists are DERIVED from the map: classes = map keys,
   subjects = union of all mapped values. */
function teacherSubjectsOf(t){
  if(!t) return [];
  var map = teacherClassSubjectsOf(t), out = [];
  Object.keys(map).forEach(function(c){
    (map[c]||[]).forEach(function(s){ if(out.indexOf(s)<0) out.push(s); });
  });
  return out;
}
function teacherClassesOf(t){
  if(!t) return [];
  var keys = Object.keys(teacherClassSubjectsOf(t));
  if(keys.length) return keys;
  return teacherClassesOfRaw(t);
}
/* Subjects mapped to ONE class (result form quick-picks). No map /
   no entry for the class = the teacher's whole flat subject list
   (old records behave exactly as before). */
function teacherSubjectsForClass(t, cls){
  if(!t) return [];
  if(!cls) return teacherSubjectsOf(t);
  var map = teacherClassSubjectsOf(t);
  if(map[cls]) return map[cls].slice();
  return teacherSubjectsOf(t);
}
/* The logged-in teacher's profile record (for per-class subject
   quick-picks). Falls back to the login session's flat lists when
   the teacher record itself is not in D.teachers. */
function teacherProfileForResults(){
  var t = (D.teachers||[]).filter(function(x){ return x.id===ui.teacherId; })[0] || findTeacherByPhoneLocal(teacherPhone);
  if(t) return t;
  if(teacherSession && (teacherSession.classes || teacherSession.subjects)) return { classes: teacherSession.classes || [], subjects: teacherSession.subjects || [] };
  return null;
}
function teacherClassesTaken(){
  var t=(D.teachers||[]).filter(function(x){ return x.id===ui.teacherId; })[0] || findTeacherByPhoneLocal(teacherPhone);
  var list = t ? teacherClassesOf(t) : [];
  if(!list.length && teacherSession && Array.isArray(teacherSession.classes)) list = teacherSession.classes.slice();
  return list.filter(function(c){ return (D.classes||[]).indexOf(c)>=0; });
}
function teacherClassTaken(){
  var list=teacherClassesTaken();
  return list.length ? list[0] : "";
}
/* Class <option>s for a teacher-facing form: when a non-admin teacher
   is logged in and has classes listed, only those classes; otherwise
   every class in D.classes (admin, or a teacher with no list yet). */
function teacherClassOptions(sel){
  var list=(isTeacher() && !isAdmin()) ? teacherClassesTaken() : [];
  var pool=list.length ? list : (D.classes||[]);
  return pool.map(function(c){ return "<option"+(sel===c?" selected":"")+">"+esc(c)+"</option>"; }).join("");
}
/* Submit-side class gate for teacher-published routine / homework /
   exam: a non-admin teacher may only publish for their listed
   classes (empty list = no restriction, as before). */
function teacherClassAllowed(cls){
  if(!isTeacher() || isAdmin()) return true;
  var list=teacherClassesTaken();
  return !list.length || list.indexOf(cls)>=0;
}
function attachIsImage(a){ return !!a && String(a.type||"").indexOf("image/")===0 && String(a.data||"").indexOf("data:image/")===0; }
function safeAttachUrl(a){
  if(!a || !a.data) return "";
  var d=String(a.data), t=String(a.type||"");
  if(d.indexOf("data:image/")===0) return esc(d);
  if(d.indexOf("data:application/pdf")===0 && t==="application/pdf") return esc(d);
  return "";
}
function fileToDocDataUrl(file){
  return new Promise(function(resolve, reject){
    var done=false, timer=setTimeout(function(){ if(!done){ done=true; reject(new Error("timeout")); } }, 15000);
    var rd=new FileReader();
    rd.onload=function(){ if(!done){ done=true; clearTimeout(timer); resolve(rd.result); } };
    rd.onerror=function(){ if(!done){ done=true; clearTimeout(timer); reject(new Error("read")); } };
    try{ rd.readAsDataURL(file); }catch(e){ if(!done){ done=true; clearTimeout(timer); reject(e); } }
  });
}
var resultAttachInput=null;
function ensureResultAttachInput(){
  if(resultAttachInput) return resultAttachInput;
  var inp=document.createElement("input");
  inp.type="file";
  inp.accept="image/*,.pdf,application/pdf";
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;";
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0];
    if(f) handleResultAttachFile(f);
    try{ inp.value=""; }catch(e){}
  });
  document.body.appendChild(inp);
  resultAttachInput=inp;
  return inp;
}
function handleResultAttachFile(file){
  if(!Array.isArray(ui.pendingResultFiles)) ui.pendingResultFiles=[];
  if(ui.pendingResultFiles.length>=RESULT_FILES_MAX){ toast("একটি রেজাল্টে সর্বোচ্চ "+bnNum(RESULT_FILES_MAX)+"টি ফাইল দেওয়া যায়"); return; }
  var name=String(file.name||"ফাইল"), lname=name.toLowerCase();
  if(/\.heic$|\.heif$/.test(lname) || file.type==="image/heic" || file.type==="image/heif"){ toast("এই ছবির ফরম্যাট (HEIC) সমর্থিত নয় — JPG বা PNG ছবি বেছে নিন"); return; }
  var isImage = file.type ? file.type.indexOf("image/")===0 : /\.(jpe?g|png|gif|webp)$/.test(lname);
  var isPdf = file.type==="application/pdf" || /\.pdf$/.test(lname);
  if(!isImage && !isPdf){ toast("শুধু ছবি (JPG/PNG) বা PDF ফাইল দিন"); return; }
  if(isImage && file.size>10*1024*1024){ toast("ছবিটি অনেক বড় (১০ MB-এর বেশি) — ছোট ছবি বেছে নিন"); return; }
  if(!isImage && file.size>3*1024*1024){ toast("PDF ফাইলটি অনেক বড় — ৩ MB-এর নিচে ফাইল দিন"); return; }
  if(isImage){
    fileToDataUrl(file).then(function(url){
      ui.pendingResultFiles.push({ name:name, type:"image/jpeg", data:url, sizeKB:Math.max(1, Math.round(url.length*3/4/1024)) });
      updateResultFilesPreview(); toast("ফাইল যুক্ত হয়েছে — রেজাল্ট দিলে শিক্ষার্থী দেখতে পাবে");
    }).catch(function(){ toast("ফাইল পড়া যায়নি — অন্য ফাইল চেষ্টা করুন"); });
  } else {
    fileToDocDataUrl(file).then(function(url){
      ui.pendingResultFiles.push({ name:name, type:"application/pdf", data:String(url), sizeKB:Math.max(1, Math.round(file.size/1024)) });
      updateResultFilesPreview(); toast("ফাইল যুক্ত হয়েছে — রেজাল্ট দিলে শিক্ষার্থী দেখতে পাবে");
    }).catch(function(){ toast("ফাইল পড়া যায়নি — অন্য ফাইল চেষ্টা করুন"); });
  }
}

  h += files.length

    : '<p class="dim small" style="margin:0 0 8px">ছবি (JPG/PNG) বা PDF ফাইল — PDF সর্বোচ্চ ৩ MB। ফাইল ছাড়াও রেজাল্ট দেওয়া যায়।</p>';
  if(files.length<RESULT_FILES_MAX){
    h+='<div class="row-btns"><button type="button" class="btn ghost small" style="margin:0" data-photo-camera="resultfile">📷 ক্যামেরা</button>'

  }
  return h;

/* ---- Subject-wise marks (rows live in ui state, so a render never
   wipes them; add/remove/chip only update the rows container in
   place, never the whole form) ---- */
function subjectRowsFor(key){
  if(key==="teacher-result"){ if(!Array.isArray(ui.teacherResultSubjects)) ui.teacherResultSubjects=[]; return ui.teacherResultSubjects; }
  if(!Array.isArray(ui.resultSubjects)) ui.resultSubjects=[]; return ui.resultSubjects;
}
function subjectRowsHtml(key){
  var h='<span>বিষয়ভিত্তিক নম্বর (ঐচ্ছিক)</span>';
  var chips = RESULT_SUBJECTS.slice();
  if(key==="teacher-result"){
    /* Per-class quick-picks: the picked class's mapped subjects
       FIRST, then the rest of the standard subjects, then the
       teacher's custom subjects. The form NEVER blocks a subject —
       any subject can still be typed free-text into a row below. */
    var tp = teacherProfileForResults();
    var first = tp ? teacherSubjectsForClass(tp, ui.teacherResultClass || "") : [];
    var ordered = [];
    first.forEach(function(s){ if(ordered.indexOf(s)<0) ordered.push(s); });
    RESULT_SUBJECTS.forEach(function(s){ if(ordered.indexOf(s)<0) ordered.push(s); });
    (tp ? teacherSubjectsOf(tp) : []).forEach(function(s){ if(ordered.indexOf(s)<0) ordered.push(s); });
    chips = ordered;
  }
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+chips.map(function(s){
    return '<button type="button" class="mini-btn" data-act="subject-chip" data-form="'+key+'" data-subject="'+esc(s)+'">'+esc(s)+'</button>';
  }).join("")+'</div>';
  h+='<div id="subjectRows-'+key+'">'+subjectRowsInnerHtml(key)+'</div>';
  h+='<p class="dim small" style="margin:0">বিষয় যোগ করলে নিচের প্রাপ্ত নম্বর ও মোট নম্বর নিজে থেকেই যোগ হয়ে যাবে। বিষয় না দিলে আগের মতো নিজে লিখুন। গ্রেড নিজে বাছতে হয়।</p>';
  return h;
}
function subjectRowsInnerHtml(key){

  }).join("");

function updateSubjectRows(key){

function collectSubjects(key){
  return subjectRowsFor(key).filter(function(rw){ return rw && String(rw.subject||"").trim(); })

}
function subjectSums(key){
  var subs=collectSubjects(key), m=0, t=0;

function subjectBreakdownHtml(r){
  var subs=Array.isArray(r.subjects) ? r.subjects.filter(function(s){ return s && (s.subject||""); }) : [];
  if(!subs.length) return "";
  return '<small>বিষয়: '+subs.map(function(s){ return esc(s.subject)+' '+esc(bnNum(Number(s.marks)||0))+'/'+esc(bnNum(Number(s.total)||0)); }).join(" • ")+'</small>';
}
function resultFilesRowHtml(r){
  var files=Array.isArray(r.files) ? r.files.filter(function(f){ return f && safeAttachUrl(f); }) : [];
  if(!files.length) return "";
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">'+files.map(function(f,i){
    var label=attachIsImage(f) ? "📷 ছবি দেখুন" : "📎 "+esc(f.name||"ফাইল");

  }).join("")+'</div>';
}
function findResultById(id){
  var r=(D.results||[]).filter(function(x){ return x.id===id; })[0];

  if(ui.childData && Array.isArray(ui.childData.results)) return ui.childData.results.filter(function(x){ return x.id===id; })[0] || null;
  return null;
}

/* ---------------- after render: QR ---------------- */
function afterRender(){
  /* Group meeting (Jitsi): mount the meeting once its container is in
     the DOM. If the meeting was ended from another device while this
     one was in it, close the view. */
  if(ui.meetingView){
    var mm = meetingByRoom(ui.meetingView);
    if(!mm || mm.status!=="live"){ closeMeetingView(); render(); return; }
    mountJitsi();
  }
  /* Internet call: the remote audio element is rebuilt with every
     render, so re-attach the live remote stream after each one. */
  callAttachRemoteAudio();
  /* Live chat: while the বার্তা tab is open, keep the thread fresh. */
  if(ui.tab==="guardianmsg"){ fetchGuardianMessages(); if(isGuardian()) scheduleGuardianChatPoll(); }
  if(ui.tab==="complaints") fetchOwnComplaintReplies();
  if(ui.sheet==="camera"){
    var v=document.getElementById("cameraVideo");
    if(v && cameraStream) attachCameraVideo();
    else if(!cameraStarting) startCameraStream();
  }
  if(ui.sheet==="share"){
    var box = document.getElementById("qrBox");
    var link = effectiveShareLink();
    if(box && link){
      var m = makeQrMatrix(link);
      if(m) box.innerHTML = qrToSvg(m, 6) + '<p class="dim small" style="margin:8px 0 0;text-align:center">ক্যামেরা দিয়ে স্ক্যান করলেই অ্যাপ খুলবে</p>';
      else box.innerHTML = '<p class="dim small">লিংকটা অনেক লম্বা, QR বানানো যায়নি।</p>';
    }
  }
}

var logoTaps = { count:0, firstAt:0 };

/* Track whether a finger/mouse is currently down. Background sync uses
   this to hold its re-renders until the tap completes (see
   renderFromSync), so a sync event can never swallow a tap. Capture
   phase, passive, and it never touches the event itself — taps,
   scrolling and the three-dot menu all behave exactly as before. */
document.addEventListener("pointerdown", function(){ pointerDown = true; }, { capture:true, passive:true });
document.addEventListener("pointerup", function(){ pointerDown = false; flushSyncRender(); }, { capture:true, passive:true });
document.addEventListener("pointercancel", function(){ pointerDown = false; flushSyncRender(); }, { capture:true, passive:true });

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el){
    if(ui.sheet && e.target.classList && e.target.classList.contains("sheet-scrim")){ stopCameraStream(); ui.sheet=null; render(); }
    return;
  }
  var act = el.getAttribute("data-act");
  if(act==="sheet-scrim") return;
  if(act==="toggle-menu"){ ui.menuOpen=!ui.menuOpen; render(); }
  else if(act==="close-menu"){ ui.menuOpen=false; render(); }
  else if(act==="goto"){
    var wasMenuOpen = ui.menuOpen;
    ui.tab=el.getAttribute("data-tab"); ui.menuOpen=false; ui.studentDetailId=null; ui.myChildId=null;
    if(ui.tab!=="guardianmsg") stopGuardianChatPoll();
    // From the tab bar this takes the fast path — the switch happens in
    // this same tap, never waiting on a full-page rebuild or on sync.
    if(wasMenuOpen) render(); else renderTabSwitch();
    window.scrollTo(0,0);
  }
  else if(act==="goto-admin"){ ui.tab="admin"; ui.menuOpen=false; render(); }
  else if(act==="open-login"){ ui.adminRevealed=true; ui.tab="admin"; ui.menuOpen=false; ensurePrivateLoaded(); render(); window.scrollTo(0,0); }
  else if(act==="logo-tap"){
    var now=Date.now();
    if(now-logoTaps.firstAt>2500){ logoTaps={count:1,firstAt:now}; }
    else { logoTaps.count++; if(logoTaps.count>=5){ logoTaps={count:0,firstAt:0}; ui.adminRevealed=true; ui.tab="admin"; ensurePrivateLoaded(); render(); } }
  }
  else if(act==="refresh"){
    /* A second tap while a refresh is already running does nothing —
       the button is disabled and spinning, so the app can never stack
       several slow Firebase fetches on top of each other. */
    if(refreshing) return;
    ui.menuOpen=false;
    startRefreshSpin();
    /* finishRefresh(false) is already armed on a 5-second timer inside
       startRefreshSpin(), so a slow/stuck Firebase can never leave the
       spinner on or the app looking frozen. */
    if(restMode){
      restFetchPublic(true).then(function(){ finishRefresh(syncStatus==="live"); }).catch(function(){ finishRefresh(false); });
    }
    else if(fbPub && fbReady){
      try{
        fbPub.once("value").then(function(snap){ var v=snap.val(); if(v&&v.settings){ var ka=D.admins, kg=D.guardians||[], kau=D.adminUids||{}, kp=privateData(D).phones, kc=D.complaints||[], kr=privLoaded?(D.results||[]):[], kf=privLoaded?(D.fees||[]):[], kt=D.teacherAccounts||[], kq=D.quizzes||[], kqa=privLoaded?(D.quizAttempts||[]):[]; D=v; D.admins=ka; D.guardians=kg; D.adminUids=kau; D.complaints=kc; D.results=kr; D.fees=kf; D.teacherAccounts=kt; D.quizzes=kq; D.quizAttempts=kqa; D.students.forEach(function(s){ delete s.guardianPhone; delete s.guardianPhones; if(kp["s_"+s.id]!==undefined && kp["s_"+s.id]!==null) restoreStudentPhones(s, kp["s_"+s.id]); }); D.teachers.forEach(function(t){ delete t.phone; if(kp["t_"+t.id]) t.phone=kp["t_"+t.id]; }); persistLocal(); } finishRefresh(true); }, function(){ finishRefresh(false); });
      }catch(e){ finishRefresh(false); }
    }
    else finishRefresh(true);
  }
  else if(act==="notify-enable"){ requestNotifyPermission(); }
  else if(act==="notify-later"){
    try{ sessionStorage.setItem(NOTIFY_LATER_KEY,"1"); }catch(err){}
    render();
  }
  else if(act==="notify-open"){
    ui.menuOpen=false;
    try{ sessionStorage.removeItem(NOTIFY_LATER_KEY); }catch(err){}
    if(notifySupported() && Notification.permission==="default") render();
    else requestNotifyPermission();
  }
  else if(act==="fcm-test"){
    sendFcmPush({ id: "test" + Date.now(), title: "টেস্ট নোটিফিকেশন — পুশ ঠিকমতো কাজ করছে" });
  }
  else if(act==="open-share"){ ui.sheet="share"; ui.menuOpen=false; render(); }
  else if(act==="open-install"){ ui.sheet="install"; ui.menuOpen=false; render(); }
  else if(act==="open-apk"){ ui.sheet="apk"; ui.menuOpen=false; render(); }
  else if(act==="pwa-install"){
    if(deferredInstallPrompt){
      var dp = deferredInstallPrompt; deferredInstallPrompt = null;

        dp.prompt();
        if(dp.userChoice) dp.userChoice.then(function(choice){
          if(choice && choice.outcome==="accepted"){ ui.sheet=null; render(); toast("অ্যাপ ইনস্টল হচ্ছে — হোম স্ক্রিনে আইকনটা দেখুন"); }
        }).catch(function(){});
      }catch(err){ ui.sheet="install"; render(); }
    } else {
      toast("এই ফোনে সরাসরি ইনস্টলের জানালা আসেনি — নিচের ধাপ ধরে বসিয়ে নিন");

function fileToDataUrl(file, maxW){
  return new Promise(function(resolve, reject){
    var done=false;
    function ok(v){ if(!done){ done=true; resolve(v); } }
    function bad(e){ if(!done){ done=true; reject(e||new Error("img")); } }
    var url;
    try{ url=URL.createObjectURL(file); }catch(e){ bad(e); return; }
    var timer=setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} bad(new Error("timeout")); }, 60000);
    var img=new Image();
    img.onload=function(){
      clearTimeout(timer);
      try{
        URL.revokeObjectURL(url);
        if(!img.width || !img.height){ bad(new Error("size")); return; }
        var mw=maxW||800, scale=img.width>mw?mw/img.width:1;
        var cv=document.createElement("canvas");
        cv.width=Math.max(1, Math.round(img.width*scale)); cv.height=Math.max(1, Math.round(img.height*scale));
        var cx=cv.getContext("2d"); if(!cx){ bad(new Error("canvas")); return; }
        cx.drawImage(img,0,0,cv.width,cv.height);
        ok(cv.toDataURL("image/jpeg",0.8));
      }catch(e){ bad(e); }
    };
    img.onerror=function(){ clearTimeout(timer); try{ URL.revokeObjectURL(url); }catch(e){} bad(new Error("img")); };
    img.src=url;
  });
}

/* ---- Photo picking — MADRASA mechanism (proven on this phone) ----
   ONE persistent file input, created once and kept OUTSIDE #app
   (appended to <body>), with its own direct change listener — a
   render() can never destroy it mid-pick. The input is
   display:none, exactly like the madrasa's: the madrasa app proves
   a programmatic .click() opens it on this phone. Picking updates
   only the preview image in place — the form and its typed values
   are never rebuilt. NOTE for the APK: the WebView needs a
   WebChromeClient with onShowFileChooser, and onActivityResult
   must deliver the result to filePathCallback.onReceiveValue —
   that lives in the APK's MainActivity.java, not in this file. */
var photoInput=null, pendingPhotoKind="";
/* Instant photo preview state (profile kinds only): a picked photo is
   shown at once from a blob URL while the storable data URL is still
   being made in the background. photoDecoding blocks saving until the
   data URL lands; photoPickSeq drops stale decodes when a newer pick
   (or a camera capture) supersedes them; photoBlobUrl/photoPrevUrl let
   the preview be revoked and put back on failure. The blob URL is
   DISPLAY-ONLY — it is never stored in ui.pending*Photo or Firebase. */
var photoDecoding={}, photoBlobUrl={}, photoPrevUrl={}, photoPickSeq={}, photoWatchdogId={};
function clearPhotoPickState(kind){
  /* Abandon an in-flight pick for this kind (form cancelled, or the
     user switched to another record): stop the patient's notice, drop
     the blob preview, and make a late decode discard itself. */
  photoDecoding[kind]=false;
  if(photoWatchdogId[kind]){ try{ clearTimeout(photoWatchdogId[kind]); }catch(e){} photoWatchdogId[kind]=0; }
  if(photoBlobUrl[kind]){ try{ URL.revokeObjectURL(photoBlobUrl[kind]); }catch(e){} photoBlobUrl[kind]=""; }
  photoPrevUrl[kind]="";
  photoPickSeq[kind]=(photoPickSeq[kind]||0)+1;
}
function ensurePhotoInput(){
  if(photoInput) return photoInput;
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.style.display="none";
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0];
    if(f) handlePhotoFile(f);
    try{ inp.value=""; }catch(e){}
  });
  document.body.appendChild(inp);
  photoInput=inp;
  return inp;
}
/* Shared success path for a picked photo — gallery pick AND camera
   capture both end here: store the pending photo for the kind, update
   the preview/thumbs, toast. (Lifted out of handlePhotoFile so the
   synchronous camera capture can use the exact same path.) */
function applyPickedPhotoUrl(kind, url){
  if(kind==="student") ui.pendingStudentPhoto=url;
  else if(kind==="teacher") ui.pendingTeacherPhoto=url;
  else if(kind==="founder") ui.pendingFounderPhoto=url;
  else if(kind==="logo") ui.pendingLogo=url;
  else if(kind==="homework"){
    if(!Array.isArray(ui.pendingHomeworkPhotos)) ui.pendingHomeworkPhotos=[];
    if(ui.pendingHomeworkPhotos.length>=HOMEWORK_PHOTOS_MAX){ toast("একটি হোমওয়ার্কে সর্বোচ্চ "+bnNum(HOMEWORK_PHOTOS_MAX)+"টি ছবি দেওয়া যায়"); return; }
    ui.pendingHomeworkPhotos.push(url);
    updateHomeworkPhotoThumbs();
    toast("ছবি যোগ হয়েছে — হোমওয়ার্ক দিলে ছবিটাও যাবে");
    return;
  }
  else if(kind==="resultfile"){
    if(!Array.isArray(ui.pendingResultFiles)) ui.pendingResultFiles=[];
    if(ui.pendingResultFiles.length>=RESULT_FILES_MAX){ toast("একটি রেজাল্টে সর্বোচ্চ "+bnNum(RESULT_FILES_MAX)+"টি ফাইল দেওয়া যায়"); return; }
    ui.pendingResultFiles.push({ name:"ছবি "+bnNum(ui.pendingResultFiles.length+1), type:"image/jpeg", data:url, sizeKB:Math.max(1, Math.round(url.length*3/4/1024)) });
    updateResultFilesPreview();
    toast("ছবি যোগ হয়েছে — রেজাল্ট দিলে ছবিটাও যাবে");
    return;
  }
  updatePhotoPreview(kind, url);
  /* The background decode finished: the preview now shows the storable
     data URL, so the instant blob URL can go and the save guard lifts. */
  if(photoDecoding[kind]){ photoDecoding[kind]=false; if(photoBlobUrl[kind]){ try{ URL.revokeObjectURL(photoBlobUrl[kind]); }catch(e){} photoBlobUrl[kind]=""; } }
  toast("ছবি বেছে নেওয়া হয়েছে — নিচে সংরক্ষণ করুন");
}
function photoDecodeFailed(kind){
  /* Total decode failure (canvas + FileReader both failed): drop the
     in-flight flag, throw away the instant blob preview and put the
     old preview back, so no broken image or stuck flag stays behind. */
  if(kind==="student"||kind==="teacher"||kind==="founder"||kind==="logo"){
    photoDecoding[kind]=false;
    if(photoBlobUrl[kind]){ try{ URL.revokeObjectURL(photoBlobUrl[kind]); }catch(e){} photoBlobUrl[kind]=""; }
    revertPhotoPreview(kind);
  }
  toast("ছবি পড়া যায়নি — অন্য ছবি চেষ্টা করুন");
}
function revertPhotoPreview(kind){
  /* Undo an instant blob preview after a failed decode: put back
     whatever the preview showed before the pick (the old photo, or
     the avatar fallback if there was none). Safe after a re-render
     too — the render already rebuilds the preview from the old
     state, so this only touches the live DOM. */
  var btn=document.querySelector('[data-photo-pick="'+kind+'"]');
  if(!btn) return;
  var box=btn.closest ? btn.closest(".photo-pick") : null;
  if(!box) box=btn.parentElement;
  if(!box) return;
  var img=box.querySelector("img");
  var prev=photoPrevUrl[kind]||"";
  if(prev){
    if(img){ img.src=prev; return; }
    var ni=document.createElement("img"); ni.src=prev; ni.alt=""; var fb=box.querySelector(".avatar-fallback"); if(fb) fb.replaceWith(ni); return;
  }
  if(img){ var sp=document.createElement("span"); sp.className="avatar-fallback"; sp.style.cssText="width:64px;height:64px;border-radius:12px"; sp.innerHTML=icon("users"); img.replaceWith(sp); }
}
function handlePhotoFile(file){
  var kind=pendingPhotoKind||"student";
  var name=String(file.name||"").toLowerCase();
  if(/\.heic$|\.heif$/.test(name) || file.type==="image/heic" || file.type==="image/heif"){ toast("এই ছবির ফরম্যাট (HEIC) সমর্থিত নয় — JPG বা PNG ছবি বেছে নিন"); return; }
  if(file.type && file.type.indexOf("image/")!==0){ toast("শুধু ছবির ফাইল বেছে নিন"); return; }
  if(file.size>10*1024*1024){ toast("ছবিটি অনেক বড় (১০ MB-এর বেশি) — ছোট ছবি বেছে নিন"); return; }
  /* Patient notice: if the photo is still unread after 60 s (a large or
     cloud-stored photo downloading over a slow connection), say so once
     and KEEP WAITING — never tell the user to retry, or the slow read
     restarts from zero and can never finish. */
  /* A newer pick for this kind supersedes the previous one: stop the
     old patient's notice so it can never fire after the new pick. */
  if(photoWatchdogId[kind]){ try{ clearTimeout(photoWatchdogId[kind]); }catch(e){} photoWatchdogId[kind]=0; }
  var photoDone=false;
  var photoWatchdog=setTimeout(function(){
    if(photoDone) return;
    toast("ছবি পড়া হচ্ছে — একটু অপেক্ষা করুন");
  }, 60000);
  photoWatchdogId[kind]=photoWatchdog;
  function markPhotoDone(){ if(photoDone) return; photoDone=true; clearTimeout(photoWatchdog); }
  /* ID-card scan from the camera/gallery: read the card text instead of
     saving the picture as a photo. (The scan flag expires after 3 min,
     so abandoning the camera can never hijack a later photo pick.) */
  if(idcardScanActive()){
    idcardScanAt=0;
    fileToDataUrl(file, 2000).then(function(url){ markPhotoDone(); openIdCardRotateSheet(url); }).catch(function(){ markPhotoDone(); idcardSetStatus("❌ ছবি পড়া যায়নি — আবার চেষ্টা করুন"); toast("ছবি পড়া যায়নি — আবার চেষ্টা করুন"); });
    return;
  }
  /* INSTANT PREVIEW (profile kinds only): show the photo at once from
     a blob URL — URL.createObjectURL is synchronous, no decode, no
     waiting. The blob URL is display-only: ui.pending*Photo is only
     set later, by the background decode's data URL. */
  var isProfileKind=(kind==="student"||kind==="teacher"||kind==="founder"||kind==="logo");
  var mySeq=0;
  if(isProfileKind){
    mySeq=(photoPickSeq[kind]||0)+1; photoPickSeq[kind]=mySeq;
    if(photoBlobUrl[kind]){ try{ URL.revokeObjectURL(photoBlobUrl[kind]); }catch(e){} photoBlobUrl[kind]=""; }
    var blobUrl=null;
    try{ blobUrl=URL.createObjectURL(file); }catch(e){ blobUrl=null; }
    if(blobUrl){
      var _pb=document.querySelector('[data-photo-pick="'+kind+'"]');
      var _pbox=_pb && _pb.closest ? _pb.closest(".photo-pick") : (_pb ? _pb.parentElement : null);
      var _pimg=_pbox ? _pbox.querySelector("img") : null;
      photoPrevUrl[kind]=_pimg ? (_pimg.getAttribute("src")||"") : "";
      photoDecoding[kind]=true;
      photoBlobUrl[kind]=blobUrl;
      updatePhotoPreview(kind, blobUrl);
      toast("ছবি বেছে নেওয়া হয়েছে — নিচে সংরক্ষণ করুন");
    }
  }
  /* Success path (canvas route + FileReader fallback below) goes through
     the shared applyPickedPhotoUrl(kind, url). */
  fileToDataUrl(file).then(function(url){ markPhotoDone(); if(isProfileKind && photoPickSeq[kind]!==mySeq) return; applyPickedPhotoUrl(kind, url); }).catch(function(){
    if(isProfileKind && photoPickSeq[kind]!==mySeq) return; /* superseded by a newer pick */
    /* Canvas decode failed (unusual format, huge image, canvas OOM):
       fall back to the raw file as a data URL — no 800px compression,
       but the photo still gets in. */
    try{
      var rd=new FileReader();
      rd.onload=function(){
        var u=String(rd.result||"");
        markPhotoDone();
        if(isProfileKind && photoPickSeq[kind]!==mySeq) return;
        if(u.indexOf("data:image/")===0) applyPickedPhotoUrl(kind, u);
        else photoDecodeFailed(kind);
      };
      rd.onerror=function(){ markPhotoDone(); if(isProfileKind && photoPickSeq[kind]!==mySeq) return; photoDecodeFailed(kind); };
      rd.readAsDataURL(file);
    }catch(e){ markPhotoDone(); if(isProfileKind && photoPickSeq[kind]!==mySeq) return; photoDecodeFailed(kind); }
  });
}
function updatePhotoPreview(kind, url){
  var btn=document.querySelector('[data-photo-pick="'+kind+'"]');
  if(!btn) return;
  /* The pick button sits directly in the .photo-pick container
     (madrasa mechanism — two plain buttons, no overlay input), so
     the preview box is the .photo-pick container. */
  var box=btn.closest ? btn.closest(".photo-pick") : null;
  if(!box) box=btn.parentElement;
  if(!box) return;
  var img=box.querySelector("img");
  if(img){ img.src=url; return; }
  var fb=box.querySelector(".avatar-fallback");
  if(fb){ var ni=document.createElement("img"); ni.src=url; ni.alt=""; fb.replaceWith(ni); }
}
/* Gallery pick — MADRASA mechanism: the "ছবি বেছে নিন" button is a
   plain button (no input in the form). The tap is caught here, the
   kind is recorded, and the shared hidden input is opened with

   -> handlePhotoFile. */

  var b=e.target && e.target.closest ? e.target.closest("[data-photo-pick]") : null;
  if(!b) return;
  pendingPhotoKind=b.getAttribute("data-photo-pick");

});

/* Hash-login fallback for guardians (used when Auth is not enabled,
   or the account predates Auth). Verifies the stored SHA-256 hash, then
   tries to link/create the Auth user so the next login goes through Auth. */
function guardianLoginHashFallback(gph, gpw, done){
  loadGuardianAccount(gph, function(acc){
    if(!acc){ toast("এই ফোন নম্বরে কোনো শিক্ষার্থী অ্যাকাউন্ট পাওয়া যায়নি — আগে সাইন আপ করুন, আর অ্যাডমিন আপনার ফোন নম্বরে শিক্ষার্থী নিবন্ধিত করেছেন কিনা দেখুন"); return; }
    hashPw(gph, gpw).then(function(h){
      if(h!==acc.pwHash){ toast("পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।"); return; }
      linkGuardianAuth(gph, gpw, acc);
      done(acc);
    });
  });
}

/* Hash-login fallback for admins (Auth not enabled, or the account
   predates Auth). Verifies the stored hash, then links Auth. */
function adminLoginHashFallback(ph, pw2, adm, done){
  hashPw(ph,pw2).then(function(h){
    if(h===adm.pwHash){
      linkAdminAuth(adm, pw2);
      done();
    } else toast("পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।");
  });
}

function parseFirebaseConfig(raw){
  if(!raw) return null;
  try{ var j=JSON.parse(raw); if(j && j.apiKey) return j; }catch(e){}
  // Extract key: "value" pairs from a pasted JS object literal.
  var cfg={};
  var re=/(\w+)\s*:\s*"([^"]*)"/g, m;
  while((m=re.exec(raw))!==null){ cfg[m[1]]=m[2]; }
  if(cfg.apiKey && (cfg.databaseURL || cfg.projectId)) return cfg;
  return null;
}

/* ================================================================
   QR generator (byte mode, ECC M) — drawn locally, no external service
   ================================================================ */
var QR_VERSIONS=[[1,26,10,[16],[0,0],0],[2,44,16,[28],[6,18],7],[3,70,26,[44],[6,22],7],[4,100,18,[32,32],[6,26],7],[5,134,24,[43,43],[6,30],7],[6,172,16,[27,27,27,27],[6,34],7],[8,242,22,[38,38,39,39],[6,24,42],0]];
var QR_CAP={1:14,2:26,3:42,4:62,5:84,6:106,8:152};
function gfMul(x,y){ var z=0; for(var i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11d); if(((y>>>i)&1)!==0) z^=x; } return z; }
function rsDivisor(deg){ var r=[]; for(var i=0;i<deg;i++) r.push(0); r[deg-1]=1; var root=1;
  for(var i2=0;i2<deg;i2++){ for(var j=0;j<r.length;j++){ r[j]=gfMul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=gfMul(root,2); } return r; }
function rsRemainder(data,div){ var r=[]; for(var i=0;i<div.length;i++) r.push(0);
  data.forEach(function(b){ var f=b^(r.shift()||0); r.push(0); div.forEach(function(c,idx){ r[idx]^=gfMul(c,f); }); }); return r; }
function makeQrMatrix(text){
  var bytes=[]; var enc=new TextEncoder().encode(text); for(var i=0;i<enc.length;i++) bytes.push(enc[i]);
  var spec=null;
  for(var v2=0;v2<QR_VERSIONS.length;v2++){ if(bytes.length<=QR_CAP[QR_VERSIONS[v2][0]]){ spec=QR_VERSIONS[v2]; break; } }
  if(!spec) return null;
  var version=spec[0], eccPerBlock=spec[2], blockLens=spec[3], align=spec[4], remBits=spec[5];
